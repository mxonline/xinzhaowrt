name: Arthur Headless Production Deploy

'on':
  push:
    branches:
      - codex/arthur-fast-candidate
    paths:
      - 'ai_orchestrator/**'
      - 'production/pipeline-policy.json'
      - 'requirements-headless.txt'
      - 'scripts/start-headless-production.ps1'
      - 'scripts/install-headless-production.ps1'
      - 'tests/headless-production-deploy.tests.ps1'
      - '.github/workflows/headless-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arthur-headless-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 20

    steps:
      - name: Checkout active Arthur production branch
        uses: actions/checkout@v4
        with:
          ref: codex/arthur-fast-candidate
          fetch-depth: 1

      - name: Bootstrap uv
        uses: astral-sh/setup-uv@v6

      - name: Validate headless persistence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/headless-production-deploy.tests.ps1

      - name: Bootstrap persistent Python 3.12 and dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonHome = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython'
          $managedPython = Join-Path $pythonHome 'python'
          $uvCache = Join-Path $pythonHome 'cache'
          $venv = Join-Path $pythonHome '.venv'
          New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null

          $env:UV_PYTHON_INSTALL_DIR = $managedPython
          $env:UV_CACHE_DIR = $uvCache
          uv python install 3.12
          if ($LASTEXITCODE -ne 0) { throw 'uv managed Python 3.12 install failed.' }

          uv venv $venv --python 3.12 --clear
          if ($LASTEXITCODE -ne 0) { throw 'uv persistent venv creation failed.' }

          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          if (-not (Test-Path $pythonExe)) {
            throw "Persistent Python executable was not created: $pythonExe"
          }

          uv pip install --python $pythonExe -r requirements-headless.txt
          if ($LASTEXITCODE -ne 0) { throw 'Headless dependency installation failed.' }

          & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Persistent Python/Codex SDK verification failed.' }

          "HEADLESS_PYTHON_EXE=$pythonExe" >> $env:GITHUB_ENV
          Write-Host "HEADLESS_PYTHON=PASS interpreter=$pythonExe"
          Write-Host 'HEADLESS_CODEX_SDK_IMPORT=PASS'

      - name: Quiesce previous headless runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessProduction'
          $stateDir = Join-Path $runtime 'output\headless-production'
          $stopper = Join-Path $runtime 'scripts\start-headless-production.ps1'
          if (Test-Path $stopper) {
            try {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stopper -Command stop -StateDir $stateDir | Out-Null
            } catch {
              Write-Warning "Existing runtime stop marker failed: $($_.Exception.Message)"
            }
          }
          if (Get-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Headless-Production' -ErrorAction SilentlyContinue) {
            Stop-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Headless-Production' -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3
          Write-Host 'HEADLESS_RUNTIME_QUIESCE=PASS'

      - name: Sync persistent headless runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessProduction'
          $workspace = $env:GITHUB_WORKSPACE
          $repo = 'https://github.com/mxonline/xinzhaowrt.git'
          $sourceSha = (git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve checked-out Arthur production source SHA.'
          }

          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          if (-not (Test-Path (Join-Path $runtime '.git'))) {
            git -C $runtime init
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize persistent headless runtime repository.' }
            git -C $runtime remote add origin $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to configure persistent runtime origin.' }
          } else {
            $origin = git -C $runtime remote get-url origin 2>$null
            if ($LASTEXITCODE -eq 0) {
              git -C $runtime remote set-url origin $repo
            } else {
              git -C $runtime remote add origin $repo
            }
            if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize persistent runtime origin.' }
          }

          # Import the already checked-out source over the local filesystem. Do not add
          # a second network clone/fetch boundary while deploying the controller.
          git -C $runtime fetch --force $workspace 'HEAD:refs/remotes/deploy/active'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to import active Arthur source from GITHUB_WORKSPACE.' }
          git -C $runtime checkout -B codex/arthur-fast-candidate refs/remotes/deploy/active
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout active Arthur source in the persistent runtime.' }
          git -C $runtime reset --hard $sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'Failed to synchronize persistent runtime to source SHA.' }
          git -C $runtime config branch.codex/arthur-fast-candidate.remote origin
          git -C $runtime config branch.codex/arthur-fast-candidate.merge refs/heads/codex/arthur-fast-candidate

          $runtimeSha = (git -C $runtime rev-parse HEAD).Trim()
          if ($runtimeSha -ne $sourceSha) {
            throw "HEADLESS_RUNTIME_SHA_MISMATCH source=$sourceSha runtime=$runtimeSha"
          }
          $runtimeOrigin = (git -C $runtime remote get-url origin).Trim()
          if ($runtimeOrigin -ne $repo) {
            throw "HEADLESS_RUNTIME_ORIGIN_MISMATCH origin=$runtimeOrigin"
          }
          Write-Host "HEADLESS_RUNTIME=$runtime"
          Write-Host "HEADLESS_RUNTIME_SHA=$runtimeSha"
          Write-Host "HEADLESS_RUNTIME_ORIGIN=$runtimeOrigin"
          Write-Host 'HEADLESS_RUNTIME_LOCAL_SYNC=PASS'

      - name: Verify persistent GitHub authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) {
            throw 'NEW_CREDENTIAL_PROVISIONING: persistent gh credential store is unavailable to the Windows controller user.'
          }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Persistent GitHub authentication cannot configure git credential routing.' }
          Write-Host 'PERSISTENT_GITHUB_AUTH=PASS'

      - name: Install and start persistent GPT Codex runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessProduction'
          $installer = Join-Path $runtime 'scripts\install-headless-production.ps1'
          $pythonExe = $env:HEADLESS_PYTHON_EXE
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path $pythonExe)) {
            throw "Pinned headless Python interpreter is unavailable: $pythonExe"
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer -PythonExe $pythonExe
          if ($LASTEXITCODE -ne 0) { throw "Headless runtime install failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 8
          $task = Get-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Headless-Production' -ErrorAction Stop
          Write-Host "HEADLESS_TASK_STATE=$($task.State)"
          Push-Location $runtime
          try {
            & $pythonExe -m ai_orchestrator status --state-dir (Join-Path $runtime 'output\headless-production')
            if ($LASTEXITCODE -ne 0) { throw "Headless runtime status failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Write-Host 'HEADLESS_PRODUCTION_DEPLOY=PASS'
