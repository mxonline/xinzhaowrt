name: Arthur Headless Production Deploy

'on':
  push:
    branches:
      - codex/arthur-fast-candidate
    paths:
      - 'ai_orchestrator/**'
      - 'production/current-changeset.json'
      - 'production/pipeline-policy.json'
      - 'requirements-headless.txt'
      - 'scripts/start-headless-production.ps1'
      - 'scripts/install-headless-production.ps1'
      - 'tests/headless-production-deploy.tests.ps1'
      - '.github/workflows/headless-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arthur-headless-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 20

    steps:
      - name: Checkout active Arthur production branch
        uses: actions/checkout@v4
        with:
          ref: codex/arthur-fast-candidate
          fetch-depth: 1

      - name: Validate headless persistence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/headless-production-deploy.tests.ps1

      - name: Validate Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3 -c "import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'HEADLESS_PYTHON=PASS launcher=py'
              exit 0
            }
          }
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'HEADLESS_PYTHON=PASS launcher=python'
              exit 0
            }
          }
          throw 'RUNTIME_REQUIRED: Python 3.10+ is required for the headless production runtime.'

      - name: Sync persistent headless runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessProduction'
          $workspace = $env:GITHUB_WORKSPACE
          $sourceSha = (git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve checked-out Arthur production source SHA.'
          }

          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          if (-not (Test-Path (Join-Path $runtime '.git'))) {
            git -C $runtime init
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize persistent headless runtime repository.' }
          }

          # Import the already checked-out source over the local filesystem. Do not add
          # a second network clone/fetch boundary while deploying the controller.
          git -C $runtime fetch --force $workspace 'HEAD:refs/remotes/deploy/active'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to import active Arthur source from GITHUB_WORKSPACE.' }
          git -C $runtime checkout -B codex/arthur-fast-candidate refs/remotes/deploy/active
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout active Arthur source in the persistent runtime.' }
          git -C $runtime reset --hard $sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'Failed to synchronize persistent runtime to source SHA.' }

          $runtimeSha = (git -C $runtime rev-parse HEAD).Trim()
          if ($runtimeSha -ne $sourceSha) {
            throw "HEADLESS_RUNTIME_SHA_MISMATCH source=$sourceSha runtime=$runtimeSha"
          }
          Write-Host "HEADLESS_RUNTIME=$runtime"
          Write-Host "HEADLESS_RUNTIME_SHA=$runtimeSha"
          Write-Host 'HEADLESS_RUNTIME_LOCAL_SYNC=PASS'

      - name: Verify persistent GitHub authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) {
            throw 'NEW_CREDENTIAL_PROVISIONING: persistent gh credential store is unavailable to the Windows controller user.'
          }
          Write-Host 'PERSISTENT_GITHUB_AUTH=PASS'

      - name: Install and start persistent GPT Codex runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessProduction'
          $installer = Join-Path $runtime 'scripts\install-headless-production.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
          if ($LASTEXITCODE -ne 0) { throw "Headless runtime install failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 8
          $task = Get-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Headless-Production' -ErrorAction Stop
          Write-Host "HEADLESS_TASK_STATE=$($task.State)"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $runtime 'scripts\start-headless-production.ps1') -Command status -StateDir (Join-Path $runtime 'output\headless-production')
          if ($LASTEXITCODE -ne 0) { throw "Headless runtime status failed: $LASTEXITCODE" }
          Write-Host 'HEADLESS_PRODUCTION_DEPLOY=PASS'
