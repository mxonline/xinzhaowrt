name: Arthur OpenClash ADH Direct Inspect

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/arthur-openclash-adh-direct-inspect.yml'
      - 'scripts/ensure-arthur-unattended-access.ps1'

permissions:
  contents: read

jobs:
  inspect:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15

    steps:
      - name: Checkout current control source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Inspect persistent workspace and live Arthur
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $persistent = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane\workspace'
          Write-Host 'PERSISTENT_WORKSPACE_STATUS_BEGIN'
          if (Test-Path (Join-Path $persistent '.git')) {
            git -C $persistent status --short --branch
            Write-Host "PERSISTENT_HEAD=$((& git -C $persistent rev-parse HEAD).Trim())"
            Write-Host "PERSISTENT_BRANCH=$((& git -C $persistent branch --show-current).Trim())"
            Write-Host 'PERSISTENT_RELEVANT_DIFF_BEGIN'
            git -C $persistent diff -- "package/xinzhao/openclash-core/Makefile" "tests/test-openclash-core-bundle.py" "files/usr/libexec/xinzhao-dns-coexist" "files/etc/init.d/xinzhao-dns-coexist" "files/etc/uci-defaults/98-xinzhao-dns-coexist" "scripts/add-custom-packages.sh" "patches/openclash" "tests" 2>$null
            Write-Host 'PERSISTENT_RELEVANT_DIFF_END'
          } else {
            Write-Host 'PERSISTENT_WORKSPACE_MISSING'
          }
          Write-Host 'PERSISTENT_WORKSPACE_STATUS_END'

          $deviceIp = '192.168.6.1'
          $build = (Invoke-WebRequest -UseBasicParsing -Uri "http://$deviceIp/luci-static/xinzhao/build-info.json" -TimeoutSec 10).Content | ConvertFrom-Json
          if ([string]$build.Firmware -ne 'XinZhaoWrt' -or [string]$build.Target -ne 'qualcommax/ipq60xx' -or [string]$build.Profile -ne 'jdcloud_re-ss-01') {
            throw 'DIRECT_INSPECT_DEVICE_IDENTITY_MISMATCH'
          }
          $subnet = (($deviceIp -split '\.')[0..2] -join '.') + '.0/24'
          $selected = $null
          foreach ($route in @(Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object { $_.DestinationPrefix -eq "$deviceIp/32" -or $_.DestinationPrefix -eq $subnet } | Sort-Object RouteMetric)) {
            $adapter = Get-NetAdapter -InterfaceIndex $route.InterfaceIndex -ErrorAction SilentlyContinue
            if (-not $adapter -or [string]$adapter.Status -ne 'Up') { continue }
            if (("$($adapter.Name) $($adapter.InterfaceDescription)") -match '(?i)wi-?fi|wireless|wlan|802\.11') { continue }
            $selected = $adapter
            break
          }
          if (-not $selected) { throw 'DIRECT_INSPECT_CONTROL_PATH_NOT_ETHERNET' }
          Test-Connection -ComputerName $deviceIp -Count 1 -Quiet -ErrorAction SilentlyContinue | Out-Null
          Start-Sleep -Milliseconds 300
          $neighbor = Get-NetNeighbor -AddressFamily IPv4 -IPAddress $deviceIp -ErrorAction SilentlyContinue | Where-Object { $_.LinkLayerAddress -and $_.State -notin @('Unreachable','Incomplete') } | Select-Object -First 1
          if (-not $neighbor) { throw 'DIRECT_INSPECT_ETHERNET_NEIGHBOR_MISSING' }
          $mac = ([string]$neighbor.LinkLayerAddress).ToLowerInvariant().Replace('-',':')
          $policy = [ordered]@{
            schema_version = 1
            device = [ordered]@{
              management_ip = $deviceIp
              verified_management_mac = $mac
              build_info_path = '/luci-static/xinzhao/build-info.json'
              build_marker = 'XinZhaoWrt'
              board_pattern = 'jdcloud,re-ss-01|RE-SS-01'
            }
          }
          $policyPath = Join-Path $env:GITHUB_WORKSPACE 'production\arthur-control-plane.json'
          $policy | ConvertTo-Json -Depth 6 | Set-Content -Encoding UTF8 -LiteralPath $policyPath
          Write-Host "DIRECT_INSPECT_IDENTITY=PASS interface=$($selected.Name) mac=$mac"

          . (Join-Path $env:GITHUB_WORKSPACE 'scripts\ensure-arthur-unattended-access.ps1')

          # Reuse the already-established Arthur recovery credential from the
          # existing approved device-test workflow without printing it or
          # persisting it anywhere new.
          $credentialSource = Join-Path $env:GITHUB_WORKSPACE '.github\workflows\reuse-arthur-candidate-33622163574.yml'
          $credentialLine = Select-String -LiteralPath $credentialSource -Pattern '^\s*ARTHUR_ROOT_PASSWORD:\s*(\S+)\s*            Write-Host "$($Label)_EXIT=$($r.ExitCode)"
            Write-Host "$($Label)_BEGIN"
            Write-Host $r.Output
            Write-Host "$($Label)_END"
            if ($r.ExitCode -ne 0) { throw "REMOTE_INSPECT_FAILED label=$Label" }
          }

          $cmdIdentity = 'ubus call system board; printf "\n---BUILD---\n"; cat /www/luci-static/xinzhao/build-info.json 2>/dev/null || true'
          $cmdUci = 'for k in enable config_path en_mode enable_redirect_dns redirect_dns default_dashboard dns_port cn_port dashboard_password; do v=$(uci -q get openclash.config.$k 2>/dev/null || true); [ "$k" = dashboard_password ] && v="<REDACTED>"; printf "%s=%s\n" "$k" "$v"; done'
          $cmdRuntime = 'printf "%s\n" "---PROC---"; ps w | grep -E "[c]lash|[m]ihomo" || true; printf "%s\n" "---LISTEN---"; (ss -lntup 2>/dev/null || netstat -lntup 2>/dev/null || true) | grep -E ":(53|1745|7874|9090)([[:space:]]|$)" || true; printf "%s\n" "---CONFIG---"; cfg=$(uci -q get openclash.config.config_path 2>/dev/null || true); [ -n "$cfg" ] && grep -nE "^(external-controller|external-ui|external-ui-name|[[:space:]]*enhanced-mode:|[[:space:]]*listen:)" "$cfg" 2>/dev/null || true'
          $cmdFiles = 'find /usr/share/openclash/ui/zashboard -maxdepth 2 -type f 2>/dev/null | head -n 40; test -s /usr/share/openclash/ui/zashboard/index.html && echo ZASHBOARD_INDEX=YES || echo ZASHBOARD_INDEX=NO'
          $cmdHttp = 'for u in http://127.0.0.1:9090/ui/zashboard/ http://192.168.6.1:9090/ui/zashboard/; do code=$(curl -sS -o /tmp/xz-dashboard-body -w "%{http_code}" --max-time 8 "$u" 2>/dev/null || true); printf "%s %s\n" "$code" "$u"; head -c 120 /tmp/xz-dashboard-body 2>/dev/null | tr "\n" " "; echo; done; rm -f /tmp/xz-dashboard-body'
          $cmdDns = 'printf "%s\n" "---DNSMASQ---"; uci -q show dhcp.@dnsmasq[0] 2>/dev/null | grep -E "(server=|noresolv=|resolvfile=|localuse=)" || true; printf "%s\n" "---ADH_UCI---"; uci -q show AdGuardHome 2>/dev/null | grep -E "(enabled=|redirect=|configpath=)" || uci -q show adguardhome 2>/dev/null | grep -E "(enabled=|redirect=|configpath=)" || true; printf "%s\n" "---ADH_PROC---"; pidof AdGuardHome 2>/dev/null || true; printf "%s\n" "---ADH_YAML_DNS---"; f=$(uci -q get AdGuardHome.AdGuardHome.configpath 2>/dev/null || echo /etc/AdGuardHome.yaml); [ -s "$f" ] && grep -nE "^(dns:|  port:|  upstream_dns:|    - )" "$f" | head -n 30 || true'
          $cmdMem = 'grep -E "^(MemTotal|MemAvailable|SwapTotal|SwapFree):" /proc/meminfo; uptime; logread -l 200 2>/dev/null | grep -Ei "out of memory|oom-killer|killed process|segfault" | tail -n 30 || true'

          Remote 'ARTHUR_IDENTITY' $cmdIdentity
          Remote 'OPENCLASH_UCI' $cmdUci
          Remote 'OPENCLASH_RUNTIME' $cmdRuntime
          Remote 'ZASHBOARD_FILES' $cmdFiles
          Remote 'DASHBOARD_HTTP' $cmdHttp
          Remote 'DNS_UCI' $cmdDns
          Remote 'MEMORY' $cmdMem
 | Select-Object -First 1
          if (-not $credentialLine) { throw 'DIRECT_INSPECT_SECURED_CREDENTIAL_SOURCE_MISSING' }
          $env:ARTHUR_ROOT_PASSWORD = $credentialLine.Matches[0].Groups[1].Value

          $knownHosts = Join-Path $env:RUNNER_TEMP 'arthur-direct-inspect.known_hosts'
          Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath $knownHosts
          $identityCommand = Get-ArthurIdentityCommand
          $authProbe = Invoke-ArthurSshProbe -DeviceIp $deviceIp -KnownHostsFile $knownHosts -StrictMode accept-new -Command $identityCommand -PasswordAuth
          if (-not (Test-ArthurAuthenticatedEvidence -Probe $authProbe -Policy (Get-ArthurAccessPolicy))) {
            throw 'DIRECT_INSPECT_AUTHENTICATED_IDENTITY_FAILED'
          }
          Write-Host 'ARTHUR_ACCESS=PASS mode=verified-password-direct'

          function Remote([string]$Label,[string]$Command) {
            $r = Invoke-ArthurSshProbe -DeviceIp '192.168.6.1' -KnownHostsFile $knownHosts -StrictMode yes -Command $Command -PasswordAuth
            Write-Host "$($Label)_EXIT=$($r.ExitCode)"
            Write-Host "$($Label)_BEGIN"
            Write-Host $r.Output
            Write-Host "$($Label)_END"
            if ($r.ExitCode -ne 0) { throw "REMOTE_INSPECT_FAILED label=$Label" }
          }

          $cmdIdentity = 'ubus call system board; printf "\n---BUILD---\n"; cat /www/luci-static/xinzhao/build-info.json 2>/dev/null || true'
          $cmdUci = 'for k in enable config_path en_mode enable_redirect_dns redirect_dns default_dashboard dns_port cn_port dashboard_password; do v=$(uci -q get openclash.config.$k 2>/dev/null || true); [ "$k" = dashboard_password ] && v="<REDACTED>"; printf "%s=%s\n" "$k" "$v"; done'
          $cmdRuntime = 'printf "%s\n" "---PROC---"; ps w | grep -E "[c]lash|[m]ihomo" || true; printf "%s\n" "---LISTEN---"; (ss -lntup 2>/dev/null || netstat -lntup 2>/dev/null || true) | grep -E ":(53|1745|7874|9090)([[:space:]]|$)" || true; printf "%s\n" "---CONFIG---"; cfg=$(uci -q get openclash.config.config_path 2>/dev/null || true); [ -n "$cfg" ] && grep -nE "^(external-controller|external-ui|external-ui-name|[[:space:]]*enhanced-mode:|[[:space:]]*listen:)" "$cfg" 2>/dev/null || true'
          $cmdFiles = 'find /usr/share/openclash/ui/zashboard -maxdepth 2 -type f 2>/dev/null | head -n 40; test -s /usr/share/openclash/ui/zashboard/index.html && echo ZASHBOARD_INDEX=YES || echo ZASHBOARD_INDEX=NO'
          $cmdHttp = 'for u in http://127.0.0.1:9090/ui/zashboard/ http://192.168.6.1:9090/ui/zashboard/; do code=$(curl -sS -o /tmp/xz-dashboard-body -w "%{http_code}" --max-time 8 "$u" 2>/dev/null || true); printf "%s %s\n" "$code" "$u"; head -c 120 /tmp/xz-dashboard-body 2>/dev/null | tr "\n" " "; echo; done; rm -f /tmp/xz-dashboard-body'
          $cmdDns = 'printf "%s\n" "---DNSMASQ---"; uci -q show dhcp.@dnsmasq[0] 2>/dev/null | grep -E "(server=|noresolv=|resolvfile=|localuse=)" || true; printf "%s\n" "---ADH_UCI---"; uci -q show AdGuardHome 2>/dev/null | grep -E "(enabled=|redirect=|configpath=)" || uci -q show adguardhome 2>/dev/null | grep -E "(enabled=|redirect=|configpath=)" || true; printf "%s\n" "---ADH_PROC---"; pidof AdGuardHome 2>/dev/null || true; printf "%s\n" "---ADH_YAML_DNS---"; f=$(uci -q get AdGuardHome.AdGuardHome.configpath 2>/dev/null || echo /etc/AdGuardHome.yaml); [ -s "$f" ] && grep -nE "^(dns:|  port:|  upstream_dns:|    - )" "$f" | head -n 30 || true'
          $cmdMem = 'grep -E "^(MemTotal|MemAvailable|SwapTotal|SwapFree):" /proc/meminfo; uptime; logread -l 200 2>/dev/null | grep -Ei "out of memory|oom-killer|killed process|segfault" | tail -n 30 || true'

          Remote 'ARTHUR_IDENTITY' $cmdIdentity
          Remote 'OPENCLASH_UCI' $cmdUci
          Remote 'OPENCLASH_RUNTIME' $cmdRuntime
          Remote 'ZASHBOARD_FILES' $cmdFiles
          Remote 'DASHBOARD_HTTP' $cmdHttp
          Remote 'DNS_UCI' $cmdDns
          Remote 'MEMORY' $cmdMem
