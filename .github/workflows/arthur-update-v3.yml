name: Arthur Known-Good Update v3

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Update scope based on the verified Known-Good baseline
        required: true
        default: rebuild_known_good
        type: choice
        options:
          - rebuild_known_good
          - update_immortalwrt
          - update_feeds
          - update_plugins
          - update_all
      recover_run_id:
        description: Recover the immutable Build #29 artifacts without rebuilding (fixed to 34056525562)
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: arthur-known-good-update-v3
  cancel-in-progress: false

jobs:
  build-candidate:
    if: ${{ inputs.recover_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fast static preflight
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          ./scripts/verify-project.sh
          test -s config/arthur-known-good.lock
          test "$(grep -cvE '^[[:space:]]*(#|$)' config/required-plugins.txt)" -eq 22
          echo 'PASS: static project, Known-Good lock and 22-plugin preflight complete.'

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: ./scripts/codex-setup.sh

      - name: Validate Known-Good and prepare Candidate lock
        id: prep
        env:
          UPDATE_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          ./scripts/verify-project.sh
          test -s config/arthur-known-good.lock
          test "$(grep -cvE '^[[:space:]]*(#|$)' config/required-plugins.txt)" -eq 22
          mkdir -p output

          python3 - <<'PY' > output/base-known-good.env
          import json
          with open('production/known-good.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          status = data.get('status')
          if data.get('verified') is not True or status not in {'verified', 'frozen'}:
              raise SystemExit('BLOCKED: production/known-good.json is not verified/frozen')
          if data.get('device') != 'jdcloud_re-ss-01':
              raise SystemExit('BLOCKED: Known-Good device mismatch')
          stable = data.get('stable_tag') or ''
          candidate = data.get('candidate_tag') or ''
          if not stable:
              raise SystemExit('BLOCKED: Known-Good stable_tag missing')
          print(f'BASE_STABLE={stable}')
          print(f'BASE_CANDIDATE={candidate}')
          PY
          source output/base-known-good.env

          CANDIDATE_LOCK="$RUNNER_TEMP/arthur-update.lock"
          ./scripts/prepare-update-lock.sh "$UPDATE_MODE" "$CANDIDATE_LOCK"
          cp "$CANDIDATE_LOCK" output/candidate-lock.txt
          diff -u config/arthur-known-good.lock "$CANDIDATE_LOCK" > output/update-lock.diff || true
          if [ ! -s output/update-lock.diff ]; then
            printf '%s\n' '# No source lock delta; Candidate uses the verified Known-Good lock unchanged.' > output/update-lock.diff
          fi
          LOCK_SHA="$(sha256sum "$CANDIDATE_LOCK" | awk '{print $1}')"

          echo "lock_path=$CANDIDATE_LOCK" >> "$GITHUB_OUTPUT"
          echo "lock_sha=$LOCK_SHA" >> "$GITHUB_OUTPUT"
          echo "base_stable=$BASE_STABLE" >> "$GITHUB_OUTPUT"
          echo "base_candidate=$BASE_CANDIDATE" >> "$GITHUB_OUTPUT"

          BASE_STABLE="$BASE_STABLE" BASE_CANDIDATE="$BASE_CANDIDATE" \
          python3 - "$CANDIDATE_LOCK" "$UPDATE_MODE" "$LOCK_SHA" <<'PY'
          import json, os, re, sys
          path, mode, lock_sha = sys.argv[1:]
          refs = {}
          for line in open(path, 'r', encoding='utf-8'):
              m = re.match(r'^([A-Z0-9_]+_REF)="([0-9a-f]{40})"$', line.strip())
              if m:
                  refs[m.group(1)] = m.group(2)
          if len(refs) != 14:
              raise SystemExit(f'BLOCKED: expected 14 pinned refs, got {len(refs)}')
          data = {
              'schema_version': '1.0',
              'mode': mode,
              'project_commit': os.environ['GITHUB_SHA'],
              'base_stable': os.environ['BASE_STABLE'],
              'base_candidate': os.environ['BASE_CANDIDATE'],
              'candidate_lock_sha256': lock_sha,
              'refs': refs,
          }
          with open('output/update-metadata.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY

          echo 'PASS: verified/frozen Known-Good baseline and Candidate lock prepared.'

      - name: Restore downloads and compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            work/immortalwrt/dl
            work/immortalwrt/.ccache
          key: arthur-v3-${{ runner.os }}-${{ inputs.mode }}-${{ steps.prep.outputs.lock_sha }}
          restore-keys: |
            arthur-v3-${{ runner.os }}-${{ inputs.mode }}-
            arthur-known-good-${{ runner.os }}-
            arthur-${{ runner.os }}-

      - name: Build Candidate from locked sources
        env:
          USE_KNOWN_GOOD_LOCK: '1'
          KNOWN_GOOD_LOCK: ${{ steps.prep.outputs.lock_path }}
          JOBS: '2'
          QUIET_BUILD: '1'
          REUSE_SOURCE: '0'
        run: ./scripts/build.sh

      - name: Enforce Candidate acceptance gates
        if: success()
        run: |
          set -Eeuo pipefail
          test -s output/plugin-verification.txt
          grep -Fq 'PASS: all required LuCI plugins were compiled and are present in the final firmware manifest' output/plugin-verification.txt
          grep -Fq 'Verified required plugins: 22' output/plugin-verification.txt
          test -s output/upload-oom-verification.txt
          grep -Fq 'PASS: Arthur large-upload OOM guard verified:' output/upload-oom-verification.txt
          grep -Fq 'Nginx buffering is disk-backed' output/upload-oom-verification.txt
          grep -Fq 'cgi-io can link its /tmp O_TMPFILE directly to /tmp/firmware.bin without a second 90+ MiB copy.' output/upload-oom-verification.txt
          find output/firmware -maxdepth 1 -type f -name '*Arthur*sysupgrade.bin' -size +0c -print -quit | grep -q .
          test -s output/firmware/SHA256SUMS.local
          (cd output/firmware && sha256sum -c SHA256SUMS.local)
          test -s output/arthur-known-good.lock
          cmp -s output/arthur-known-good.lock "${{ steps.prep.outputs.lock_path }}"
          echo 'PASS: firmware, 22/22 plugins, large-upload OOM guard, SHA256 and Candidate lock verified.'

      - name: Analyze failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -s output/logs/build.log ]; then
            ./scripts/analyze-error.sh output/logs/build.log
          elif [ -s output/logs/build-diagnostic.log ]; then
            ./scripts/analyze-error.sh output/logs/build-diagnostic.log
          else
            ./scripts/analyze-error.sh
          fi

      - name: Acceptance summary
        if: always()
        run: |
          {
            echo '## Arthur Known-Good Update v3'
            echo
            echo '- Mode: `${{ inputs.mode }}`'
            echo '- Base Stable: `${{ steps.prep.outputs.base_stable }}`'
            echo '- Base Candidate: `${{ steps.prep.outputs.base_candidate }}`'
            echo '- Project commit: `${{ github.sha }}`'
            echo '- Candidate lock SHA256: `${{ steps.prep.outputs.lock_sha }}`'
            echo '- Device: `jdcloud_re-ss-01`'
            echo '- Required plugins: `22`'
            echo '- Large-upload OOM guard: required'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s output/update-lock.diff ]; then
            echo '### Source lock delta' >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            cat output/update-lock.diff >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s output/plugin-verification.txt ]; then
            echo '### Final plugin verification' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat output/plugin-verification.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s output/upload-oom-verification.txt ]; then
            echo '### Large-upload OOM verification' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat output/upload-oom-verification.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arthur-v3-diagnostics-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/build-diagnostic.log
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/logs/failure-report.txt
            output/full.config
            output/plugin-verification.txt
            output/upload-oom-verification.txt
            output/update-lock.diff
            output/update-metadata.json
            output/candidate-lock.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified Candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arthur-v3-Candidate-${{ github.run_id }}
          path: |
            output/firmware/*
            output/full.config
            output/build-info.txt
            output/plugin-verification.txt
            output/upload-oom-verification.txt
            output/arthur-known-good.lock
            output/required-plugins.txt
            output/update-lock.diff
            output/update-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Candidate release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MODE: ${{ inputs.mode }}
          BASE_STABLE: ${{ steps.prep.outputs.base_stable }}
          LOCK_SHA: ${{ steps.prep.outputs.lock_sha }}
        run: |
          set -Eeuo pipefail
          tag="arthur-update-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            output/firmware/* \
            output/plugin-verification.txt \
            output/upload-oom-verification.txt \
            output/arthur-known-good.lock \
            output/build-info.txt \
            output/required-plugins.txt \
            output/update-lock.diff \
            output/update-metadata.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Arthur Update Candidate ${GITHUB_RUN_ID}" \
            --notes "Known-Good Update v3 Candidate. Base Stable: ${BASE_STABLE}. Mode: ${UPDATE_MODE}. Lock SHA256: ${LOCK_SHA}. Includes the Arthur large-upload OOM guard. Not Stable until JDCloud RE-SS-01 real-device verification and v3 Stable promotion both pass." \
            --prerelease

          echo "- Candidate tag: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Next hard gate: JDCloud RE-SS-01 real-device verification including large firmware upload without OOM' >> "$GITHUB_STEP_SUMMARY"

  recover-candidate:
    if: ${{ inputs.recover_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify immutable Build #29 recovery identity
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
          RECOVER_PROJECT_SHA: 750f62dcdd26b9227cfa6c857427f430340b8c9a
          RECOVER_FIRMWARE_ARTIFACT_ID: '9998837025'
          RECOVER_DIAGNOSTICS_ARTIFACT_ID: '9998834768'
        run: |
          set -Eeuo pipefail
          test "$RECOVER_RUN_ID" = 34056525562 || { echo 'BLOCKED: unsupported recovery run id'; exit 1; }
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN_ID")"
          test "$(jq -r '.head_sha' <<<"$run")" = "$RECOVER_PROJECT_SHA" || { echo 'BLOCKED: recovery run head SHA mismatch'; exit 1; }
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN_ID/jobs" --paginate)"
          for step in 'Feed Check' 'Build firmware' 'Upload firmware artifact'; do
            jq -e --arg step "$step" '.jobs[] | select(.name == "build") | .steps[] | select(.name == $step and .conclusion == "success")' <<<"$jobs" >/dev/null || { echo "BLOCKED: Build #29 step is not successful: $step"; exit 1; }
          done
          for spec in "$RECOVER_FIRMWARE_ARTIFACT_ID:XinZhaoWrt-Arthur" "$RECOVER_DIAGNOSTICS_ARTIFACT_ID:XinZhaoWrt-diagnostics-34056525562"; do
            id="${spec%%:*}"
            name="${spec#*:}"
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r '.name' <<<"$artifact")" = "$name" || { echo "BLOCKED: artifact name mismatch for $id"; exit 1; }
            test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$RECOVER_RUN_ID" || { echo "BLOCKED: artifact run mismatch for $id"; exit 1; }
            test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "$RECOVER_PROJECT_SHA" || { echo "BLOCKED: artifact head SHA mismatch for $id"; exit 1; }
            test "$(jq -r '.expired' <<<"$artifact")" = false || { echo "BLOCKED: artifact expired: $id"; exit 1; }
          done
          echo 'PASS: immutable Build #29 run and artifact identities verified.'

      - name: Recover immutable firmware and diagnostics artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p output "$RUNNER_TEMP/recovery-diagnostics"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9998837025/zip" > "$RUNNER_TEMP/firmware.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9998834768/zip" > "$RUNNER_TEMP/diagnostics.zip"
          unzip -q "$RUNNER_TEMP/firmware.zip" -d output
          unzip -q "$RUNNER_TEMP/diagnostics.zip" -d "$RUNNER_TEMP/recovery-diagnostics"

      - name: Recover original OOM verification evidence and Candidate lock
        id: recovery
        env:
          RECOVER_PROJECT_SHA: 750f62dcdd26b9227cfa6c857427f430340b8c9a
        run: |
          set -Eeuo pipefail
          build_log="$RUNNER_TEMP/recovery-diagnostics/output/logs/build.log"
          test -s "$build_log" || { echo 'BLOCKED: Build #29 build.log missing from diagnostics artifact'; exit 1; }
          : > output/upload-oom-verification.txt
          while IFS= read -r required_line; do
            grep -F -x -m 1 "$required_line" "$build_log" >> output/upload-oom-verification.txt || { echo "BLOCKED: original OOM evidence missing: $required_line"; exit 1; }
          done <<'EOF'
          PASS: Nginx large request bodies are buffered outside /tmp tmpfs.
          PASS: cgi-io transient O_TMPFILE remains on /tmp so final handoff can use same-filesystem linkat().
          PASS: LuCI final firmware handoff remains /tmp/firmware.bin on the same tmpfs as cgi-io O_TMPFILE.
          PASS: Arthur large-upload OOM guard verified: Nginx buffering is disk-backed and cgi-io can link its /tmp O_TMPFILE directly to /tmp/firmware.bin without a second 90+ MiB copy.
          EOF
          git cat-file -e "$RECOVER_PROJECT_SHA:config/arthur-known-good.lock" || { echo 'BLOCKED: Build #29 Known-Good lock missing'; exit 1; }
          git show "$RECOVER_PROJECT_SHA:config/arthur-known-good.lock" > "$RUNNER_TEMP/recovered-known-good.lock"
          cmp -s "$RUNNER_TEMP/recovered-known-good.lock" config/arthur-known-good.lock || { echo 'BLOCKED: recovered and current Known-Good locks differ'; exit 1; }
          cp "$RUNNER_TEMP/recovered-known-good.lock" output/candidate-lock.txt
          cmp -s "$RUNNER_TEMP/recovered-known-good.lock" output/candidate-lock.txt || { echo 'BLOCKED: recovered and Candidate locks differ'; exit 1; }
          cp "$RUNNER_TEMP/recovered-known-good.lock" output/arthur-known-good.lock
          test "$(git rev-parse "$RECOVER_PROJECT_SHA:config/arthur-known-good.lock")" = 748a583c5018df9fcab7c0125d6b13be9fbbeee1 || { echo 'BLOCKED: Build #29 Known-Good lock blob mismatch'; exit 1; }
          echo "lock_path=$RUNNER_TEMP/recovered-known-good.lock" >> "$GITHUB_OUTPUT"
          echo "lock_sha=$(sha256sum "$RUNNER_TEMP/recovered-known-good.lock" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo 'PASS: original OOM evidence and Build #29 Known-Good lock recovered exactly.'

      - name: Generate recovery update metadata
        env:
          LOCK_SHA: ${{ steps.recovery.outputs.lock_sha }}
          UPDATE_MODE: ${{ inputs.mode }}
        run: |
          set -Eeuo pipefail
          LOCK_SHA="$LOCK_SHA" UPDATE_MODE="$UPDATE_MODE" python3 - <<'PY'
          import json, os, re
          refs = {}
          for line in open('output/candidate-lock.txt', encoding='utf-8'):
              m = re.match(r'^([A-Z0-9_]+_REF)="([0-9a-f]{40})"$', line.strip())
              if m:
                  refs[m.group(1)] = m.group(2)
          if len(refs) != 14:
              raise SystemExit(f'BLOCKED: expected 14 pinned refs, got {len(refs)}')
          data = {
              'schema_version': '1.0', 'mode': os.environ['UPDATE_MODE'],
              'project_commit': os.environ['GITHUB_SHA'],
              'candidate_lock_sha256': os.environ['LOCK_SHA'], 'refs': refs,
              'recovery_mode': True, 'recovered_build_run_id': 34056525562,
              'recovered_firmware_artifact_id': 9998837025,
              'recovered_diagnostics_artifact_id': 9998834768,
              'recovered_project_commit': '750f62dcdd26b9227cfa6c857427f430340b8c9a',
          }
          with open('output/update-metadata.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2); f.write('\n')
          PY
          printf '%s\n' '# Immutable Build #29 Artifact recovery; no source lock delta.' > output/update-lock.diff

      - name: Enforce Candidate acceptance gates
        run: |
          set -Eeuo pipefail
          test -s output/plugin-verification.txt
          grep -Fq 'PASS: all required LuCI plugins were compiled and are present in the final firmware manifest' output/plugin-verification.txt
          grep -Fq 'Verified required plugins: 22' output/plugin-verification.txt
          grep -Fqx 'LANGUAGE_PACKAGE_ARCHIVE=PASS' output/plugin-verification.txt
          grep -Fqx 'LANGUAGE_RESOURCE=PASS' output/plugin-verification.txt
          test -s output/upload-oom-verification.txt
          grep -Fqx 'PASS: Arthur large-upload OOM guard verified: Nginx buffering is disk-backed and cgi-io can link its /tmp O_TMPFILE directly to /tmp/firmware.bin without a second 90+ MiB copy.' output/upload-oom-verification.txt
          find output/firmware -maxdepth 1 -type f -name '*Arthur*sysupgrade.bin' -size +0c -print -quit | grep -q .
          test -s output/firmware/SHA256SUMS.local
          (cd output/firmware && sha256sum -c SHA256SUMS.local)
          test -s output/arthur-known-good.lock
          cmp -s output/arthur-known-good.lock "${{ steps.recovery.outputs.lock_path }}"
          echo 'PASS: recovered firmware, 22/22 plugins, original large-upload OOM guard, SHA256 and Candidate lock verified.'

      - name: Upload verified Candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arthur-v3-Candidate-${{ github.run_id }}
          path: |
            output/firmware/*
            output/full.config
            output/build-info.txt
            output/plugin-verification.txt
            output/upload-oom-verification.txt
            output/arthur-known-good.lock
            output/required-plugins.txt
            output/update-lock.diff
            output/update-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_MODE: ${{ inputs.mode }}
          LOCK_SHA: ${{ steps.recovery.outputs.lock_sha }}
        run: |
          set -Eeuo pipefail
          tag="arthur-update-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            output/firmware/* output/plugin-verification.txt output/upload-oom-verification.txt \
            output/arthur-known-good.lock output/build-info.txt output/required-plugins.txt \
            output/update-lock.diff output/update-metadata.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Arthur Update Candidate ${GITHUB_RUN_ID}" \
            --notes "Known-Good Update v3 immutable Build #29 recovery. Mode: ${UPDATE_MODE}. Lock SHA256: ${LOCK_SHA}. Not Stable until JDCloud RE-SS-01 real-device verification and v3 Stable promotion both pass." \
            --prerelease
