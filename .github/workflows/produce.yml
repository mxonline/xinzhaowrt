name: XinZhaoWrt Firmware Production v1

'on':
  push:
    branches:
      - main
    paths:
      - 'production/request.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

concurrency:
  group: xinzhaowrt-production-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 1440

    steps:
      - name: Checkout controller project
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Baseline Integrity Gate
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/baseline-integrity-gate.sh
          ./scripts/baseline-integrity-gate.sh

      - name: Install Codex controller shim
        shell: powershell
        run: |
          $shimDir = Join-Path $env:GITHUB_WORKSPACE 'scripts\codex-shim'
          if (-not (Test-Path (Join-Path $shimDir 'codex.cmd'))) {
            throw 'BLOCKED: Codex controller shim is missing.'
          }
          $shimDir >> $env:GITHUB_PATH
          Write-Host "Codex controller shim added to PATH: $shimDir"

      - name: Read production request
        id: request
        shell: powershell
        run: |
          $request = Get-Content -Raw production/request.json | ConvertFrom-Json
          if ($request.device -ne 'jdcloud_re-ss-01') {
            throw "BLOCKED: unsupported device $($request.device)"
          }
          if ($request.action -ne 'produce') {
            Write-Host "No production requested. action=$($request.action)"
            "should_run=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($request.mode -notin @('UpdateBuild','Rebuild','Resume')) {
            throw "BLOCKED: unsupported production mode $($request.mode)"
          }
          $rounds = [int]$request.max_repair_rounds
          if ($rounds -lt 0 -or $rounds -gt 5) {
            throw "BLOCKED: max_repair_rounds must be between 0 and 5"
          }
          $poll = [int]$request.poll_seconds
          if ($poll -lt 15 -or $poll -gt 300) {
            throw "BLOCKED: poll_seconds must be between 15 and 300"
          }
          $runId = 0
          if ($request.mode -eq 'Resume') {
            if (-not ($request.PSObject.Properties.Name -contains 'run_id')) {
              throw 'BLOCKED: Resume mode requires run_id'
            }
            $runId = [long]$request.run_id
            if ($runId -le 0) {
              throw 'BLOCKED: Resume mode requires a positive run_id'
            }
          }
          "should_run=true" >> $env:GITHUB_OUTPUT
          "mode=$($request.mode)" >> $env:GITHUB_OUTPUT
          "run_id=$runId" >> $env:GITHUB_OUTPUT
          "max_rounds=$rounds" >> $env:GITHUB_OUTPUT
          "poll_seconds=$poll" >> $env:GITHUB_OUTPUT
          "request_id=$($request.request_id)" >> $env:GITHUB_OUTPUT
          Write-Host "Accepted production request $($request.request_id), mode=$($request.mode), run_id=$runId"

      - name: Verify controller tools
        if: steps.request.outputs.should_run == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tool in @('git','gh','codex')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "BLOCKED: required local tool not found: $tool"
            }
          }
          $fullName = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.full_name'
          if ($LASTEXITCODE -ne 0 -or $fullName -ne $env:GITHUB_REPOSITORY) {
            throw "BLOCKED: GH_TOKEN cannot access $env:GITHUB_REPOSITORY"
          }
          Write-Host "Controller tools and GitHub token OK: $fullName"

      - name: Run persistent production controller
        if: steps.request.outputs.should_run == 'true'
        shell: powershell
        run: |
          $mode = '${{ steps.request.outputs.mode }}'
          $maxRounds = [int]'${{ steps.request.outputs.max_rounds }}'
          $pollSeconds = [int]'${{ steps.request.outputs.poll_seconds }}'
          if ($mode -eq 'Resume') {
            $runId = [long]'${{ steps.request.outputs.run_id }}'
            ./scripts/ci-controller-v2.ps1 `
              -Mode Resume `
              -RunId $runId `
              -MaxRepairRounds $maxRounds `
              -PollSeconds $pollSeconds
          } else {
            ./scripts/ci-controller-v2.ps1 `
              -Mode $mode `
              -MaxRepairRounds $maxRounds `
              -PollSeconds $pollSeconds
          }

      - name: Production summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path state/ci-state.json) {
            "## 路由固件完整生产 v2.0" >> $env:GITHUB_STEP_SUMMARY
            '```json' >> $env:GITHUB_STEP_SUMMARY
            Get-Content state/ci-state.json >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          } else {
            "## 路由固件完整生产 v2.0" >> $env:GITHUB_STEP_SUMMARY
            "No controller state file was produced." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload controller state and logs
        if: always() && steps.request.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: XinZhaoWrt-production-controller-${{ github.run_id }}
          path: |
            state/ci-state.json
            output/controller/**
          if-no-files-found: warn
          retention-days: 30
