name: Arthur Locked LinkEase APK Probe

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: Build only the four locked LinkEase test APKs; no firmware image
        required: true
        type: choice
        options:
          - PACKAGE_ONLY

permissions:
  contents: read

jobs:
  linkease-apk-probe:
    if: ${{ inputs.confirm == 'PACKAGE_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify project source locks and install SDK tools
        run: |
          set -Eeuo pipefail
          grep -Fxq 'ISTORE_QUICKSTART_LUCI_REF="8aa8467aabe86f1cf8d23fdb6b0cdd2ef14d2449"' config/istore-quickstart.lock
          grep -Fxq 'ISTORE_QUICKSTART_REF="0c789dc2b88f684476f6174201105da6ca6f5133"' config/istore-quickstart.lock
          sudo apt-get update -qq
          sudo apt-get install -y zstd file
      - name: Download hash-verified official Arthur SDK
        run: |
          set -Eeuo pipefail
          url='https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst'
          curl -fL --retry 4 --retry-delay 5 --output sdk.tar.zst "$url"
          echo 'f1fe279ef3334dd76b5a9e952a529dfe2a51b32e8fa4dc0f5e259bfc2e976b68  sdk.tar.zst' | sha256sum -c -
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk
      - name: Fetch exact locked official package commits
        run: |
          set -Eeuo pipefail
          mkdir -p sources
          fetch_exact() {
            local name="$1" url="$2" ref="$3"
            shift 3
            git init -q "sources/$name"
            git -C "sources/$name" remote add origin "$url"
            git -C "sources/$name" sparse-checkout init --cone
            git -C "sources/$name" sparse-checkout set "$@"
            git -C "sources/$name" -c http.version=HTTP/1.1 fetch --depth 1 --filter=blob:none origin "$ref"
            git -C "sources/$name" checkout -q --detach FETCH_HEAD
            test "$(git -C "sources/$name" rev-parse HEAD)" = "$ref"
          }
          fetch_exact nas-luci https://github.com/linkease/nas-packages-luci.git 8aa8467aabe86f1cf8d23fdb6b0cdd2ef14d2449 luci/luci-app-linkease luci/luci-lib-linkeasefile
          fetch_exact nas https://github.com/linkease/nas-packages.git 0c789dc2b88f684476f6174201105da6ca6f5133 network/services/linkease network/services/linkease-common-bin
          grep -Fq 'PKG_SOURCE_DATE:=1.7.5' sources/nas/network/services/linkease/Makefile
          grep -Fq 'PKG_SOURCE_DATE:=1.7.5' sources/nas/network/services/linkease-common-bin/Makefile
          grep -Fq 'PKG_VERSION:=2.1.70-r3' sources/nas-luci/luci/luci-app-linkease/Makefile
          grep -Fq 'PKG_VERSION:=2.1.70-r3' sources/nas-luci/luci/luci-lib-linkeasefile/Makefile
          grep -Fq '92d0c6f9d05a0ba283d03fef2b7f4675eee032c303e959b1e4198e12806510f9' sources/nas/network/services/linkease/Makefile
          grep -Fq '1646db48f5a512b96a34971e5af82eacd5a51f32abab2c5e84f277c408a72eb8' sources/nas/network/services/linkease-common-bin/Makefile
      - name: Remove only WAN 8897 default from test package payload
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sources/nas/network/services/linkease-common-bin/Makefile')
          source = p.read_text()
          line = '\t$(INSTALL_BIN) ./files/linkease-fw.uci-default $(1)/etc/uci-defaults/linkease-fw\n'
          assert source.count(line) == 1, 'WAN default installer line changed upstream'
          p.write_text(source.replace(line, ''))
          assert '$(1)/etc/uci-defaults/linkease-fw' not in p.read_text()
          PY
          git -C sources/nas diff -- network/services/linkease-common-bin/Makefile
      - name: SDK build four packages only
        run: |
          set -Eeuo pipefail
          sdk_dir="$(find sdk -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          test -n "$sdk_dir"
          if ! test -f "$sdk_dir/feeds/luci/luci.mk"; then
            mkdir -p "$sdk_dir/feeds/luci"
            git init -q "$sdk_dir/feeds/luci"
            git -C "$sdk_dir/feeds/luci" remote add origin https://github.com/immortalwrt/luci.git
            git -C "$sdk_dir/feeds/luci" -c http.version=HTTP/1.1 fetch --depth 1 --filter=blob:none origin 1df16f1ef5845a9c2cacd5d6f1e0d2fe95cdad37
            git -C "$sdk_dir/feeds/luci" checkout -q --detach FETCH_HEAD
            test "$(git -C "$sdk_dir/feeds/luci" rev-parse HEAD)" = '1df16f1ef5845a9c2cacd5d6f1e0d2fe95cdad37'
          fi
          luci_host_src="$sdk_dir/feeds/luci/modules/luci-base/src"
          if ! test -f "$luci_host_src/Makefile"; then
            git init -q sources/luci-host
            git -C sources/luci-host remote add origin https://github.com/immortalwrt/luci.git
            git -C sources/luci-host sparse-checkout init --cone
            git -C sources/luci-host sparse-checkout set modules/luci-base/src
            git -C sources/luci-host -c http.version=HTTP/1.1 fetch --depth 1 --filter=blob:none origin 1df16f1ef5845a9c2cacd5d6f1e0d2fe95cdad37
            git -C sources/luci-host checkout -q --detach FETCH_HEAD
            test "$(git -C sources/luci-host rev-parse HEAD)" = '1df16f1ef5845a9c2cacd5d6f1e0d2fe95cdad37'
            luci_host_src="$GITHUB_WORKSPACE/sources/luci-host/modules/luci-base/src"
          fi
          make -C "$luci_host_src" po2lmo
          install -Dm755 "$luci_host_src/po2lmo" "$sdk_dir/staging_dir/host/bin/po2lmo"
          mkdir -p "$sdk_dir/package/feeds/xinzhao"
          ln -s "$GITHUB_WORKSPACE/sources/nas/network/services/linkease-common-bin" "$sdk_dir/package/feeds/xinzhao/linkease-common-bin"
          ln -s "$GITHUB_WORKSPACE/sources/nas/network/services/linkease" "$sdk_dir/package/feeds/xinzhao/linkease"
          ln -s "$GITHUB_WORKSPACE/sources/nas-luci/luci/luci-lib-linkeasefile" "$sdk_dir/package/feeds/xinzhao/luci-lib-linkeasefile"
          ln -s "$GITHUB_WORKSPACE/sources/nas-luci/luci/luci-app-linkease" "$sdk_dir/package/feeds/xinzhao/luci-app-linkease"
          cat >> "$sdk_dir/.config" <<'EOF'
          CONFIG_PACKAGE_linkease-common-bin=m
          CONFIG_PACKAGE_linkease=m
          CONFIG_PACKAGE_luci-lib-linkeasefile=m
          CONFIG_PACKAGE_luci-app-linkease=m
          EOF
          make -C "$sdk_dir" defconfig
          for pkg in linkease-common-bin linkease luci-lib-linkeasefile luci-app-linkease; do
            make -C "$sdk_dir" "package/feeds/xinzhao/$pkg/compile" V=sc
          done
          echo "SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"
      - name: Verify package payload, architecture and identity
        run: |
          set -Eeuo pipefail
          mkdir -p test-apks
          for spec in linkease-common-bin:1.7.5 linkease:1.7.5 luci-lib-linkeasefile:2.1.70-r3 luci-app-linkease:2.1.70-r3; do
            pkg="${spec%%:*}"
            version="${spec#*:}"
            mapfile -t hits < <(find "$SDK_DIR/bin/packages" -type f -name "$pkg-$version*.apk")
            test "${#hits[@]}" -eq 1
            echo "TEST_APK_FILE=${hits[0]}"
            cp "${hits[0]}" test-apks/
          done
          test "$(find test-apks -type f -name '*.apk' | wc -l)" -eq 4
          ! tar --zstd -tf test-apks/linkease-common-bin-*.apk | grep -F 'etc/uci-defaults/linkease-fw'
          test -s "$SDK_DIR/public-key.pem"
          cp "$SDK_DIR/public-key.pem" test-apks/package-signing-public-key.pem
          test "$(find "$SDK_DIR/dl" -type f -name 'linkease-bin-1.7.5-linux-aarch64.tar.gz' | wc -l)" -eq 1
          test "$(find "$SDK_DIR/dl" -type f -name 'linkease-common-bin-1.7.5-linux-aarch64.tar.gz' | wc -l)" -eq 1
          runtime="$(find "$SDK_DIR/dl" -type f -name 'linkease-bin-1.7.5-linux-aarch64.tar.gz' -print -quit)"
          common="$(find "$SDK_DIR/dl" -type f -name 'linkease-common-bin-1.7.5-linux-aarch64.tar.gz' -print -quit)"
          echo "92d0c6f9d05a0ba283d03fef2b7f4675eee032c303e959b1e4198e12806510f9  $runtime" | sha256sum -c -
          echo "1646db48f5a512b96a34971e5af82eacd5a51f32abab2c5e84f277c408a72eb8  $common" | sha256sum -c -
          mkdir -p test-apks/extracted
          tar --zstd -xf test-apks/linkease-1.7.5-*.apk -C test-apks/extracted
          file test-apks/extracted/usr/sbin/linkease | grep -Eq 'ELF 64-bit.*ARM aarch64'
          rm -rf test-apks/extracted
          (cd test-apks && sha256sum *.apk > SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('test-apks')
          packages = []
          for p in sorted(root.glob('*.apk')):
              packages.append({'file': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(packages) == 4
          manifest = {
              'purpose': 'Arthur v0.1.6 live LinkEase validation only; no firmware image',
              'source_refs': {
                  'nas-packages-luci': '8aa8467aabe86f1cf8d23fdb6b0cdd2ef14d2449',
                  'nas-packages': '0c789dc2b88f684476f6174201105da6ca6f5133',
              },
              'arch': 'aarch64',
              'firewall_default_in_payload': False,
              'packages': packages,
          }
          (root / 'source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
          echo 'TEST_APK_SOURCE_LOCK=PASS'
          echo 'TEST_APK_ARCH=aarch64'
          echo 'FIRMWARE_BUILD=NOT_RUN'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arthur-locked-linkease-test-apks
          path: test-apks/
          if-no-files-found: error
          retention-days: 7
