name: Arthur Fast Preflight

'on':
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_closure:
        description: 'Run exact locked source/feed/package/defconfig closure without firmware compile'
        required: false
        default: false
        type: boolean
      update_mode:
        description: 'Candidate lock mode to mirror during closure'
        required: false
        default: rebuild_known_good
        type: choice
        options:
          - rebuild_known_good
          - update_immortalwrt
          - update_feeds
          - update_plugins
          - update_all

permissions:
  contents: read

concurrency:
  group: arthur-fast-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          chmod +x tests/*.sh scripts/*.sh || true

      - name: Test build-scope classifier
        run: ./tests/test-classify-build-scope.sh

      - name: Test Candidate dedup and failed-run recovery contract
        run: ./tests/test-build-dedup-contract.sh

      - name: Test Codex auto-recovery state transitions
        run: python3 -m unittest tests.test_codex_auto_recovery -v

      - name: Test Arthur Codex runtime probe
        shell: pwsh
        run: python -m unittest tests.test_arthur_codex_runtime_probe -v

      - name: Test Arthur Windows repair controller diagnostic contract
        shell: pwsh
        run: ./tests/arthur-windows-repair-controller.tests.ps1

      - name: Test Windows failed Candidate recovery wiring
        shell: pwsh
        run: ./tests/arthur-candidate-failure-recovery.tests.ps1

      - name: Test source/config closure preflight contract
        run: ./tests/test-build-closure-preflight.sh

      - name: Test LIVE_PREVIEW safety contract
        run: ./tests/test-live-preview-contract.sh

      - name: Test feature handoff contract
        shell: pwsh
        run: ./tests/feature-handoff.tests.ps1

      - name: Test non-admin Feature Handoff task contract
        shell: pwsh
        run: ./tests/feature-handoff-task-privilege.tests.ps1

      - name: Test durable v3 request auto trigger contract
        shell: pwsh
        run: ./tests/feature-handoff-auto-trigger.tests.ps1

      - name: Test Arthur control-plane executor contract
        shell: pwsh
        run: ./tests/arthur-control-plane-executor.tests.ps1

      - name: Test Arthur recovery supervisor wiring contract
        shell: pwsh
        run: ./tests/arthur-recovery-supervisor-wiring.tests.ps1

      - name: Test Arthur canonical resume-state contract
        shell: pwsh
        run: ./tests/arthur-resume-state.tests.ps1

      - name: Test Arthur operator intent gate contract
        shell: pwsh
        run: ./tests/arthur-operator-intent.tests.ps1

      - name: Test Arthur firmware event-ledger resume contract
        shell: pwsh
        run: ./tests/arthur-firmware-resume.tests.ps1

      - name: Enforce append-only Arthur firmware event history
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseRef = '${{ github.event.pull_request.base.sha }}'
          }
          else {
            $baseRef = (git rev-parse HEAD^).Trim()
          }
          ./scripts/check-firmware-event-ledger-history.ps1 -BaseRef $baseRef

      - name: Parse LIVE_PREVIEW and control-plane PowerShell
        shell: pwsh
        run: |
          foreach ($file in @(
            'scripts/live-preview.ps1',
            'scripts/live-preview-mature-safe.ps1',
            'scripts/prepare-live-preview-sources.ps1',
            'scripts/feature-handoff-lib.ps1',
            'scripts/feature-handoff.ps1',
            'scripts/install-feature-handoff.ps1',
            'scripts/feature-handoff-status.ps1',
            'scripts/arthur-resume-state.ps1',
            'scripts/arthur-operator-intent.ps1',
            'scripts/arthur-control-plane-gate.ps1',
            'scripts/arthur-candidate-failure-recovery.ps1',
            'scripts/arthur-firmware-event-ledger.ps1',
            'scripts/arthur-firmware-resume.ps1',
            'scripts/check-firmware-event-ledger-history.ps1',
            'scripts/arthur-control-plane.ps1',
            'scripts/arthur-windows-repair-controller.ps1'
          )) {
            if (-not (Test-Path $file)) {
              Write-Error "Required PowerShell file missing: $file"
              exit 1
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Compile Arthur orchestrator Python
        run: python3 -m py_compile ai_orchestrator/arthur.py ai_orchestrator/cli.py ai_orchestrator/runtime.py ai_orchestrator/supervisor.py ai_orchestrator/recovery.py ai_orchestrator/recovery_runtime.py scripts/arthur-codex-runtime-probe.py

      - name: Test runtime checkpoint synchronization
        run: python3 -m unittest tests.test_runtime_checkpoint_sync -v

      - name: Validate LIVE_PREVIEW JSON contracts
        run: |
          python3 -m json.tool production/live-preview-policy.json >/dev/null
          python3 -m json.tool production/mature-ui-sources.json >/dev/null
          python3 -m json.tool production/operator-intent.json >/dev/null

      - name: Test v4 toolchain bootstrap gate
        run: ./tests/test-v4-toolchain-bootstrap.sh

      - name: Test v4 toolchain acceptance gate
        run: ./tests/test-v4-toolchain-acceptance.sh

      - name: Determine changed files
        id: changes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee changed-files.txt
          SCOPE="$(bash ./scripts/classify-build-scope.sh < changed-files.txt)"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Build scope: $SCOPE"

      - name: Run static project verification
        if: success() && steps.changes.outputs.scope != 'DOC_ONLY'
        run: ./scripts/verify-project.sh

      - name: Preflight summary
        if: always()
        run: |
          {
            echo '## Arthur Fast Preflight'
            echo
            echo "- Scope: \`${{ steps.changes.outputs.scope || 'UNRESOLVED' }}\`"
            echo '- This workflow never compiles firmware or mutates Stable Known-Good state.'
            echo '- Firmware event history is append-only; historical ledger rewrites fail closed.'
            echo '- LIVE_PREVIEW is a pre-Candidate development aid and never counts as formal REAL_DEVICE_VERIFY.'
            echo '- Mature AdGuard Home and official QuickStart sources are pinned separately from Known-Good firmware refs.'
            echo '- Mature ADH LIVE_PREVIEW uses safe UI-only fallback; DNS/firewall/start-stop runtime mutation tests are deferred to formal REAL_DEVICE_VERIFY.'
            echo '- Feature Handoff must continue accepted LIVE_PREVIEW through the durable v3 request auto trigger unless pause_after_live_preview is explicit.'
            echo '- DOC_ONLY: documentation/knowledge only; no firmware build required.'
            echo '- FAST_GATE: CI/verifier/test/control-plane change; static gates only.'
            echo '- IMAGEBUILDER: assemble firmware from Known-Good-compatible prebuilt packages.'
            echo '- SDK_BUILD: rebuild user-space packages with the Known-Good-matched SDK.'
            echo '- FULL_BUILD: kernel/ABI/unknown change; full Candidate build required.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-closure:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_closure == true }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: ./scripts/codex-setup.sh

      - name: Prepare exact Candidate lock
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          CLOSURE_LOCK="$RUNNER_TEMP/arthur-build-closure.lock"
          ./scripts/prepare-update-lock.sh '${{ inputs.update_mode }}' "$CLOSURE_LOCK"
          echo "path=$CLOSURE_LOCK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$CLOSURE_LOCK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Run exact source and config closure
        shell: bash
        env:
          USE_KNOWN_GOOD_LOCK: '1'
          KNOWN_GOOD_LOCK: ${{ steps.lock.outputs.path }}
          JOBS: '2'
          QUIET_BUILD: '0'
          REUSE_SOURCE: '0'
          BUILD_CLOSURE_ONLY: '1'
        run: |
          set -Eeuo pipefail
          ./scripts/build.sh
          grep -q '^BUILD_CLOSURE_PREFLIGHT=PASS$' output/logs/build.log

      - name: Analyze closure failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -s output/logs/build.log ]]; then
            ./scripts/analyze-error.sh output/logs/build.log
          elif [[ -s output/logs/build-diagnostic.log ]]; then
            ./scripts/analyze-error.sh output/logs/build-diagnostic.log
          fi
          exit 0

      - name: Upload build closure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-build-closure-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/build-diagnostic.log
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/logs/failure-report.txt
            output/full.config
          if-no-files-found: warn
          retention-days: 14

      - name: Build closure summary
        if: always()
        run: |
          {
            echo '## Arthur exact build closure'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Update mode: \`${{ inputs.update_mode }}\`"
            echo "- Candidate lock SHA256: \`${{ steps.lock.outputs.sha || 'UNAVAILABLE' }}\`"
            echo '- Boundary: exact source/feeds/custom packages/provenance/package existence/overlay/make defconfig/check-config only.'
            echo '- Firmware source download: not run after closure PASS.'
            echo '- Firmware compile: not run.'
          } >> "$GITHUB_STEP_SUMMARY"
