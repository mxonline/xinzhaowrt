name: Arthur Fast Preflight

'on':
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_closure:
        description: 'Run exact locked source/feed/package/defconfig closure without firmware compile'
        required: false
        default: false
        type: boolean
      update_mode:
        description: 'Candidate lock mode to mirror during closure'
        required: false
        default: rebuild_known_good
        type: choice
        options:
          - rebuild_known_good
          - update_immortalwrt
          - update_feeds
          - update_plugins
          - update_all

permissions:
  contents: read

concurrency:
  group: arthur-fast-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}

    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Normalize script permissions
        run: |
          chmod +x tests/*.sh scripts/*.sh || true

      - name: Enforce highest-priority Arthur product goal contract
        shell: pwsh
        run: ./tests/arthur-product-goal-contract.tests.ps1

      - name: Test build-scope classifier
        run: ./tests/test-classify-build-scope.sh

      - name: Test Candidate dedup and failed-run recovery contract
        run: ./tests/test-build-dedup-contract.sh

      - name: Test Codex auto-recovery state transitions
        run: python3 -m unittest tests.test_codex_auto_recovery -v

      - name: Test Arthur Codex runtime probe
        shell: pwsh
        run: python -m unittest tests.test_arthur_codex_runtime_probe -v

      - name: Test Arthur Windows repair controller diagnostic contract
        shell: pwsh
        run: ./tests/arthur-windows-repair-controller.tests.ps1

      - name: Test Arthur Git remote Schannel fallback
        shell: pwsh
        run: ./tests/arthur-git-remote-fallback.tests.ps1

      - name: Test Arthur Windows repair Scheduled Task contract
        shell: pwsh
        run: ./tests/arthur-windows-repair-task.tests.ps1

      - name: Test Windows failed Candidate recovery wiring
        shell: pwsh
        run: ./tests/arthur-candidate-failure-recovery.tests.ps1

      - name: Test source/config closure preflight contract
        run: ./tests/test-build-closure-preflight.sh

      - name: Test LIVE_PREVIEW safety contract
        run: ./tests/test-live-preview-contract.sh

      - name: Test feature handoff contract
        shell: pwsh
        run: ./tests/feature-handoff.tests.ps1

      - name: Test non-admin Feature Handoff task contract
        shell: pwsh
        run: ./tests/feature-handoff-task-privilege.tests.ps1

      - name: Test durable v3 request auto trigger contract
        shell: pwsh
        run: ./tests/feature-handoff-auto-trigger.tests.ps1

      - name: Test Arthur control-plane executor contract
        shell: pwsh
        run: ./tests/arthur-control-plane-executor.tests.ps1

      - name: Test Arthur recovery supervisor wiring contract
        shell: pwsh
        run: ./tests/arthur-recovery-supervisor-wiring.tests.ps1

      - name: Test Arthur stale human-wait supervisor recovery
        run: python3 -m unittest tests.test_supervisor_child_exit_observation -v

      - name: Test Arthur canonical resume-state contract
        shell: pwsh
        run: ./tests/arthur-resume-state.tests.ps1

      - name: Test Arthur operator intent gate contract
        shell: pwsh
        run: ./tests/arthur-operator-intent.tests.ps1

      - name: Test Arthur firmware event-ledger resume contract
        shell: pwsh
        run: ./tests/arthur-firmware-resume.tests.ps1

      - name: Enforce append-only Arthur firmware event history
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $baseRef = '${{ github.event.pull_request.base.sha }}'
          }
          else {
            $baseRef = (git rev-parse HEAD^).Trim()
          }
          ./scripts/check-firmware-event-ledger-history.ps1 -BaseRef $baseRef

      - name: Parse LIVE_PREVIEW and control-plane PowerShell
        shell: pwsh
        run: |
          foreach ($file in @(
            'scripts/live-preview.ps1',
            'scripts/live-preview-mature-safe.ps1',
            'scripts/prepare-live-preview-sources.ps1',
            'scripts/feature-handoff-lib.ps1',
            'scripts/feature-handoff.ps1',
            'scripts/install-feature-handoff.ps1',
            'scripts/feature-handoff-status.ps1',
            'scripts/arthur-resume-state.ps1',
            'scripts/arthur-operator-intent.ps1',
            'scripts/arthur-control-plane-gate.ps1',
            'scripts/arthur-candidate-failure-recovery.ps1',
            'scripts/arthur-firmware-event-ledger.ps1',
            'scripts/arthur-firmware-resume.ps1',
            'scripts/check-firmware-event-ledger-history.ps1',
            'scripts/arthur-control-plane.ps1',
            'scripts/arthur-git-remote.ps1',
            'scripts/arthur-windows-repair-controller.ps1',
            'scripts/ensure-arthur-persistent-supervisor.ps1',
            'scripts/ensure-arthur-windows-repair-controller.ps1'
          )) {
            if (-not (Test-Path $file)) {
              Write-Error "Required PowerShell file missing: $file"
              exit 1
            }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Compile Arthur orchestrator Python
        run: python3 -m py_compile ai_orchestrator/arthur.py ai_orchestrator/cli.py ai_orchestrator/runtime.py ai_orchestrator/supervisor.py ai_orchestrator/recovery.py ai_orchestrator/recovery_runtime.py scripts/arthur-codex-runtime-probe.py

      - name: Test runtime checkpoint synchronization
        run: python3 -m unittest tests.test_runtime_checkpoint_sync -v

      - name: Validate LIVE_PREVIEW JSON contracts
        run: |
          python3 -m json.tool production/live-preview-policy.json >/dev/null
          python3 -m json.tool production/mature-ui-sources.json >/dev/null
          python3 -m json.tool production/operator-intent.json >/dev/null

      - name: Test v4 toolchain bootstrap gate
        run: ./tests/test-v4-toolchain-bootstrap.sh

      - name: Test v4 toolchain acceptance gate
        run: ./tests/test-v4-toolchain-acceptance.sh

      - name: Determine changed files
        id: changes
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee changed-files.txt
          SCOPE="$(bash ./scripts/classify-build-scope.sh < changed-files.txt)"
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Build scope: $SCOPE"

      - name: Run static project verification
        if: success() && steps.changes.outputs.scope != 'DOC_ONLY'
        run: ./scripts/verify-project.sh

      - name: Preflight summary
        if: always()
        run: |
          {
            echo '## Arthur Fast Preflight'
            echo
            echo "- Scope: \`${{ steps.changes.outputs.scope || 'UNRESOLVED' }}\`"
            echo '- This workflow never compiles firmware or mutates Stable Known-Good state.'
            echo '- Firmware event history is append-only; historical ledger rewrites fail closed.'
            echo '- LIVE_PREVIEW is a pre-Candidate development aid and never counts as formal REAL_DEVICE_VERIFY.'
            echo '- Mature AdGuard Home and official QuickStart sources are pinned separately from Known-Good firmware refs.'
            echo '- Mature ADH LIVE_PREVIEW uses safe UI-only fallback; DNS/firewall/start-stop runtime mutation tests are deferred to formal REAL_DEVICE_VERIFY.'
            echo '- Feature Handoff must continue accepted LIVE_PREVIEW through the durable v3 request auto trigger unless pause_after_live_preview is explicit.'
            echo '- DOC_ONLY: documentation/knowledge only; no firmware build required.'
            echo '- FAST_GATE: CI/verifier/test/control-plane change; static gates only.'
            echo '- IMAGEBUILDER: assemble firmware from Known-Good-compatible prebuilt packages.'
            echo '- SDK_BUILD: rebuild user-space packages with the Known-Good-matched SDK.'
            echo '- FULL_BUILD: kernel/ABI/unknown change; full Candidate build required.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-closure:
    if: ${{ needs.preflight.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.build_closure == true) || (github.event_name == 'pull_request' && (needs.preflight.outputs.scope == 'FULL_BUILD' || needs.preflight.outputs.scope == 'SDK_BUILD'))) }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: bash ./scripts/codex-setup.sh

      - name: Prepare exact Candidate lock
        id: lock
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          CLOSURE_LOCK="$RUNNER_TEMP/arthur-build-closure.lock"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CLOSURE_MODE="${{ inputs.update_mode }}"
          else
            CLOSURE_MODE="rebuild_known_good"
          fi
          ./scripts/prepare-update-lock.sh "$CLOSURE_MODE" "$CLOSURE_LOCK"
          echo "path=$CLOSURE_LOCK" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$CLOSURE_LOCK" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "mode=$CLOSURE_MODE" >> "$GITHUB_OUTPUT"

      - name: Run exact source and config closure
        shell: bash
        env:
          USE_KNOWN_GOOD_LOCK: '1'
          KNOWN_GOOD_LOCK: ${{ steps.lock.outputs.path }}
          JOBS: '2'
          QUIET_BUILD: '0'
          REUSE_SOURCE: '0'
          BUILD_CLOSURE_ONLY: '1'
        run: |
          set -Eeuo pipefail
          ./scripts/build.sh
          grep -q '^BUILD_CLOSURE_PREFLIGHT=PASS$' output/logs/build.log

      - name: Analyze closure failure
        if: failure()
        shell: bash
        run: |
          set +e
          if [[ -s output/logs/build.log ]]; then
            ./scripts/analyze-error.sh output/logs/build.log
          elif [[ -s output/logs/build-diagnostic.log ]]; then
            ./scripts/analyze-error.sh output/logs/build-diagnostic.log
          fi
          exit 0

      - name: Upload build closure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arthur-build-closure-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/build-diagnostic.log
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/logs/failure-report.txt
            output/full.config
          if-no-files-found: warn
          retention-days: 14

      - name: Build closure summary
        if: always()
        run: |
          {
            echo '## Arthur exact build closure'
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Update mode: \`${{ steps.lock.outputs.mode || 'UNAVAILABLE' }}\`"
            echo "- Candidate lock SHA256: \`${{ steps.lock.outputs.sha || 'UNAVAILABLE' }}\`"
            echo '- Boundary: exact source/feeds/custom packages/provenance/package existence/overlay/make defconfig/check-config only.'
            echo '- Firmware source download: not run after closure PASS.'
            echo '- Firmware compile: not run.'
          } >> "$GITHUB_STEP_SUMMARY"


  openclash-package-closure:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ci/arthur-openclash-package-closure-20260922' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact Arthur repair candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4befe60e77bcaa8dd8270d466be26f4f739f4ed3
          fetch-depth: 0
          path: candidate

      - name: Download verified Arthur SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p toolchain
          gh run download 33196164359             --repo "$GITHUB_REPOSITORY"             --name Arthur-v4-toolchain-33196164359             --dir toolchain
          (
            cd toolchain
            sha256sum -c SHA256SUMS
          )
          test -s toolchain/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          echo 'ARTHUR_VERIFIED_SDK=PASS'

      - name: Compile and verify OpenClash Core package only
        run: |
          set -Eeuo pipefail
          mkdir -p sdk
          tar --zstd -xf toolchain/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst -C sdk
          SDK_DIR="$(find sdk -mindepth 1 -maxdepth 1 -type d -name 'immortalwrt-sdk-*' -print -quit)"
          test -n "$SDK_DIR"
          cp toolchain/full.config "$SDK_DIR/.config"

          mkdir -p "$SDK_DIR/package/xinzhao"
          rm -rf "$SDK_DIR/package/xinzhao/openclash-core"
          cp -a candidate/package/xinzhao/openclash-core "$SDK_DIR/package/xinzhao/openclash-core"

          grep -Fxq 'RSTRIP:=:' candidate/package/xinzhao/openclash-core/Makefile
          grep -Fxq 'STRIP:=:' candidate/package/xinzhao/openclash-core/Makefile

          bash candidate/scripts/fetch-openclash-core.sh "$SDK_DIR"
          test -s candidate/output/openclash-core-source-verification.txt

          sed -i             -e '/^CONFIG_PACKAGE_openclash-core=/d'             -e '/^# CONFIG_PACKAGE_openclash-core is not set$/d'             "$SDK_DIR/.config"
          printf '\nCONFIG_PACKAGE_openclash-core=m\n' >> "$SDK_DIR/.config"

          make -C "$SDK_DIR" defconfig
          make -C "$SDK_DIR" package/xinzhao/openclash-core/clean V=s
          make -C "$SDK_DIR" package/xinzhao/openclash-core/compile V=s

          APK="$(find "$SDK_DIR/bin/packages" -type f -name 'openclash-core-*.apk' -print -quit)"
          test -n "$APK"
          APK_TOOL="$(find "$SDK_DIR/staging_dir" -type f -path '*/host/bin/apk' -print -quit)"
          test -x "$APK_TOOL"

          "$APK_TOOL" adbdump --format json "$APK" > openclash-core-apk.json
          python3 - <<'PY'
          import json
          d=json.load(open('openclash-core-apk.json', encoding='utf-8'))
          info=d['info']
          assert info['name']=='openclash-core', info
          assert info['version']=='0.1.0_alpha-r1', info
          assert info['arch']=='aarch64_cortex-a53', info
          print('OPENCLASH_CORE_APK_METADATA=PASS')
          PY

          rm -rf package-root synthetic-rootfs
          mkdir -p package-root synthetic-rootfs/etc/openclash/core
          "$APK_TOOL" --allow-untrusted extract --destination package-root "$APK"

          STAGED="$SDK_DIR/package/xinzhao/openclash-core/files/clash_meta"
          PKG_BUILD="$(find "$SDK_DIR/build_dir" -type f -path '*/openclash-core-*/clash_meta' -print -quit)"
          PAYLOAD="package-root/etc/openclash/core/clash_meta"
          test -f "$STAGED"
          test -f "$PKG_BUILD"
          test -f "$PAYLOAD"
          install -m0755 "$PAYLOAD" synthetic-rootfs/etc/openclash/core/clash_meta

          OFFICIAL_SHA="$(sed -n 's/^OPENCLASH_CORE_BINARY_SHA256=//p' candidate/output/openclash-core-source-verification.txt | head -1)"
          STAGED_SHA="$(sha256sum "$STAGED" | awk '{print $1}')"
          PKG_BUILD_SHA="$(sha256sum "$PKG_BUILD" | awk '{print $1}')"
          PAYLOAD_SHA="$(sha256sum "$PAYLOAD" | awk '{print $1}')"
          SYNTHETIC_SHA="$(sha256sum synthetic-rootfs/etc/openclash/core/clash_meta | awk '{print $1}')"

          {
            echo "CANDIDATE_SOURCE_SHA=4befe60e77bcaa8dd8270d466be26f4f739f4ed3"
            echo "OFFICIAL_LOCKED_CORE_SHA256=$OFFICIAL_SHA"
            echo "STAGED_CORE_SHA256=$STAGED_SHA"
            echo "PKG_BUILD_CORE_SHA256=$PKG_BUILD_SHA"
            echo "PACKAGE_PAYLOAD_CORE_SHA256=$PAYLOAD_SHA"
            echo "SYNTHETIC_ROOTFS_CORE_SHA256=$SYNTHETIC_SHA"
          } | tee openclash-core-package-only.txt

          test "$OFFICIAL_SHA" = "$STAGED_SHA"
          test "$OFFICIAL_SHA" = "$PKG_BUILD_SHA"
          test "$OFFICIAL_SHA" = "$PAYLOAD_SHA"
          test "$OFFICIAL_SHA" = "$SYNTHETIC_SHA"

          readelf -h "$PAYLOAD" | tee openclash-core-readelf.txt
          grep -Eq 'Class:[[:space:]]+ELF64' openclash-core-readelf.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' openclash-core-readelf.txt
          test -x "$PAYLOAD"

          {
            echo 'OPENCLASH_CORE_APK=PASS'
            echo 'OPENCLASH_CORE_ARCH=PASS'
            echo 'OPENCLASH_CORE_PAYLOAD_IDENTITY=PASS'
            echo 'PACKAGE_ONLY_TESTS=PASS'
          } | tee -a openclash-core-package-only.txt

          chmod +x candidate/scripts/*.sh candidate/tests/*.sh || true

          # Prepare only the exact pinned AdGuard Home LuCI source needed by the
          # existing static acceptance contract; this is still prebuild-only.
          LUCI_REF="$(sed -n 's/^LUCI_REF="//; s/"$//p' candidate/config/arthur-known-good.lock | head -1)"
          test -n "$LUCI_REF"
          git init adh-luci-src
          git -C adh-luci-src remote add origin https://github.com/immortalwrt/luci.git
          git -C adh-luci-src fetch --depth=1 origin "$LUCI_REF"
          git -C adh-luci-src checkout --detach FETCH_HEAD
          mkdir -p prepared-source/package/feeds/xinzhao
          ln -s "$PWD/adh-luci-src/applications/luci-app-adguardhome" prepared-source/package/feeds/xinzhao/luci-app-adguardhome

          FEED_CHECK_ROOT="$PWD/prepared-source" \
            bash candidate/scripts/prebuild-closure.sh openclash-core-package-only.txt

      - name: Upload OpenClash package-only closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Arthur-openclash-package-closure-${{ github.run_id }}
          path: |
            openclash-core-package-only.txt
            openclash-core-apk.json
            openclash-core-readelf.txt
            candidate/output/openclash-core-source-verification.txt
          if-no-files-found: warn
          retention-days: 14
