name: Arthur Runner Control Plane Wakeup

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: arthur-runner-control-plane-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure persistent headless Python and Codex runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonHome = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython'
          $managedPython = Join-Path $pythonHome 'python'
          $uvCache = Join-Path $pythonHome 'cache'
          $venv = Join-Path $pythonHome '.venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null

          $reuse = $false
          if (Test-Path $pythonExe) {
            & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $reuse = $true
              Write-Host "HEADLESS_RUNTIME=REUSE interpreter=$pythonExe"
            }
          }

          if (-not $reuse) {
            $tools = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\Tools'
            $uvExe = Join-Path $tools 'uv.exe'
            New-Item -ItemType Directory -Force -Path $tools | Out-Null

            if (-not (Test-Path $uvExe)) {
              $cachedUv = Get-ChildItem 'C:\actions-runner\_work\_tool\uv' -Recurse -Filter uv.exe -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($cachedUv) { Copy-Item -Force $cachedUv.FullName $uvExe }
            }

            if (-not (Test-Path $uvExe)) {
              $zip = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9.zip'
              $extract = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9'
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/astral-sh/uv/releases/download/0.12.9/uv-x86_64-pc-windows-msvc.zip' -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              $downloadedUv = Get-ChildItem $extract -Recurse -Filter uv.exe -File | Select-Object -First 1
              if (-not $downloadedUv) { throw 'Pinned uv bootstrap archive did not contain uv.exe.' }
              Copy-Item -Force $downloadedUv.FullName $uvExe
            }

            $env:UV_PYTHON_INSTALL_DIR = $managedPython
            $env:UV_CACHE_DIR = $uvCache
            & $uvExe python install 3.12
            if ($LASTEXITCODE -ne 0) { throw 'uv managed Python 3.12 install failed.' }
            & $uvExe venv $venv --python 3.12 --clear
            if ($LASTEXITCODE -ne 0) { throw 'uv persistent venv creation failed.' }
            & $uvExe pip install --python $pythonExe -r requirements-headless.txt
            if ($LASTEXITCODE -ne 0) { throw 'Headless Codex dependency installation failed.' }
          }

          & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Persistent headless Python/Codex verification failed.' }

          (Split-Path -Parent $pythonExe) >> $env:GITHUB_PATH
          "HEADLESS_PYTHON_EXE=$pythonExe" >> $env:GITHUB_ENV
          Write-Host "HEADLESS_CODEX_RUNTIME=PASS interpreter=$pythonExe"

      - name: Reconcile and resume Arthur Control Plane
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\arthur-control-plane.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "CONTROL_PLANE_WAKEUP_FAILED: missing $script"
          }
          & $script -Repository $env:GITHUB_REPOSITORY -WorkflowRunId $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish wakeup summary
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          "## Arthur Runner Control Plane Wakeup" >> $env:GITHUB_STEP_SUMMARY
          "- Runner identity: ``$(whoami)``" >> $env:GITHUB_STEP_SUMMARY
          "- Canonical root: ``$root``" >> $env:GITHUB_STEP_SUMMARY
          $heartbeat = Join-Path $root 'heartbeat.json'
          if (Test-Path -LiteralPath $heartbeat) {
            $h = Get-Content -Raw -LiteralPath $heartbeat | ConvertFrom-Json
            "- Heartbeat sequence: ``$($h.sequence)``" >> $env:GITHUB_STEP_SUMMARY
          }
          $runtimeState = Join-Path $root 'state\runtime-state.json'
          if (Test-Path -LiteralPath $runtimeState) {
            $runtime = Get-Content -Raw -LiteralPath $runtimeState | ConvertFrom-Json
            "- Release task: ``$($runtime.request_id)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime phase: ``$($runtime.phase)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime turn count: ``$($runtime.turn_count)``" >> $env:GITHUB_STEP_SUMMARY
            "- Terminal state: ``$($runtime.terminal_state)``" >> $env:GITHUB_STEP_SUMMARY
          }
