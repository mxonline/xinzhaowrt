name: Arthur Runner Control Plane Wakeup

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: arthur-runner-control-plane-wakeup
  cancel-in-progress: false

jobs:
  wakeup:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      ARTHUR_WINDOWS_REPAIR_MODE: DiagnosticOnly

    steps:
      - name: Sync persistent task workspace and clean Control Plane code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          $workspace = Join-Path $root 'workspace'
          $controlRoot = Join-Path $root 'control-runtime'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure Git authentication for the runner Control Plane.' }

          # Mutable task workspace: preserve Headless Codex changes exactly as they are.
          if (-not (Test-Path (Join-Path $workspace '.git'))) {
            git clone --branch main --single-branch "https://github.com/$env:GITHUB_REPOSITORY.git" $workspace
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create persistent Control Plane task workspace.' }
            Write-Host 'CONTROL_PLANE_WORKSPACE_BOOTSTRAPPED=PASS'
          }
          else {
            git -C $workspace remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to normalize persistent task workspace origin.' }
            git -C $workspace fetch --prune origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main into persistent task workspace.' }

            $dirty = (& git -C $workspace status --porcelain | Out-String).Trim()
            if ($dirty) {
              Write-Host 'CONTROL_PLANE_WORKSPACE_DIRTY=PRESERVED'
            }
            else {
              $head = (& git -C $workspace rev-parse HEAD).Trim()
              $originMain = (& git -C $workspace rev-parse origin/main).Trim()
              $branch = (& git -C $workspace branch --show-current).Trim()
              if ($head -eq $originMain) {
                Write-Host "CONTROL_PLANE_WORKSPACE_SYNCED=PASS branch=$branch sha=$head"
              }
              else {
                git -C $workspace merge-base --is-ancestor $head $originMain 2>$null
                $behind = ($LASTEXITCODE -eq 0)
                git -C $workspace merge-base --is-ancestor $originMain $head 2>$null
                $ahead = ($LASTEXITCODE -eq 0)

                if ($behind -and $branch -eq 'main') {
                  git -C $workspace merge --ff-only origin/main
                  if ($LASTEXITCODE -ne 0) { throw 'Persistent task workspace could not fast-forward safely.' }
                  Write-Host 'CONTROL_PLANE_WORKSPACE_FAST_FORWARD=PASS'
                }
                elseif ($ahead) {
                  Write-Host "CONTROL_PLANE_WORKSPACE_AHEAD=PRESERVED branch=$branch sha=$head"
                }
                else {
                  Write-Host "CONTROL_PLANE_WORKSPACE_DIVERGED=PRESERVED branch=$branch sha=$head origin_main=$originMain"
                }
              }
            }
          }

          $sourceSha = (& git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'Persistent task workspace HEAD is invalid.' }
          $sourceBranch = (& git -C $workspace branch --show-current).Trim()
          if (-not $sourceBranch) { $sourceBranch = 'DETACHED' }

          # Clean control-code checkout: never let a dirty task workspace pin watchdog/runtime fixes to an old SHA.
          if (-not (Test-Path (Join-Path $controlRoot '.git'))) {
            git clone --branch main --single-branch "https://github.com/$env:GITHUB_REPOSITORY.git" $controlRoot
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create clean Control Plane code checkout.' }
            Write-Host 'CONTROL_PLANE_CODE_BOOTSTRAPPED=PASS'
          }
          else {
            git -C $controlRoot remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to normalize clean Control Plane code origin.' }

            # Python imports may leave deterministic bytecode artifacts in this disposable clean mirror.
            # Remove only those generated caches; any other change remains a hard fail with evidence.
            Get-ChildItem -LiteralPath $controlRoot -Recurse -Directory -Filter '__pycache__' -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -LiteralPath $controlRoot -Recurse -File -Filter '*.pyc' -Force -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue

            $controlDirty = (& git -C $controlRoot status --porcelain | Out-String).Trim()
            if ($controlDirty) {
              Write-Host 'CONTROL_PLANE_CODE_DIRTY_FILES_BEGIN'
              Write-Host $controlDirty
              Write-Host 'CONTROL_PLANE_CODE_DIRTY_FILES_END'
              throw 'CONTROL_PLANE_CODE_DIRTY: clean control-runtime contains unexpected non-cache changes.'
            }
            git -C $controlRoot fetch --prune origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main into clean Control Plane code checkout.' }
            $controlBranch = (& git -C $controlRoot branch --show-current).Trim()
            if ($controlBranch -ne 'main') {
              git -C $controlRoot switch main
              if ($LASTEXITCODE -ne 0) { throw 'Unable to switch clean Control Plane code checkout to main.' }
            }
            git -C $controlRoot merge --ff-only origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Clean Control Plane code checkout could not fast-forward to origin/main.' }
          }

          $controlSha = (& git -C $controlRoot rev-parse HEAD).Trim()
          $controlOriginMain = (& git -C $controlRoot rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $controlSha -notmatch '^[0-9a-f]{40}$' -or $controlSha -ne $controlOriginMain) {
            throw "CONTROL_PLANE_CODE_STALE: head=$controlSha origin_main=$controlOriginMain"
          }

          "ARTHUR_CONTROL_PLANE_WORKSPACE=$workspace" >> $env:GITHUB_ENV
          "CONTROL_PLANE_WORKSPACE=$workspace" >> $env:GITHUB_ENV
          "ARTHUR_CONTROL_PLANE_CODE_ROOT=$controlRoot" >> $env:GITHUB_ENV
          "CONTROL_PLANE_CODE_SHA=$controlSha" >> $env:GITHUB_ENV
          "CONTROL_PLANE_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "CONTROL_PLANE_SOURCE_BRANCH=$sourceBranch" >> $env:GITHUB_ENV
          Write-Host "CONTROL_PLANE_WORKSPACE=PASS path=$workspace branch=$sourceBranch sha=$sourceSha"
          Write-Host "CONTROL_PLANE_CODE=PASS path=$controlRoot sha=$controlSha"

      - name: Ensure persistent headless Python and Codex runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonHome = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython'
          $managedPython = Join-Path $pythonHome 'python'
          $uvCache = Join-Path $pythonHome 'cache'
          $venv = Join-Path $pythonHome '.venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $requirements = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'requirements-headless.txt'
          New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null
          if (-not (Test-Path $requirements)) { throw "Headless requirements missing from clean Control Plane code: $requirements" }

          $reuse = $false
          if (Test-Path $pythonExe) {
            & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $reuse = $true
              Write-Host "HEADLESS_RUNTIME=REUSE interpreter=$pythonExe"
            }
          }

          if (-not $reuse) {
            $tools = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\Tools'
            $uvExe = Join-Path $tools 'uv.exe'
            New-Item -ItemType Directory -Force -Path $tools | Out-Null

            if (-not (Test-Path $uvExe)) {
              $cachedUv = Get-ChildItem 'C:\actions-runner\_work\_tool\uv' -Recurse -Filter uv.exe -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($cachedUv) { Copy-Item -Force $cachedUv.FullName $uvExe }
            }

            if (-not (Test-Path $uvExe)) {
              $zip = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9.zip'
              $extract = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9'
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/astral-sh/uv/releases/download/0.12.9/uv-x86_64-pc-windows-msvc.zip' -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              $downloadedUv = Get-ChildItem $extract -Recurse -Filter uv.exe -File | Select-Object -First 1
              if (-not $downloadedUv) { throw 'Pinned uv bootstrap archive did not contain uv.exe.' }
              Copy-Item -Force $downloadedUv.FullName $uvExe
            }

            $env:UV_PYTHON_INSTALL_DIR = $managedPython
            $env:UV_CACHE_DIR = $uvCache
            & $uvExe python install 3.12
            if ($LASTEXITCODE -ne 0) { throw 'uv managed Python 3.12 install failed.' }
            & $uvExe venv $venv --python 3.12 --clear
            if ($LASTEXITCODE -ne 0) { throw 'uv persistent venv creation failed.' }
            & $uvExe pip install --python $pythonExe -r $requirements
            if ($LASTEXITCODE -ne 0) { throw 'Headless Codex dependency installation failed.' }
          }

          & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Persistent headless Python/Codex verification failed.' }

          (Split-Path -Parent $pythonExe) >> $env:GITHUB_PATH
          "HEADLESS_PYTHON_EXE=$pythonExe" >> $env:GITHUB_ENV
          Write-Host "HEADLESS_CODEX_RUNTIME=PASS interpreter=$pythonExe"

      - name: Observe or trigger Windows-owned Arthur repair controller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          $stateDir = Join-Path $root 'state'
          $repairStatusPath = Join-Path $stateDir 'repair-status.json'
          $supervisorStatusPath = Join-Path $stateDir 'supervisor-status.json'
          $runtimeStatusPath = Join-Path $stateDir 'runtime-status.json'
          $runtimeStatePath = Join-Path $stateDir 'runtime-state.json'
          $repairTaskName = 'XinZhaoWrt-Arthur-Repair-Controller'
          $supervisorTaskName = 'XinZhaoWrt-Arthur-Persistent-Supervisor'
          $mode = [string]$env:ARTHUR_WINDOWS_REPAIR_MODE
          if ($mode -notin @('DiagnosticOnly','WhitelistRepair','FullRecovery')) {
            throw "WINDOWS_REPAIR_CONTROLLER_MODE_INVALID: $mode"
          }

          function Read-JsonSafe([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return $null }
            try { return (Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json) }
            catch { return $null }
          }
          function Get-Value($Object,[string]$Name,$Default=$null) {
            if ($null -eq $Object) { return $Default }
            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property) { return $Default }
            return $property.Value
          }

          "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=0" >> $env:GITHUB_ENV
          "ARTHUR_WINDOWS_REPAIR_STATE=NOT_REQUIRED" >> $env:GITHUB_ENV

          $repair = Read-JsonSafe $repairStatusPath
          if ($repair) {
            $repairStatus = [string](Get-Value $repair 'status' '')
            $repairResult = [string](Get-Value $repair 'final_result' '')
            $repairMode = [string](Get-Value $repair 'mode' '')
            if ($repairStatus -eq 'CODEX_RUNTIME_RECOVERED' -or $repairResult -eq 'CODEX_RUNTIME_RECOVERED') {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=RECOVERED status=$repairStatus mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_STATE=RECOVERED" >> $env:GITHUB_ENV
              exit 0
            }
            if ($repairStatus -like 'REPAIR_BLOCKED_*' -or $repairStatus -eq 'REPAIR_EXHAUSTED' -or $repairResult -like 'REPAIR_BLOCKED_*' -or $repairResult -eq 'REPAIR_EXHAUSTED') {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=BLOCKED status=$repairStatus result=$repairResult mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_STATE=BLOCKED" >> $env:GITHUB_ENV
              throw "WINDOWS_REPAIR_CONTROLLER_BLOCKED: evidence=$repairStatusPath status=$repairStatus result=$repairResult"
            }
            if ($repairStatus -in @('DIAGNOSING','REPAIRING','PROBING','RESTARTING','VERIFYING') -and $repairMode -eq $mode) {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=ACTIVE status=$repairStatus mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=1" >> $env:GITHUB_ENV
              "ARTHUR_WINDOWS_REPAIR_STATE=ACTIVE" >> $env:GITHUB_ENV
              exit 0
            }
          }

          $runtimeState = Read-JsonSafe $runtimeStatePath
          $supervisorStatus = Read-JsonSafe $supervisorStatusPath
          $runtimeStatus = Read-JsonSafe $runtimeStatusPath

          $phase = [string](Get-Value $runtimeState 'phase' '')
          if ([string]::IsNullOrWhiteSpace($phase)) { $phase = [string](Get-Value $runtimeState 'current_stage' '') }
          $protectedPhases = @(
            'ARTIFACT','PRE_FLASH','AUTO_FLASH_SAFETY_GATE','FLASH','WAIT_DEVICE','IDENTIFY',
            'LAN_RUNTIME','DHCP','WAN','DNS','SSH','LUCI','PLUGIN_RUNTIME_22','ARGON_KUCAT_RUNTIME',
            'SYSTEM_HEALTH','RELEASE_GATE','RELEASE','PRODUCTION_RELEASED'
          )
          $humanGate = ''
          foreach ($gateName in @('human_gate','humanGate','pending_human_gate','pendingHumanGate')) {
            $candidateGate = [string](Get-Value $runtimeState $gateName '')
            if (-not [string]::IsNullOrWhiteSpace($candidateGate)) { $humanGate = $candidateGate; break }
          }
          $protected = (-not [string]::IsNullOrWhiteSpace($humanGate)) -or ($protectedPhases -contains $phase.ToUpperInvariant())

          $supervisorAlive = $false
          $codexAlive = $false
          if (Get-Command Get-CimInstance -ErrorAction SilentlyContinue) {
            foreach ($process in @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)) {
              $command = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($command) -or $command.IndexOf($stateDir,[System.StringComparison]::OrdinalIgnoreCase) -lt 0) { continue }
              if ($command -match 'run-supervisor\.py') { $supervisorAlive = $true }
              if ($command -match 'ai_orchestrator' -and $command -match '\bresume\b') { $codexAlive = $true }
            }
          }

          $heartbeatFresh = $false
          $heartbeatAt = [string](Get-Value $runtimeStatus 'heartbeat_at' '')
          if (-not [string]::IsNullOrWhiteSpace($heartbeatAt)) {
            $parsedHeartbeat = [DateTimeOffset]::MinValue
            if ([DateTimeOffset]::TryParse($heartbeatAt,[ref]$parsedHeartbeat)) {
              $heartbeatAge = ([DateTimeOffset]::UtcNow - $parsedHeartbeat.ToUniversalTime()).TotalSeconds
              $heartbeatFresh = ($heartbeatAge -ge 0 -and $heartbeatAge -le 120)
            }
          }
          $supervisorState = [string](Get-Value $supervisorStatus 'status' '')
          $crashLoop = ($supervisorState -eq 'CRASH_LOOP_BLOCKED')
          if ($supervisorAlive -and $codexAlive -and $heartbeatFresh -and -not $crashLoop) {
            Write-Host "WINDOWS_REPAIR_CONTROLLER=NOT_REQUIRED supervisor_alive=$supervisorAlive codex_alive=$codexAlive heartbeat_fresh=$heartbeatFresh"
            "ARTHUR_WINDOWS_REPAIR_STATE=NOT_REQUIRED" >> $env:GITHUB_ENV
            exit 0
          }

          if ($protected) {
            Write-Host "WINDOWS_REPAIR_CONTROLLER=BLOCKED reason=protected_runtime phase=$phase human_gate=$humanGate evidence=$runtimeStatePath"
            "ARTHUR_WINDOWS_REPAIR_STATE=BLOCKED" >> $env:GITHUB_ENV
            throw "WINDOWS_REPAIR_CONTROLLER_BLOCKED: runtime repair is prohibited in phase=$phase human_gate=$humanGate"
          }

          if (-not (Get-Command Get-ScheduledTask -ErrorAction SilentlyContinue)) {
            throw 'WINDOWS_REPAIR_CONTROLLER_BLOCKED: ScheduledTasks cmdlets unavailable on self-hosted Windows runner.'
          }
          $supervisorTask = Get-ScheduledTask -TaskName $supervisorTaskName -ErrorAction SilentlyContinue
          if (-not $supervisorTask) {
            Write-Host 'WINDOWS_REPAIR_CONTROLLER=NOT_REQUIRED reason=supervisor_task_bootstrap_required'
            "ARTHUR_WINDOWS_REPAIR_STATE=NOT_READY" >> $env:GITHUB_ENV
            exit 0
          }

          $helper = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\ensure-arthur-windows-repair-controller.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "WINDOWS_REPAIR_CONTROLLER_HELPER_MISSING: $helper"
          }
          & $helper `
            -StateDir $stateDir `
            -ControlRoot $env:ARTHUR_CONTROL_PLANE_CODE_ROOT `
            -HeadlessPythonExe $env:HEADLESS_PYTHON_EXE `
            -Mode $mode `
            -SupervisorTaskName $supervisorTaskName `
            -RepairTaskName $repairTaskName `
            -Start
          if ($LASTEXITCODE -ne 0) {
            throw "WINDOWS_REPAIR_CONTROLLER_TRIGGER_FAILED: exit=$LASTEXITCODE"
          }
          Write-Host "WINDOWS_REPAIR_CONTROLLER=TRIGGERED task=$repairTaskName mode=$mode supervisor_status=$supervisorState supervisor_alive=$supervisorAlive codex_alive=$codexAlive heartbeat_fresh=$heartbeatFresh"
          "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=1" >> $env:GITHUB_ENV
          "ARTHUR_WINDOWS_REPAIR_STATE=TRIGGERED" >> $env:GITHUB_ENV

      - name: Reconcile and resume Arthur Control Plane
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL -eq '1') {
            Write-Host "CONTROL_PLANE_RESUME_SKIPPED_FOR_WINDOWS_REPAIR=PASS state=$env:ARTHUR_WINDOWS_REPAIR_STATE"
            exit 0
          }
          $script = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\arthur-control-plane-gate.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "CONTROL_PLANE_WAKEUP_FAILED: missing $script"
          }
          if ([string]::IsNullOrWhiteSpace($env:HEADLESS_PYTHON_EXE) -or -not (Test-Path -LiteralPath $env:HEADLESS_PYTHON_EXE -PathType Leaf)) {
            throw "CONTROL_PLANE_PYTHON_BINDING_FAILED: HEADLESS_PYTHON_EXE is missing or invalid: $env:HEADLESS_PYTHON_EXE"
          }
          $pythonDir = Split-Path -Parent $env:HEADLESS_PYTHON_EXE
          $env:PATH = "$pythonDir;$env:PATH"
          $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
          if (-not $pythonCommand) {
            throw "CONTROL_PLANE_PYTHON_BINDING_FAILED: python command unavailable after binding $pythonDir"
          }
          Write-Host "CONTROL_PLANE_PYTHON_BINDING=PASS interpreter=$($pythonCommand.Source)"

          $workspaceLedger = Join-Path $env:ARTHUR_CONTROL_PLANE_WORKSPACE 'production\firmware-events.jsonl'
          $workspaceResume = Join-Path $env:ARTHUR_CONTROL_PLANE_WORKSPACE 'production\resume-state.json'
          $controlLedger = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'production\firmware-events.jsonl'
          $controlResume = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'production\resume-state.json'
          Write-Host "CONTROL_PLANE_RUNTIME_INPUT=PASS workspace_ledger=$([bool](Test-Path -LiteralPath $workspaceLedger -PathType Leaf)) workspace_resume=$([bool](Test-Path -LiteralPath $workspaceResume -PathType Leaf)) control_ledger=$([bool](Test-Path -LiteralPath $controlLedger -PathType Leaf)) control_resume=$([bool](Test-Path -LiteralPath $controlResume -PathType Leaf))"

          $actionsWorkspace = $env:GITHUB_WORKSPACE
          $taskWorkspace = $env:ARTHUR_CONTROL_PLANE_WORKSPACE
          $env:GITHUB_WORKSPACE = $env:ARTHUR_CONTROL_PLANE_CODE_ROOT
          Push-Location $env:ARTHUR_CONTROL_PLANE_CODE_ROOT
          try {
            Write-Host "CONTROL_PLANE_GOVERNANCE_WORKSPACE_BOUND=PASS path=$env:GITHUB_WORKSPACE sha=$env:CONTROL_PLANE_CODE_SHA"
            Write-Host "CONTROL_PLANE_TASK_WORKSPACE_PRESERVED=PASS path=$taskWorkspace source_sha=$env:CONTROL_PLANE_SOURCE_SHA"
            & $script -Repository $env:GITHUB_REPOSITORY -WorkflowRunId $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
            $env:GITHUB_WORKSPACE = $actionsWorkspace
          }

      - name: Ensure Windows-owned persistent Arthur supervisor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL -eq '1') {
            Write-Host "PERSISTENT_SUPERVISOR_START_SKIPPED_FOR_WINDOWS_REPAIR=PASS state=$env:ARTHUR_WINDOWS_REPAIR_STATE"
            exit 0
          }
          $helper = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\ensure-arthur-persistent-supervisor.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "PERSISTENT_SUPERVISOR_HELPER_MISSING: $helper"
          }
          $stateDir = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane\state'
          & $helper `
            -StateDir $stateDir `
            -ControlRoot $env:ARTHUR_CONTROL_PLANE_CODE_ROOT `
            -HeadlessPythonExe $env:HEADLESS_PYTHON_EXE
          if ($LASTEXITCODE -ne 0) {
            throw "PERSISTENT_SUPERVISOR_TASK_FAILED: exit=$LASTEXITCODE"
          }
          Write-Host 'PERSISTENT_SUPERVISOR_TASK=PASS'

      - name: Publish wakeup summary
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          "## Arthur Runner Control Plane Wakeup" >> $env:GITHUB_STEP_SUMMARY
          "- Runner identity: ``$(whoami)``" >> $env:GITHUB_STEP_SUMMARY
          "- Canonical root: ``$root``" >> $env:GITHUB_STEP_SUMMARY
          "- Clean control code: ``$env:ARTHUR_CONTROL_PLANE_CODE_ROOT`` @ ``$env:CONTROL_PLANE_CODE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Persistent task workspace: ``$env:ARTHUR_CONTROL_PLANE_WORKSPACE``" >> $env:GITHUB_STEP_SUMMARY
          "- Task source branch: ``$env:CONTROL_PLANE_SOURCE_BRANCH``" >> $env:GITHUB_STEP_SUMMARY
          "- Task source SHA: ``$env:CONTROL_PLANE_SOURCE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Windows repair routing: ``$env:ARTHUR_WINDOWS_REPAIR_STATE`` (mode ``$env:ARTHUR_WINDOWS_REPAIR_MODE``)" >> $env:GITHUB_STEP_SUMMARY
          $heartbeat = Join-Path $root 'heartbeat.json'
          if (Test-Path -LiteralPath $heartbeat) {
            $h = Get-Content -Raw -LiteralPath $heartbeat | ConvertFrom-Json
            "- Heartbeat sequence: ``$($h.sequence)``" >> $env:GITHUB_STEP_SUMMARY
          }
          $runtimeState = Join-Path $root 'state\runtime-state.json'
          if (Test-Path -LiteralPath $runtimeState) {
            $runtime = Get-Content -Raw -LiteralPath $runtimeState | ConvertFrom-Json
            "- Release task: ``$($runtime.release_task_id)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime phase: ``$($runtime.phase)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime turn count: ``$($runtime.turn_count)``" >> $env:GITHUB_STEP_SUMMARY
            "- Terminal state: ``$($runtime.terminal_state)``" >> $env:GITHUB_STEP_SUMMARY
          }
          $repairStatus = Join-Path $root 'state\repair-status.json'
          if (Test-Path -LiteralPath $repairStatus) {
            try {
              $repair = Get-Content -Raw -LiteralPath $repairStatus | ConvertFrom-Json
              "- Repair status: ``$($repair.status)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair failure class: ``$($repair.failure_class)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair action: ``$($repair.selected_repair_action)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair final result: ``$($repair.final_result)``" >> $env:GITHUB_STEP_SUMMARY
            }
            catch {
              "- Repair status: ``UNREADABLE``" >> $env:GITHUB_STEP_SUMMARY
            }
          }
