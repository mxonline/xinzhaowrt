name: Arthur Production Agent Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'production/production-agent.json'
      - 'production/arthur-flash-profile.json'
      - 'requirements-headless.txt'
      - 'scripts/production-agent.ps1'
      - 'scripts/fetch-production-artifact.ps1'
      - 'scripts/auto-flash-safety-gate.ps1'
      - 'scripts/ci-controller-v3.ps1'
      - 'scripts/install-production-agent.ps1'
      - 'scripts/uninstall-production-agent.ps1'
      - 'scripts/start-production-agent.ps1'
      - 'scripts/production-agent-status.ps1'
      - 'scripts/bridge-runtime-status.ps1'
      - 'scripts/recover-existing-bridge-context.ps1'
      - 'scripts/run-supervisor.py'
      - 'ai_orchestrator/**'
      - 'tests/production-agent.tests.ps1'
      - 'tests/verified-baseline-inheritance.tests.ps1'
      - '.github/workflows/production-agent-deploy.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: arthur-production-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 45

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Quiesce standalone GPT Codex Bridge phase machine
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          $stateDir = Join-Path $runtime 'output\headless-production'
          $taskName = 'XinZhaoWrt-GPT-Codex-Bridge-Supervisor'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          Set-Content -Path (Join-Path $stateDir 'STOP') -Value 'dispatch-only' -Encoding ASCII -Force

          if (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue) {
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          $pidCandidates = New-Object System.Collections.Generic.HashSet[int]
          foreach ($jsonName in @('supervisor-state.json','runtime-status.json')) {
            $path = Join-Path $stateDir $jsonName
            if (-not (Test-Path $path)) { continue }
            try {
              $data = Get-Content -Raw $path | ConvertFrom-Json
              foreach ($field in @('child_pid','daemon_pid','supervisor_pid')) {
                if ($data.PSObject.Properties.Name -contains $field -and $data.$field) {
                  [void]$pidCandidates.Add([int]$data.$field)
                }
              }
            } catch {}
          }
          foreach ($processId in $pidCandidates) {
            try {
              $proc = Get-CimInstance Win32_Process -Filter "ProcessId=$processId" -ErrorAction Stop
              $cmd = [string]$proc.CommandLine
              if ($cmd -match '(?i)ai_orchestrator|run-supervisor\.py' -and $cmd -match '(?i)headless-production') {
                Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
                Write-Host "GPT_CODEX_BRIDGE_STANDALONE_STOPPED pid=$processId"
              }
            } catch {}
          }
          Write-Host 'GPT_CODEX_BRIDGE_DISPATCH_ONLY=PASS'
          exit 0

      - name: Validate deployment source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/production-agent.tests.ps1
          if (Test-Path ./tests/verified-baseline-inheritance.tests.ps1) {
            & ./tests/verified-baseline-inheritance.tests.ps1
          }

      - name: Reuse or bootstrap persistent Python 3.12 and GPT Codex dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonHome = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython'
          $managedPython = Join-Path $pythonHome 'python'
          $uvCache = Join-Path $pythonHome 'cache'
          $venv = Join-Path $pythonHome '.venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null

          $reuse = $false
          if (Test-Path $pythonExe) {
            & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $reuse = $true
              Write-Host "GPT_CODEX_BRIDGE_RUNTIME=REUSE interpreter=$pythonExe"
            }
          }

          if (-not $reuse) {
            $tools = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\Tools'
            $uvExe = Join-Path $tools 'uv.exe'
            New-Item -ItemType Directory -Force -Path $tools | Out-Null

            if (-not (Test-Path $uvExe)) {
              $cachedUv = Get-ChildItem 'C:\actions-runner\_work\_tool\uv' -Recurse -Filter uv.exe -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($cachedUv) {
                Copy-Item -Force $cachedUv.FullName $uvExe
              }
            }

            if (-not (Test-Path $uvExe)) {
              $zip = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9.zip'
              $extract = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9'
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/astral-sh/uv/releases/download/0.12.9/uv-x86_64-pc-windows-msvc.zip' -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              $downloadedUv = Get-ChildItem $extract -Recurse -Filter uv.exe -File | Select-Object -First 1
              if (-not $downloadedUv) { throw 'Pinned uv bootstrap archive did not contain uv.exe.' }
              Copy-Item -Force $downloadedUv.FullName $uvExe
            }

            $env:UV_PYTHON_INSTALL_DIR = $managedPython
            $env:UV_CACHE_DIR = $uvCache
            & $uvExe python install 3.12
            if ($LASTEXITCODE -ne 0) { throw 'uv managed Python 3.12 install failed.' }
            & $uvExe venv $venv --python 3.12 --clear
            if ($LASTEXITCODE -ne 0) { throw 'uv persistent venv creation failed.' }
            if (-not (Test-Path $pythonExe)) { throw "Persistent Python executable was not created: $pythonExe" }
            & $uvExe pip install --python $pythonExe -r requirements-headless.txt
            if ($LASTEXITCODE -ne 0) { throw 'GPT-Codex Bridge dependency installation failed.' }
            & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -ne 0) { throw 'Persistent Python/Codex SDK verification failed.' }
            Write-Host "GPT_CODEX_BRIDGE_RUNTIME=BOOTSTRAPPED interpreter=$pythonExe"
          }

          "HEADLESS_PYTHON_EXE=$pythonExe" >> $env:GITHUB_ENV
          Write-Host "GPT_CODEX_BRIDGE_PYTHON=PASS interpreter=$pythonExe"
          Write-Host 'GPT_CODEX_SDK_IMPORT=PASS'

      - name: Inspect existing GPT Codex Bridge runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & ./scripts/bridge-runtime-status.ps1
          exit 0

      - name: Recover existing Bridge in original user context
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & ./scripts/recover-existing-bridge-context.ps1
          exit 0

      - name: Sync stable Production Agent runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          $workspace = $env:GITHUB_WORKSPACE
          $repo = 'https://github.com/mxonline/xinzhaowrt.git'
          $sourceSha = (git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the already checked-out deployment source SHA.'
          }

          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          if (-not (Test-Path (Join-Path $runtime '.git'))) {
            git -C $runtime init
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize stable Production Agent runtime.' }
            git -C $runtime remote add origin $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to configure Production Agent origin.' }
          } else {
            git -C $runtime remote set-url origin $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize Production Agent origin.' }
          }

          git -C $runtime fetch --force $workspace 'refs/heads/main:refs/remotes/deploy/main'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to import main from the local checked-out workspace.' }
          git -C $runtime checkout -B main refs/remotes/deploy/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout locally imported main in Production Agent runtime.' }
          git -C $runtime reset --hard $sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'Failed to synchronize Production Agent runtime to the checked-out source SHA.' }

          $runtimeSha = (git -C $runtime rev-parse HEAD).Trim()
          if ($runtimeSha -ne $sourceSha) { throw "Production Agent runtime SHA mismatch: source=$sourceSha runtime=$runtimeSha" }
          if (-not (Test-Path (Join-Path $runtime 'ai_orchestrator\adapters.py'))) { throw 'Existing GPT-Codex Bridge adapters were not synchronized into the persistent runtime.' }
          Write-Host "PRODUCTION_AGENT_RUNTIME=$runtime"
          Write-Host "PRODUCTION_AGENT_RUNTIME_SHA=$runtimeSha"
          Write-Host 'PRODUCTION_AGENT_LOCAL_SYNC=PASS'
          Write-Host 'GPT_CODEX_BRIDGE_RUNTIME_SYNC=PASS'

      - name: Verify persistent GitHub machine credential
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $probe = & gh api repos/mxonline/xinzhaowrt --jq .full_name 2>&1
          if ($LASTEXITCODE -eq 0 -and (($probe -join "`n") -match 'mxonline/xinzhaowrt')) { Write-Host 'PERSISTENT_GITHUB_AUTH=PASS' }
          else { Write-Warning "PERSISTENT_GITHUB_AUTH=RETRYING $($probe -join ' ')" }
          exit 0

      - name: Install and start persistent Production Agent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $runtime 'scripts\install-production-agent.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Production Agent install failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 5
          $task = Get-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Production-Agent' -ErrorAction Stop
          Write-Host "PRODUCTION_AGENT_TASK=$($task.State)"
          if (Test-Path (Join-Path $runtime 'output\production-agent\state.json')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $runtime 'scripts\production-agent-status.ps1')
          } else { Write-Host 'PRODUCTION_AGENT_STATE=STARTING' }
          Write-Host 'PRODUCTION_AGENT_DEPLOY=PASS'

      - name: Confirm GPT Codex Bridge dispatch-only mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $taskName = 'XinZhaoWrt-GPT-Codex-Bridge-Supervisor'
          $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if ($task) {
            Write-Warning "Standalone Bridge supervisor still registered; removing it now. state=$($task.State)"
            Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }
          Write-Host 'GPT_CODEX_BRIDGE_DISPATCH_ONLY=PASS'
          exit 0

      - name: Start persistent v3 controller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          $controller = Join-Path $runtime 'scripts\ci-controller-v3.ps1'
          if (-not (Test-Path $controller)) { throw "Controller missing from stable runtime: $controller" }

          $pwsh = Get-Command pwsh.exe -ErrorAction SilentlyContinue
          if ($pwsh) { $pwshPath = $pwsh.Source }
          else { $pwshPath = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\PowerShell\current\pwsh.exe' }
          if (-not (Test-Path $pwshPath)) { throw "PowerShell 7 unavailable for controller: $pwshPath" }

          $taskName = 'XinZhaoWrt-Arthur-v3-Controller'
          $currentUser = "$env:USERDOMAIN\$env:USERNAME"
          $action = New-ScheduledTaskAction -Execute $pwshPath -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$controller`" -Mode Watch" -WorkingDirectory $runtime
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User $currentUser
          $settings = New-ScheduledTaskSettingsSet -StartWhenAvailable -RestartCount 50 -RestartInterval (New-TimeSpan -Minutes 1) -ExecutionTimeLimit ([TimeSpan]::Zero) -MultipleInstances IgnoreNew
          $principal = New-ScheduledTaskPrincipal -UserId $currentUser -LogonType Interactive -RunLevel Highest
          $task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Description 'Existing Arthur v3 Codex repair/controller loop. Continues build -> repair -> Candidate -> Production Agent -> PRODUCTION_RELEASED.'
          Register-ScheduledTask -TaskName $taskName -InputObject $task -Force | Out-Null
          Start-ScheduledTask -TaskName $taskName
          Start-Sleep -Seconds 3
          $registered = Get-ScheduledTask -TaskName $taskName -ErrorAction Stop
          Write-Host "V3_CONTROLLER_TASK=$($registered.State)"
          Write-Host 'UNATTENDED_CODEX_CONTINUATION=STARTED'

      - name: Continue current Arthur release on authenticated runner
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          $configPath = Join-Path $runtime 'production\production-agent.json'
          $agent = Join-Path $runtime 'scripts\production-agent.ps1'
          $status = Join-Path $runtime 'scripts\production-agent-status.ps1'
          $statePath = Join-Path $runtime 'output\production-agent\state.json'
          if (-not (Test-Path $configPath)) { throw "Production Agent config missing: $configPath" }
          if (-not (Test-Path $agent)) { throw "Production Agent missing: $agent" }
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $runId = [long]$config.bootstrap.run_id
          if ($runId -le 0) { throw 'Current Arthur production run_id is not configured.' }
          $pwsh = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\PowerShell\current\pwsh.exe'
          if (-not (Test-Path $pwsh)) {
            $resolved = Get-Command pwsh.exe -ErrorAction SilentlyContinue
            if (-not $resolved) { throw 'PowerShell 7 unavailable for authenticated Production Agent continuation.' }
            $pwsh = $resolved.Source
          }

          $deadline = (Get-Date).AddMinutes(10)
          Write-Host "PRODUCTION_AGENT_AUTHENTICATED_CONTINUATION=START run=$runId deadline=$($deadline.ToString('o'))"
          while ((Get-Date) -lt $deadline) {
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              & $pwsh -NoProfile -ExecutionPolicy Bypass -File $agent -Mode RunOnce -RunId $runId
              $agentExit = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousPreference
            }

            $state = $null
            if (Test-Path $statePath) {
              try { $state = Get-Content -Raw $statePath | ConvertFrom-Json } catch {}
            }

            if ($state -and [string]$state.stage -eq 'PRODUCTION_RELEASED') {
              if (Test-Path $status) { & $pwsh -NoProfile -ExecutionPolicy Bypass -File $status }
              Write-Host "PRODUCTION_AGENT_AUTHENTICATED_CONTINUATION=PASS run=$runId"
              exit 0
            }

            if ($state -and [string]$state.human_gate -in @($config.human_stop_classes)) {
              if (Test-Path $status) { & $pwsh -NoProfile -ExecutionPolicy Bypass -File $status }
              throw "Arthur release stopped at frozen flash-safety boundary: $($state.human_gate)"
            }

            $stage = if ($state) { [string]$state.stage } else { 'UNKNOWN' }
            $stateStatus = if ($state) { [string]$state.status } else { 'UNKNOWN' }
            Write-Host "PRODUCTION_AGENT_AUTHENTICATED_RETRY run=$runId exit=$agentExit stage=$stage status=$stateStatus"
            Start-Sleep -Seconds 30
          }

          if (Test-Path $status) { & $pwsh -NoProfile -ExecutionPolicy Bypass -File $status }
          Write-Warning "PRODUCTION_AGENT_AUTHENTICATED_RETRY_WINDOW_EXPIRED run=$runId; scheduled recovery will re-enter the same durable checkpoint."
          exit 0