name: Arthur Runner Control Plane Wakeup

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      runtime_gate:
        description: 'Run one read-only 120-second Arthur runtime gate on CYCHAN'
        required: false
        type: boolean
        default: false
      supervisor_handoff:
        description: 'Run one safety-gated Supervisor-only controlled handoff on CYCHAN'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: arthur-runner-control-plane-wakeup
  cancel-in-progress: false

jobs:
  runtime-gate:
    if: ${{ inputs.runtime_gate == true && inputs.supervisor_handoff != true }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEADLESS_CODEX_MODEL: gpt-5.6-terra
      ARTHUR_CONTROL_PLANE_CODE_ROOT: C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\ControlPlane\control-runtime
      ARTHUR_CONTROL_PLANE_STATE_DIR: C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\ControlPlane\state
      HEADLESS_PYTHON_EXE: C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe

    steps:
      - name: Verify runtime and observe one gate window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\ControlPlane'
          $state = Join-Path $root 'state'
          $control = Join-Path $root 'control-runtime'
          $python = 'C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe'
          $probe = Join-Path $control 'scripts\arthur-codex-runtime-probe.py'

          function Redact([string]$Text) {
            if ($null -eq $Text) { return '' }
            $value = [regex]::Replace($Text, '(?i)(authorization|token|cookie|secret|api[_-]?key|password)(\s*[:=]\s*)[^\s,;]+', '$1$2<REDACTED>')
            return [regex]::Replace($value, '(?i)(Bearer\s+)[^\s]+', '$1<REDACTED>')
          }
          function Json([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "RUNTIME_GATE_MISSING=$Path" }
            return Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json
          }
          function Value($Object,[string]$Name,[string]$Default = 'UNKNOWN') {
            if ($null -eq $Object) { return $Default }
            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property -or $null -eq $property.Value) { return $Default }
            $value = [string]$property.Value
            if ([string]::IsNullOrWhiteSpace($value)) { return $Default }
            return $value
          }
          function ProcessOwner($Process) {
            try {
              $owner = Invoke-CimMethod -InputObject $Process -MethodName GetOwner -ErrorAction Stop
              if ($owner.ReturnValue -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$owner.User)) {
                if ([string]::IsNullOrWhiteSpace([string]$owner.Domain)) { return [string]$owner.User }
                return "$($owner.Domain)\$($owner.User)"
              }
            }
            catch { }
            return 'UNKNOWN'
          }
          function ProcessDetails {
            $inventory = @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)
            $matches = @($inventory | Where-Object {
              $command = [string]$_.CommandLine
              -not [string]::IsNullOrWhiteSpace($command) -and
                $command.IndexOf($state,[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                (($command -match '(?i)run-supervisor\.py') -or ($command -match '(?i)ai_orchestrator.*\bresume\b'))
            })
            $ids = New-Object 'System.Collections.Generic.HashSet[int]'
            $queue = New-Object 'System.Collections.Generic.Queue[int]'
            foreach ($process in $matches) {
              $id = [int]$process.ProcessId
              if ($ids.Add($id)) { $queue.Enqueue($id) }
            }
            while ($queue.Count -gt 0) {
              $id = $queue.Dequeue()
              $current = @($inventory | Where-Object { [int]$_.ProcessId -eq $id } | Select-Object -First 1)
              if ($current.Count -gt 0) {
                $parent = [int]$current[0].ParentProcessId
                if ($parent -gt 0 -and $ids.Add($parent)) { $queue.Enqueue($parent) }
              }
              foreach ($child in @($inventory | Where-Object { [int]$_.ParentProcessId -eq $id })) {
                $childId = [int]$child.ProcessId
                if ($ids.Add($childId)) { $queue.Enqueue($childId) }
              }
            }
            $rows = @()
            foreach ($process in $inventory) {
              $id = [int]$process.ProcessId
              if (-not $ids.Contains($id)) { continue }
              $command = [string]$process.CommandLine
              $kind = 'RELATED'
              if ($command -match '(?i)run-supervisor\.py') { $kind = 'SUPERVISOR' }
              elseif ($command -match '(?i)ai_orchestrator.*\bresume\b') { $kind = 'CODEX_RESUME' }
              $rows += [pscustomobject]@{
                kind=$kind
                pid=[string]$process.ProcessId
                parent=[string]$process.ParentProcessId
                creation=[string]$process.CreationDate
                executable=(Redact ([string]$process.ExecutablePath))
                session=[string]$process.SessionId
                owner=(ProcessOwner $process)
                command=(Redact $command)
              }
            }
            return @($rows | Sort-Object @{Expression={ if ($_.kind -eq 'SUPERVISOR') { 0 } elseif ($_.kind -eq 'CODEX_RESUME') { 1 } else { 2 } }}, pid)
          }
          function SupervisorTopology($Rows) {
            $supervisors = @($Rows | Where-Object kind -eq 'SUPERVISOR')
            if ($supervisors.Count -le 1) { return 'SINGLE_LOGICAL_SUPERVISOR_INTERPRETER_CHAIN' }
            foreach ($candidate in $supervisors) {
              if (@($supervisors | Where-Object { [string]$_.pid -eq [string]$candidate.parent }).Count -gt 0) {
                return 'SINGLE_LOGICAL_SUPERVISOR_INTERPRETER_CHAIN'
              }
            }
            return 'TWO_LOGICAL_SUPERVISORS'
          }
          function ErrorClass([string]$Text) {
            if ([string]::IsNullOrWhiteSpace($Text)) { return 'UNKNOWN' }
            $match = [regex]::Match($Text, '(?m)\b([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception))\b')
            if ($match.Success) { return $match.Groups[1].Value }
            return 'UNKNOWN'
          }
          function Snapshot {
            $supervisor = Json (Join-Path $state 'supervisor-status.json')
            $runtimeStatus = Json (Join-Path $state 'runtime-status.json')
            $runtimeState = Json (Join-Path $state 'runtime-state.json')
            $heartbeat = Json (Join-Path $root 'heartbeat.json')
            $rows = @(ProcessDetails)
            $supervisorProcess = @($rows | Where-Object kind -eq 'SUPERVISOR' | Select-Object -First 1)
            $childProcess = @($rows | Where-Object kind -eq 'CODEX_RESUME' | Select-Object -First 1)
            $lastCommandProperty = $supervisor.PSObject.Properties['last_child_command']
            $lastCommand = if ($null -eq $lastCommandProperty -or $null -eq $lastCommandProperty.Value) { @('UNKNOWN') } else { @($lastCommandProperty.Value) }
            [pscustomobject]@{
              status=(Value $supervisor 'status'); restart_count=(Value $supervisor 'restart_count'); child_pid_state=(Value $supervisor 'child_pid')
              child_pid=if ($childProcess.Count -gt 0) { [string]$childProcess[0].pid } else { 'UNKNOWN' }
              supervisor_pid=if ($supervisorProcess.Count -gt 0) { [string]$supervisorProcess[0].pid } else { 'UNKNOWN' }
              heartbeat_at=(Value $runtimeStatus 'heartbeat_at'); heartbeat_sequence=(Value $heartbeat 'sequence')
              phase=(Value $runtimeState 'phase'); release_task_id=(Value $runtimeState 'release_task_id'); turn_count=(Value $runtimeState 'turn_count'); terminal_state=(Value $runtimeState 'terminal_state')
              last_child_pid=(Value $supervisor 'last_child_pid'); last_child_exit_code=(Value $supervisor 'last_child_exit_code'); last_child_exit_at=(Value $supervisor 'last_child_exit_at'); last_child_start_at=(Value $supervisor 'last_child_start_at'); last_child_command=$lastCommand; last_child_error_tail=(Value $supervisor 'last_child_error_tail')
              supervisor_alive=($supervisorProcess.Count -gt 0); child_alive=($childProcess.Count -gt 0); topology=(SupervisorTopology $rows); rows=$rows; supervisor_json=$supervisor
            }
          }
          function Emit([string]$Label,$Snapshot) {
            Write-Host "${Label}_STATUS=$($Snapshot.status)"
            Write-Host "${Label}_SUPERVISOR_PID=$($Snapshot.supervisor_pid)"
            Write-Host "${Label}_CODEX_CHILD_PID=$($Snapshot.child_pid)"
            Write-Host "${Label}_STATE_CHILD_PID=$($Snapshot.child_pid_state)"
            Write-Host "${Label}_RESTART_COUNT=$($Snapshot.restart_count)"
            Write-Host "${Label}_HEARTBEAT_AT=$($Snapshot.heartbeat_at)"
            Write-Host "${Label}_HEARTBEAT_SEQUENCE=$($Snapshot.heartbeat_sequence)"
            Write-Host "${Label}_RUNTIME_PHASE=$($Snapshot.phase)"
            Write-Host "${Label}_RELEASE_TASK_ID=$($Snapshot.release_task_id)"
            Write-Host "${Label}_TURN_COUNT=$($Snapshot.turn_count)"
            Write-Host "${Label}_TERMINAL_STATE=$($Snapshot.terminal_state)"
            Write-Host "${Label}_SUPERVISOR_TOPOLOGY=$($Snapshot.topology)"
            Write-Host "${Label}_LAST_CHILD_PID=$($Snapshot.last_child_pid)"
            Write-Host "${Label}_LAST_CHILD_EXIT_CODE=$($Snapshot.last_child_exit_code)"
            Write-Host "${Label}_LAST_CHILD_EXIT_AT=$($Snapshot.last_child_exit_at)"
            Write-Host "${Label}_LAST_CHILD_START_AT=$($Snapshot.last_child_start_at)"
            Write-Host "${Label}_LAST_CHILD_COMMAND=$([string]($Snapshot.last_child_command -join ' '))"
            Write-Host "${Label}_LAST_CHILD_ERROR_CLASS=$(ErrorClass (Redact ([string]$Snapshot.last_child_error_tail)))"
            $tail = (Redact ([string]$Snapshot.last_child_error_tail)) -replace "`r?`n", '\\n'
            Write-Host "${Label}_LAST_CHILD_ERROR_TAIL=$tail"
            foreach ($row in @($Snapshot.rows)) { Write-Host "${Label}_PROCESS kind=$($row.kind) PID=$($row.pid) ParentProcessId=$($row.parent) CreationDate=$($row.creation) ExecutablePath=$($row.executable) SessionId=$($row.session) Owner=$($row.owner) CommandLine=$($row.command)" }
          }
          function FailureEvidence([string]$Root,[string]$StateDir,$Snapshot) {
            Write-Host 'RUNTIME_GATE_FAILURE_EVIDENCE_BEGIN'
            $failure = $Snapshot.supervisor_json
            Write-Host "FAILURE_EXCEPTION_TYPE=$(Redact (Value $failure 'exception_type'))"
            Write-Host "FAILURE_LAST_FAILURE=$(Redact (Value $failure 'last_failure'))"
            Write-Host "FAILURE_EXIT_CODE=$(Redact (Value $failure 'exit_code'))"
            Write-Host "FAILURE_NEXT_RETRY_AT=$(Value $failure 'next_retry_at')"
            Write-Host "FAILURE_CHILD_PID=$(Value $failure 'last_child_pid')"
            Write-Host "FAILURE_CHILD_EXIT_CODE=$(Value $failure 'last_child_exit_code')"
            Write-Host "FAILURE_CHILD_EXIT_AT=$(Value $failure 'last_child_exit_at')"
            $failureTail = Redact (Value $failure 'last_child_error_tail')
            Write-Host "FAILURE_CHILD_ERROR_CLASS=$(ErrorClass $failureTail)"
            Write-Host "FAILURE_CHILD_ERROR_TAIL=$($failureTail -replace "`r?`n", '\\n')"
            $logs = @(Get-ChildItem -LiteralPath $StateDir -Recurse -File -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(supervisor|codex|stdout|stderr|exception|runtime)' -and $_.Extension -in @('.log','.txt','.jsonl','.stderr','.stdout','.exception') } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 8)
            foreach ($log in $logs) {
              Write-Host "FAILURE_LOG_PATH=$($log.FullName)"
              foreach ($line in @(Get-Content -LiteralPath $log.FullName -Tail 200 -ErrorAction SilentlyContinue)) { Write-Host (Redact ([string]$line)) }
            }
            Write-Host 'RUNTIME_GATE_FAILURE_EVIDENCE_END'
          }

          $identity = (whoami).Trim(); $machine = (hostname).Trim()
          Write-Host "RUNNER_IDENTITY=$identity"; Write-Host "RUNNER_MACHINE=$machine"
          if ($identity -ine 'CYCHAN\xinzhaowrt-runner' -or $machine -ine 'CYCHAN') { throw "RUNTIME_GATE_IDENTITY_MISMATCH identity=$identity machine=$machine" }
          foreach ($path in @($root,$state,$control,$python,$probe)) { if (-not (Test-Path -LiteralPath $path)) { throw "RUNTIME_GATE_PATH_MISSING=$path" } }
          Write-Host "RUNTIME_GATE_PATHS=PASS control=$control state=$state python=$python"
          $lockPath = Join-Path $state 'supervisor.lock'
          $lockOwner = if (Test-Path -LiteralPath $lockPath -PathType Leaf) { (Get-Content -Raw -LiteralPath $lockPath).Trim() } else { 'UNKNOWN' }
          Write-Host "LOCK_OWNER_PID=$lockOwner"

          $t0 = Snapshot; Emit 'T0' $t0
          Push-Location $control
          try { $probeOutput = (& $python $probe 2>&1 | Out-String).Trim(); $probeExit = $LASTEXITCODE }
          finally { Pop-Location }
          try { $probeData = $probeOutput | ConvertFrom-Json } catch { throw "RUNTIME_GATE_PROBE_OUTPUT_INVALID exit=$probeExit" }
          $probeExitClass=[string]$probeData.exit_class; $configured=[string]$probeData.configured_model; $effective=[string]$probeData.effective_model
          $catalogSkipped=([string]$probeData.model_catalog_skipped).ToLowerInvariant(); $account=([string]$probeData.account_preflight_ok).ToLowerInvariant(); $module=[string]$probeData.ai_orchestrator_file
          Write-Host "exit_class=$probeExitClass"; Write-Host "configured_model=$configured"; Write-Host "effective_model=$effective"; Write-Host "model_catalog_skipped=$catalogSkipped"; Write-Host "account_preflight_ok=$account"; Write-Host "ai_orchestrator_file=$module"
          if ($probeExit -ne 0 -or $probeExitClass -ne 'PROBE_OK' -or $configured -ne 'gpt-5.6-terra' -or $effective -ne 'gpt-5.6-terra' -or $catalogSkipped -ne 'true' -or $account -ne 'true' -or -not $module.StartsWith($control,[System.StringComparison]::OrdinalIgnoreCase)) { throw "RUNTIME_GATE_PROBE_FAILED exit=$probeExit exit_class=$probeExitClass configured=$configured effective=$effective catalog=$catalogSkipped account=$account module=$module" }

          Start-Sleep -Seconds 130
          $t1 = Snapshot; Emit 'T1' $t1
          $r0=0L; $r1=0L; $s0=0L; $s1=0L
          $restartKnown=[long]::TryParse([string]$t0.restart_count,[ref]$r0) -and [long]::TryParse([string]$t1.restart_count,[ref]$r1)
          $sequenceKnown=[long]::TryParse([string]$t0.heartbeat_sequence,[ref]$s0) -and [long]::TryParse([string]$t1.heartbeat_sequence,[ref]$s1)
          $restartDelta=if ($restartKnown) { $r1-$r0 } else { 'UNKNOWN' }; $heartbeatAdvances=if ($sequenceKnown) { $s1-$s0 } else { 'UNKNOWN' }
          Write-Host "RESTART_COUNT_DELTA=$restartDelta"; Write-Host "HEARTBEAT_ADVANCES=$heartbeatAdvances"
          if (-not ($t0.supervisor_alive -and $t1.supervisor_alive -and $t0.child_alive -and $t1.child_alive -and $t0.child_pid -eq $t1.child_pid -and $restartKnown -and $restartDelta -eq 0 -and $sequenceKnown -and $heartbeatAdvances -ge 2 -and $t1.status -notin @('BACKOFF','CRASH_LOOP_BLOCKED'))) {
            FailureEvidence $root $state $t1
            throw "RUNTIME_GATE_FAILED status=$($t1.status) child_t0=$($t0.child_pid) child_t1=$($t1.child_pid) restart_delta=$restartDelta heartbeat_advances=$heartbeatAdvances"
          }
          Write-Host 'RUNTIME_GATE=PASS'

  supervisor-handoff:
    if: ${{ inputs.supervisor_handoff == true }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      HEADLESS_CODEX_MODEL: gpt-5.6-terra
    steps:
      - name: Controlled Supervisor handoff and child-exit observation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $root = 'C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\ControlPlane'
          $state = Join-Path $root 'state'
          $control = Join-Path $root 'control-runtime'
          $workspace = Join-Path $root 'workspace'
          $python = 'C:\Users\xinzhaowrt-runner\AppData\Local\XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe'
          $runSupervisor = Join-Path $control 'scripts\run-supervisor.py'
          $runtimeStatePath = Join-Path $state 'runtime-state.json'
          $supervisorStatePath = Join-Path $state 'supervisor-state.json'
          $supervisorStatusPath = Join-Path $state 'supervisor-status.json'
          $heartbeatPath = Join-Path $root 'heartbeat.json'
          $lockPath = Join-Path $state 'supervisor.lock'

          function Redact([string]$Text) {
            if ($null -eq $Text) { return '' }
            $value = [regex]::Replace($Text, '(?i)(authorization|token|cookie|secret|api[_-]?key|password)(\s*[:=]\s*)[^\s,;]+', '$1$2<REDACTED>')
            return [regex]::Replace($value, '(?i)(Bearer\s+)[^\s]+', '$1<REDACTED>')
          }
          function Read-Json([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { throw "MISSING_JSON=$Path" }
            return Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json
          }
          function Get-PropertyValue($Object,[string]$Name) {
            if ($null -eq $Object) { return $null }
            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property) { return $null }
            return $property.Value
          }
          function Get-ProcessOwner($Process) {
            try {
              $owner = Invoke-CimMethod -InputObject $Process -MethodName GetOwner -ErrorAction Stop
              if ($owner.ReturnValue -eq 0 -and -not [string]::IsNullOrWhiteSpace([string]$owner.User)) {
                if ([string]::IsNullOrWhiteSpace([string]$owner.Domain)) { return [string]$owner.User }
                return "$($owner.Domain)\$($owner.User)"
              }
            }
            catch { }
            return 'UNKNOWN'
          }
          function Get-Inventory {
            return @(Get-CimInstance Win32_Process -ErrorAction Stop)
          }
          function Get-RunSupervisorRows($Inventory) {
            return @($Inventory | Where-Object {
              $command = [string]$_.CommandLine
              -not [string]::IsNullOrWhiteSpace($command) -and
                $command -match '(?i)run-supervisor\.py' -and
                $command.IndexOf($state,[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                $command.IndexOf($control,[System.StringComparison]::OrdinalIgnoreCase) -ge 0
            })
          }
          function Get-ResumeRows($Inventory) {
            return @($Inventory | Where-Object {
              $command = [string]$_.CommandLine
              -not [string]::IsNullOrWhiteSpace($command) -and
                $command -match '(?i)ai_orchestrator.*\bresume\b' -and
                $command.IndexOf($state,[System.StringComparison]::OrdinalIgnoreCase) -ge 0
            })
          }
          function Emit-Process([string]$Label,$Process) {
            if ($null -eq $Process) {
              Write-Host "${Label}=MISSING"
              return
            }
            Write-Host "${Label}_PID=$($Process.ProcessId)"
            Write-Host "${Label}_PARENT_PID=$($Process.ParentProcessId)"
            Write-Host "${Label}_CREATION_DATE=$($Process.CreationDate)"
            Write-Host "${Label}_EXECUTABLE_PATH=$(Redact ([string]$Process.ExecutablePath))"
            Write-Host "${Label}_COMMAND_LINE=$(Redact ([string]$Process.CommandLine))"
            Write-Host "${Label}_SESSION_ID=$($Process.SessionId)"
            Write-Host "${Label}_OWNER=$(Get-ProcessOwner $Process)"
          }
          function Get-ErrorClass([string]$Text) {
            if ([string]::IsNullOrWhiteSpace($Text)) { return 'UNKNOWN' }
            $match = [regex]::Match($Text, '(?m)\b([A-Za-z_][A-Za-z0-9_]*(?:Error|Exception))\b')
            if ($match.Success) { return $match.Groups[1].Value }
            return 'EXIT_CODE_ONLY'
          }
          function Get-HeartbeatSequence {
            if (-not (Test-Path -LiteralPath $heartbeatPath -PathType Leaf)) { return $null }
            try { return Get-PropertyValue (Read-Json $heartbeatPath) 'sequence' } catch { return $null }
          }
          function Get-Snapshot {
            $inventory = Get-Inventory
            $supervisors = @(Get-RunSupervisorRows $inventory)
            $children = @(Get-ResumeRows $inventory)
            $status = Read-Json $supervisorStatusPath
            $supervisorState = Read-Json $supervisorStatePath
            [pscustomobject]@{
              inventory=$inventory
              supervisors=$supervisors
              children=$children
              status=$status
              supervisor_state=$supervisorState
              status_name=[string](Get-PropertyValue $status 'status')
              supervisor_pid=[string](Get-PropertyValue $status 'supervisor_pid')
              child_pid=[string](Get-PropertyValue $status 'child_pid')
              last_child_pid=[string](Get-PropertyValue $status 'last_child_pid')
              last_child_exit_code=[string](Get-PropertyValue $status 'last_child_exit_code')
              last_child_exit_at=[string](Get-PropertyValue $status 'last_child_exit_at')
              last_child_error_tail=[string](Get-PropertyValue $status 'last_child_error_tail')
              restart_count=[string](Get-PropertyValue $status 'restart_count')
              heartbeat_sequence=[string](Get-HeartbeatSequence)
            }
          }
          function Emit-ChildEvidence($Snapshot) {
            $tail = Redact ([string]$Snapshot.last_child_error_tail)
            $tailOneLine = $tail -replace "`r?`n", '\\n'
            $exitCode = [string]$Snapshot.last_child_exit_code
            $errorClass = Get-ErrorClass $tail
            Write-Host "CHILD_PID=$($Snapshot.last_child_pid)"
            Write-Host "CHILD_EXIT_CODE=$exitCode"
            Write-Host "CHILD_ERROR_CLASS=$errorClass"
            Write-Host "CHILD_ERROR_TAIL=$tailOneLine"
            Write-Host "ROOT_CAUSE=$errorClass"
          }
          function Assert-Empty([string]$Label,[string]$Value) {
            if (-not [string]::IsNullOrWhiteSpace($Value)) { throw "$Label=$Value" }
          }

          if ((whoami).Trim() -ine 'CYCHAN\xinzhaowrt-runner' -or (hostname).Trim() -ine 'CYCHAN') {
            throw "RUNNER_IDENTITY_MISMATCH identity=$((whoami).Trim()) machine=$((hostname).Trim())"
          }
          Write-Host "RUNNER_IDENTITY=$((whoami).Trim())"
          Write-Host "RUNNER_MACHINE=$((hostname).Trim())"
          foreach ($path in @($root,$state,$control,$workspace,$python,$runSupervisor,$runtimeStatePath,$supervisorStatePath,$supervisorStatusPath)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "HANDOFF_PATH_MISSING=$path" }
          }

          $beforeHead = (& git -C $control rev-parse HEAD).Trim()
          $beforeBranch = (& git -C $control branch --show-current).Trim()
          $beforeDirty = (& git -C $control status --porcelain | Out-String).Trim()
          Write-Host "CONTROL_RUNTIME_HEAD_BEFORE=$beforeHead"
          Write-Host "CONTROL_RUNTIME_BRANCH_BEFORE=$beforeBranch"
          if ($beforeDirty) { throw "CONTROL_RUNTIME_DIRTY=$beforeDirty" }
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'CONTROL_RUNTIME_AUTH_SETUP_FAILED' }
          git -C $control fetch --prune origin main
          if ($LASTEXITCODE -ne 0) { throw 'CONTROL_RUNTIME_FETCH_FAILED' }
          if ($beforeBranch -ne 'main') {
            git -C $control switch main
            if ($LASTEXITCODE -ne 0) { throw 'CONTROL_RUNTIME_SWITCH_MAIN_FAILED' }
          }
          git -C $control merge --ff-only origin/main
          if ($LASTEXITCODE -ne 0) { throw 'CONTROL_RUNTIME_FAST_FORWARD_FAILED' }
          $controlHead = (& git -C $control rev-parse HEAD).Trim()
          $controlOriginHead = (& git -C $control rev-parse origin/main).Trim()
          if ($controlHead -ne $controlOriginHead) { throw "CONTROL_RUNTIME_NOT_CURRENT head=$controlHead origin_main=$controlOriginHead" }
          $observationCommit = (& git -C $control log -1 --format='%H|%cI' -S 'last_child_exit_code' -- ai_orchestrator/supervisor.py).Trim()
          if ($observationCommit -notmatch '^[0-9a-f]{40}\|') { throw 'CHILD_EXIT_OBSERVATION_COMMIT_NOT_FOUND' }
          $observationSha,$observationTime = $observationCommit -split '\|',2
          Write-Host "CONTROL_RUNTIME_HEAD=$controlHead"
          Write-Host "CHILD_EXIT_OBSERVATION_COMMIT=$observationSha"
          Write-Host "CHILD_EXIT_OBSERVATION_COMMIT_TIME=$observationTime"
          if (-not (Select-String -LiteralPath (Join-Path $control 'ai_orchestrator\supervisor.py') -Pattern 'last_child_exit_code' -Quiet)) { throw 'CHILD_EXIT_OBSERVATION_CODE_MISSING' }

          $lockOwnerText = (Get-Content -Raw -LiteralPath $lockPath).Trim()
          if ($lockOwnerText -notmatch '^\d+$') { throw "LOCK_OWNER_INVALID=$lockOwnerText" }
          $lockOwnerPid = [int]$lockOwnerText
          Write-Host "LOCK_OWNER_PID=$lockOwnerPid"
          $inventory = Get-Inventory
          $ownerProcess = @($inventory | Where-Object { [int]$_.ProcessId -eq $lockOwnerPid } | Select-Object -First 1)
          $parentPid = 0
          $chainNeedsStop = $false
          if ($ownerProcess.Count -eq 1) {
            $chainNeedsStop = $true
            $ownerProcess = $ownerProcess[0]
            Emit-Process 'OLD_LOCK_OWNER' $ownerProcess
            if ([string]$ownerProcess.CommandLine -notmatch '(?i)run-supervisor\.py' -or [string]$ownerProcess.CommandLine -notmatch [regex]::Escape($state)) { throw 'LOCK_OWNER_NOT_CANONICAL_SUPERVISOR' }
            $parentPid = [int]$ownerProcess.ParentProcessId
            $parentProcess = @($inventory | Where-Object { [int]$_.ProcessId -eq $parentPid } | Select-Object -First 1)
            if ($parentProcess.Count -ne 1) { throw "SUPERVISOR_CHAIN_PARENT_MISSING=$parentPid" }
            $parentProcess = $parentProcess[0]
            Emit-Process 'OLD_SUPERVISOR_PARENT' $parentProcess
            if ([string]$parentProcess.CommandLine -notmatch '(?i)run-supervisor\.py' -or [string]$parentProcess.CommandLine -notmatch [regex]::Escape($state)) { throw 'SUPERVISOR_CHAIN_PARENT_NOT_CANONICAL' }
            if ([int]$parentProcess.ParentProcessId -eq $lockOwnerPid) { throw 'SUPERVISOR_CHAIN_DIRECTION_INVALID' }
            $outerParent = @($inventory | Where-Object { [int]$_.ProcessId -eq [int]$parentProcess.ParentProcessId } | Select-Object -First 1)
            if ($outerParent.Count -eq 1) { Emit-Process 'SUPERVISOR_CHAIN_OUTER_PARENT' $outerParent[0] }
            $otherSupervisors = @(Get-RunSupervisorRows $inventory | Where-Object { [int]$_.ProcessId -notin @($lockOwnerPid,$parentPid) })
            if ($otherSupervisors.Count -gt 0) { throw "UNEXPECTED_CANONICAL_SUPERVISORS=$($otherSupervisors.ProcessId -join ',')" }
            Write-Host 'SUPERVISOR_CHAIN=VENv_LAUNCHER_TO_BASE_PYTHON'
          }
          else {
            $remainingSupervisors = @(Get-RunSupervisorRows $inventory)
            if ($remainingSupervisors.Count -gt 0) { throw "LOCK_OWNER_PROCESS_MISSING_BUT_SUPERVISOR_REMAINS=$($remainingSupervisors.ProcessId -join ',')" }
            Write-Host 'OLD_LOCK_OWNER=MISSING_ALREADY_STOPPED'
            Write-Host 'SUPERVISOR_CHAIN=ALREADY_STOPPED_AFTER_PRIOR_CONTROLLED_HANDOFF'
          }
          Write-Host 'OLD_SUPERVISOR_PRECEDES_OBSERVATION=PASS'

          $runtimeState = Read-Json $runtimeStatePath
          $phase = [string](Get-PropertyValue $runtimeState 'phase')
          $candidate = [string](Get-PropertyValue $runtimeState 'candidate_sha256')
          if ($phase -ne 'BUILD') { throw "SAFETY_BLOCK_RUNTIME_PHASE=$phase" }
          Assert-Empty 'SAFETY_BLOCK_CANDIDATE_SHA256' $candidate
          foreach ($gateName in @('human_gate','pending_human_gate','humanGate','pendingHumanGate')) {
            Assert-Empty "SAFETY_BLOCK_$($gateName.ToUpperInvariant())" ([string](Get-PropertyValue $runtimeState $gateName))
          }
          $activeFlashNames = @('active_flash','flash_in_progress','flash_active','flash_pid','flash_status','flash_task_id','active_flash_task_id')
          foreach ($flashName in $activeFlashNames) {
            $flashValue = Get-PropertyValue $runtimeState $flashName
            if ($null -eq $flashValue) { continue }
            $flashText = ([string]$flashValue).Trim()
            if ($flashValue -is [bool] -and [bool]$flashValue) { throw "SAFETY_BLOCK_ACTIVE_FLASH=$flashName" }
            if ($flashText -and $flashText.ToLowerInvariant() -notin @('false','0','none','null','inactive','not_started','completed')) { throw "SAFETY_BLOCK_ACTIVE_FLASH=$flashName" }
          }
          $runtimeReleaseTask = [string](Get-PropertyValue $runtimeState 'release_task_id')
          $runtimePhase = $phase
          Write-Host "SAFETY_RUNTIME_STATE=PASS phase=$runtimePhase release_task_id=$runtimeReleaseTask candidate_sha256=EMPTY active_flash=NONE pending_human_gate=NONE"

          $supervisorStateBefore = Read-Json $supervisorStatePath
          $restartBeforeText = [string](Get-PropertyValue $supervisorStateBefore 'restart_count')
          $childPidBefore = [string](Get-PropertyValue $supervisorStateBefore 'child_pid')
          $resumeRows = @(Get-ResumeRows $inventory)
          if ($resumeRows.Count -gt 0) { throw "SAFETY_BLOCK_LIVE_CODEX_CHILD=$($resumeRows.ProcessId -join ',')" }
          if ($childPidBefore -match '^\d+$' -and @($inventory | Where-Object { [int]$_.ProcessId -eq [int]$childPidBefore }).Count -gt 0) { throw "SAFETY_BLOCK_STATE_CHILD_ALIVE=$childPidBefore" }
          Write-Host "SAFETY_CODEX_CHILD=DEAD state_child_pid=$childPidBefore live_resume_children=0"

          if ($chainNeedsStop) {
            Stop-Process -Id $lockOwnerPid -Force -ErrorAction Stop
            $parentStillRunning = @(Get-CimInstance Win32_Process -Filter "ProcessId=$parentPid" -ErrorAction SilentlyContinue)
            if ($parentStillRunning.Count -gt 0) { Stop-Process -Id $parentPid -Force -ErrorAction SilentlyContinue }
          }
          $stopDeadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 500
            $remaining = @(Get-Inventory | Where-Object { [int]$_.ProcessId -in @($lockOwnerPid,$parentPid) })
          } while ($remaining.Count -gt 0 -and (Get-Date) -lt $stopDeadline)
          if ($remaining.Count -gt 0) { throw "OLD_SUPERVISOR_CHAIN_DID_NOT_EXIT=$($remaining.ProcessId -join ',')" }
          $postStopInventory = Get-Inventory
          $postStopOther = @(Get-RunSupervisorRows $postStopInventory)
          if ($postStopOther.Count -gt 0) { throw "CANONICAL_SUPERVISOR_REMAINS=$($postStopOther.ProcessId -join ',')" }
          if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) { throw 'SUPERVISOR_LOCK_DISAPPEARED_UNEXPECTEDLY' }
          $staleLockText = (Get-Content -Raw -LiteralPath $lockPath).Trim()
          if ($staleLockText -ne [string]$lockOwnerPid) { throw "STALE_LOCK_OWNER_CHANGED=$staleLockText expected=$lockOwnerPid" }
          if (@(Get-Inventory | Where-Object { [int]$_.ProcessId -eq $lockOwnerPid }).Count -gt 0) { throw 'STALE_LOCK_OWNER_STILL_ALIVE' }
          Remove-Item -LiteralPath $lockPath -Force -ErrorAction Stop
          Write-Host "STALE_SUPERVISOR_LOCK_REMOVED=PASS owner_pid=$lockOwnerPid"

          $hadTracking = Test-Path -LiteralPath 'Env:RUNNER_TRACKING_ID'
          $oldTracking = [Environment]::GetEnvironmentVariable('RUNNER_TRACKING_ID','Process')
          try {
            $env:RUNNER_TRACKING_ID = ''
            $env:HEADLESS_CODEX_MODEL = 'gpt-5.6-terra'
            $env:ARTHUR_CONTROL_PLANE_CODE_ROOT = $control
            $env:ARTHUR_CONTROL_PLANE_STATE_DIR = $state
            $env:PYTHONDONTWRITEBYTECODE = '1'
            $launcher = Start-Process -FilePath $python -ArgumentList @($runSupervisor,'--state-dir',$state,'--interval','30') -WorkingDirectory $workspace -WindowStyle Hidden -PassThru -ErrorAction Stop
          }
          finally {
            if ($hadTracking) { $env:RUNNER_TRACKING_ID = $oldTracking } else { Remove-Item -LiteralPath 'Env:RUNNER_TRACKING_ID' -ErrorAction SilentlyContinue }
          }
          $newDeadline = (Get-Date).AddSeconds(30)
          $newLockPid = $null
          $newSupervisorRows = @()
          while ((Get-Date) -lt $newDeadline) {
            Start-Sleep -Seconds 1
            if (-not (Test-Path -LiteralPath $lockPath -PathType Leaf)) { continue }
            $candidateLock = (Get-Content -Raw -LiteralPath $lockPath).Trim()
            if ($candidateLock -notmatch '^\d+$') { continue }
            $candidatePid = [int]$candidateLock
            $newInventory = Get-Inventory
            $candidateRow = @($newInventory | Where-Object { [int]$_.ProcessId -eq $candidatePid } | Select-Object -First 1)
            if ($candidateRow.Count -eq 1 -and [string]$candidateRow[0].CommandLine -match '(?i)run-supervisor\.py' -and [string]$candidateRow[0].CommandLine -match [regex]::Escape($state)) {
              $newLockPid = $candidatePid
              $newSupervisorRows = @(Get-RunSupervisorRows $newInventory)
              break
            }
          }
          if ($null -eq $newLockPid) { throw "NEW_SUPERVISOR_NOT_RUNNING launcher_pid=$($launcher.Id)" }
          if ($newSupervisorRows.Count -ne 2) { throw "NEW_SUPERVISOR_CHAIN_UNEXPECTED_COUNT=$($newSupervisorRows.Count)" }
          Write-Host "NEW_SUPERVISOR_PID=$newLockPid"
          Write-Host "SUPERVISOR_CODE_HEAD=$controlHead"
          Write-Host "SUPERVISOR_LOCK_OWNER_PID=$newLockPid"
          Write-Host 'DETACHED_SUPERVISOR=PASS'

          $handoffState = Read-Json $runtimeStatePath
          if ([string](Get-PropertyValue $handoffState 'phase') -ne $runtimePhase -or [string](Get-PropertyValue $handoffState 'release_task_id') -ne $runtimeReleaseTask -or [string](Get-PropertyValue $handoffState 'candidate_sha256')) { throw 'RUNTIME_STATE_IDENTITY_CHANGED_DURING_HANDOFF' }
          $restartAfterText = [string](Get-PropertyValue (Read-Json $supervisorStatePath) 'restart_count')
          if ($restartBeforeText -match '^\d+$' -and $restartAfterText -match '^\d+$' -and [int64]$restartAfterText -lt [int64]$restartBeforeText) { throw "RESTART_COUNT_WAS_RESET before=$restartBeforeText after=$restartAfterText" }
          Write-Host "RESTART_COUNT_PRESERVED before=$restartBeforeText after=$restartAfterText"

          $stableStart = $null
          $stablePid = $null
          $stableRestart = $null
          $stableHeartbeat = $null
          $observeDeadline = (Get-Date).AddSeconds(420)
          while ((Get-Date) -lt $observeDeadline) {
            Start-Sleep -Seconds 10
            $snapshot = Get-Snapshot
            $exitCodeNumber = 0
            $lastPidNumber = 0
            $hasExit = [int]::TryParse([string]$snapshot.last_child_exit_code,[ref]$exitCodeNumber) -and [int]::TryParse([string]$snapshot.last_child_pid,[ref]$lastPidNumber)
            if ($hasExit) {
              Emit-ChildEvidence $snapshot
              exit 0
            }
            if ($snapshot.status_name -eq 'CRASH_LOOP_BLOCKED') {
              Write-Host "CHILD_PID=$($snapshot.last_child_pid)"
              Write-Host 'CHILD_EXIT_CODE=UNKNOWN'
              Write-Host 'CHILD_ERROR_CLASS=UNKNOWN'
              Write-Host 'CHILD_ERROR_TAIL=UNKNOWN'
              Write-Host 'ROOT_CAUSE=CRASH_LOOP_BLOCKED_WITHOUT_NEW_CHILD_EXIT_OBSERVATION'
              throw 'BLOCKED_EVIDENCE_INCOMPLETE'
            }
            $liveChildren = @($snapshot.children)
            if ($liveChildren.Count -eq 1) {
              $currentPid = [string]$liveChildren[0].ProcessId
              $currentRestart = [string]$snapshot.restart_count
              $currentHeartbeat = [string]$snapshot.heartbeat_sequence
              if ($null -eq $stableStart -or $stablePid -ne $currentPid) {
                $stableStart = Get-Date
                $stablePid = $currentPid
                $stableRestart = $currentRestart
                $stableHeartbeat = $currentHeartbeat
                Write-Host "CHILD_OBSERVATION_T0 pid=$stablePid restart_count=$stableRestart heartbeat_sequence=$stableHeartbeat"
              }
              elseif (((Get-Date) - $stableStart).TotalSeconds -ge 130) {
                $restartDelta = ([int64]$currentRestart - [int64]$stableRestart)
                $heartbeatDelta = ([int64]$currentHeartbeat - [int64]$stableHeartbeat)
                Write-Host "CHILD_OBSERVATION_T1 pid=$currentPid restart_count=$currentRestart heartbeat_sequence=$currentHeartbeat"
                Write-Host "RESTART_COUNT_DELTA=$restartDelta"
                Write-Host "HEARTBEAT_ADVANCES=$heartbeatDelta"
                if ($currentPid -eq $stablePid -and $restartDelta -eq 0 -and $heartbeatDelta -ge 2 -and $snapshot.status_name -notin @('BACKOFF','CRASH_LOOP_BLOCKED') -and @($snapshot.supervisors | Where-Object { [int]$_.ProcessId -eq $newLockPid }).Count -gt 0) {
                  Write-Host "CHILD_PID=$currentPid"
                  Write-Host 'CHILD_EXIT_CODE=NOT_EXITED'
                  Write-Host 'CHILD_ERROR_CLASS=NONE'
                  Write-Host 'CHILD_ERROR_TAIL=NONE'
                  Write-Host 'ROOT_CAUSE=NONE_HEALTHY_130S'
                  Write-Host 'CODEX_RUNTIME_RECOVERED=PASS'
                  exit 0
                }
              }
            }
            else {
              $stableStart = $null
              $stablePid = $null
            }
          }
          Write-Host 'CHILD_PID=UNKNOWN'
          Write-Host 'CHILD_EXIT_CODE=UNKNOWN'
          Write-Host 'CHILD_ERROR_CLASS=UNKNOWN'
          Write-Host 'CHILD_ERROR_TAIL=UNKNOWN'
          Write-Host 'ROOT_CAUSE=NO_CHILD_EXIT_OBSERVED_WITHIN_CONTROLLED_WINDOW'
          throw 'BLOCKED_EVIDENCE_INCOMPLETE'

  wakeup:
    if: ${{ inputs.runtime_gate != true && inputs.supervisor_handoff != true }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
      ARTHUR_WINDOWS_REPAIR_MODE: DiagnosticOnly

    steps:
      - name: Sync persistent task workspace and clean Control Plane code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          $workspace = Join-Path $root 'workspace'
          $controlRoot = Join-Path $root 'control-runtime'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to configure Git authentication for the runner Control Plane.' }

          # Mutable task workspace: preserve Headless Codex changes exactly as they are.
          if (-not (Test-Path (Join-Path $workspace '.git'))) {
            git clone --branch main --single-branch "https://github.com/$env:GITHUB_REPOSITORY.git" $workspace
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create persistent Control Plane task workspace.' }
            Write-Host 'CONTROL_PLANE_WORKSPACE_BOOTSTRAPPED=PASS'
          }
          else {
            git -C $workspace remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to normalize persistent task workspace origin.' }
            git -C $workspace fetch --prune origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main into persistent task workspace.' }

            $dirty = (& git -C $workspace status --porcelain | Out-String).Trim()
            if ($dirty) {
              Write-Host 'CONTROL_PLANE_WORKSPACE_DIRTY=PRESERVED'
            }
            else {
              $head = (& git -C $workspace rev-parse HEAD).Trim()
              $originMain = (& git -C $workspace rev-parse origin/main).Trim()
              $branch = (& git -C $workspace branch --show-current).Trim()
              if ($head -eq $originMain) {
                Write-Host "CONTROL_PLANE_WORKSPACE_SYNCED=PASS branch=$branch sha=$head"
              }
              else {
                git -C $workspace merge-base --is-ancestor $head $originMain 2>$null
                $behind = ($LASTEXITCODE -eq 0)
                git -C $workspace merge-base --is-ancestor $originMain $head 2>$null
                $ahead = ($LASTEXITCODE -eq 0)

                if ($behind -and $branch -eq 'main') {
                  git -C $workspace merge --ff-only origin/main
                  if ($LASTEXITCODE -ne 0) { throw 'Persistent task workspace could not fast-forward safely.' }
                  Write-Host 'CONTROL_PLANE_WORKSPACE_FAST_FORWARD=PASS'
                }
                elseif ($ahead) {
                  Write-Host "CONTROL_PLANE_WORKSPACE_AHEAD=PRESERVED branch=$branch sha=$head"
                }
                else {
                  Write-Host "CONTROL_PLANE_WORKSPACE_DIVERGED=PRESERVED branch=$branch sha=$head origin_main=$originMain"
                }
              }
            }
          }

          $sourceSha = (& git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'Persistent task workspace HEAD is invalid.' }
          $sourceBranch = (& git -C $workspace branch --show-current).Trim()
          if (-not $sourceBranch) { $sourceBranch = 'DETACHED' }

          # Clean control-code checkout: never let a dirty task workspace pin watchdog/runtime fixes to an old SHA.
          if (-not (Test-Path (Join-Path $controlRoot '.git'))) {
            git clone --branch main --single-branch "https://github.com/$env:GITHUB_REPOSITORY.git" $controlRoot
            if ($LASTEXITCODE -ne 0) { throw 'Unable to create clean Control Plane code checkout.' }
            Write-Host 'CONTROL_PLANE_CODE_BOOTSTRAPPED=PASS'
          }
          else {
            git -C $controlRoot remote set-url origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to normalize clean Control Plane code origin.' }

            # Python imports may leave deterministic bytecode artifacts in this disposable clean mirror.
            # Remove only those generated caches; any other change remains a hard fail with evidence.
            Get-ChildItem -LiteralPath $controlRoot -Recurse -Directory -Filter '__pycache__' -Force -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -LiteralPath $controlRoot -Recurse -File -Filter '*.pyc' -Force -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue

            $controlDirty = (& git -C $controlRoot status --porcelain | Out-String).Trim()
            if ($controlDirty) {
              Write-Host 'CONTROL_PLANE_CODE_DIRTY_FILES_BEGIN'
              Write-Host $controlDirty
              Write-Host 'CONTROL_PLANE_CODE_DIRTY_FILES_END'
              throw 'CONTROL_PLANE_CODE_DIRTY: clean control-runtime contains unexpected non-cache changes.'
            }
            git -C $controlRoot fetch --prune origin main
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/main into clean Control Plane code checkout.' }
            $controlBranch = (& git -C $controlRoot branch --show-current).Trim()
            if ($controlBranch -ne 'main') {
              git -C $controlRoot switch main
              if ($LASTEXITCODE -ne 0) { throw 'Unable to switch clean Control Plane code checkout to main.' }
            }
            git -C $controlRoot merge --ff-only origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Clean Control Plane code checkout could not fast-forward to origin/main.' }
          }

          $controlSha = (& git -C $controlRoot rev-parse HEAD).Trim()
          $controlOriginMain = (& git -C $controlRoot rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or $controlSha -notmatch '^[0-9a-f]{40}$' -or $controlSha -ne $controlOriginMain) {
            throw "CONTROL_PLANE_CODE_STALE: head=$controlSha origin_main=$controlOriginMain"
          }

          "ARTHUR_CONTROL_PLANE_WORKSPACE=$workspace" >> $env:GITHUB_ENV
          "CONTROL_PLANE_WORKSPACE=$workspace" >> $env:GITHUB_ENV
          "ARTHUR_CONTROL_PLANE_CODE_ROOT=$controlRoot" >> $env:GITHUB_ENV
          "CONTROL_PLANE_CODE_SHA=$controlSha" >> $env:GITHUB_ENV
          "CONTROL_PLANE_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "CONTROL_PLANE_SOURCE_BRANCH=$sourceBranch" >> $env:GITHUB_ENV
          Write-Host "CONTROL_PLANE_WORKSPACE=PASS path=$workspace branch=$sourceBranch sha=$sourceSha"
          Write-Host "CONTROL_PLANE_CODE=PASS path=$controlRoot sha=$controlSha"

      - name: Ensure persistent headless Python and Codex runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonHome = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython'
          $managedPython = Join-Path $pythonHome 'python'
          $uvCache = Join-Path $pythonHome 'cache'
          $venv = Join-Path $pythonHome '.venv'
          $pythonExe = Join-Path $venv 'Scripts\python.exe'
          $requirements = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'requirements-headless.txt'
          New-Item -ItemType Directory -Force -Path $pythonHome | Out-Null
          if (-not (Test-Path $requirements)) { throw "Headless requirements missing from clean Control Plane code: $requirements" }

          $reuse = $false
          if (Test-Path $pythonExe) {
            & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $reuse = $true
              Write-Host "HEADLESS_RUNTIME=REUSE interpreter=$pythonExe"
            }
          }

          if (-not $reuse) {
            $tools = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\Tools'
            $uvExe = Join-Path $tools 'uv.exe'
            New-Item -ItemType Directory -Force -Path $tools | Out-Null

            if (-not (Test-Path $uvExe)) {
              $cachedUv = Get-ChildItem 'C:\actions-runner\_work\_tool\uv' -Recurse -Filter uv.exe -File -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending | Select-Object -First 1
              if ($cachedUv) { Copy-Item -Force $cachedUv.FullName $uvExe }
            }

            if (-not (Test-Path $uvExe)) {
              $zip = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9.zip'
              $extract = Join-Path $env:TEMP 'xinzhaowrt-uv-0.12.9'
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
              Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/astral-sh/uv/releases/download/0.12.9/uv-x86_64-pc-windows-msvc.zip' -OutFile $zip
              Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
              $downloadedUv = Get-ChildItem $extract -Recurse -Filter uv.exe -File | Select-Object -First 1
              if (-not $downloadedUv) { throw 'Pinned uv bootstrap archive did not contain uv.exe.' }
              Copy-Item -Force $downloadedUv.FullName $uvExe
            }

            $env:UV_PYTHON_INSTALL_DIR = $managedPython
            $env:UV_CACHE_DIR = $uvCache
            & $uvExe python install 3.12
            if ($LASTEXITCODE -ne 0) { throw 'uv managed Python 3.12 install failed.' }
            & $uvExe venv $venv --python 3.12 --clear
            if ($LASTEXITCODE -ne 0) { throw 'uv persistent venv creation failed.' }
            & $uvExe pip install --python $pythonExe -r $requirements
            if ($LASTEXITCODE -ne 0) { throw 'Headless Codex dependency installation failed.' }
          }

          & $pythonExe -c "import sys; import openai_codex; raise SystemExit(0 if sys.version_info >= (3,10) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'Persistent headless Python/Codex verification failed.' }

          (Split-Path -Parent $pythonExe) >> $env:GITHUB_PATH
          "HEADLESS_PYTHON_EXE=$pythonExe" >> $env:GITHUB_ENV
          Write-Host "HEADLESS_CODEX_RUNTIME=PASS interpreter=$pythonExe"

      - name: Observe or trigger Windows-owned Arthur repair controller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          $stateDir = Join-Path $root 'state'
          $repairStatusPath = Join-Path $stateDir 'repair-status.json'
          $supervisorStatusPath = Join-Path $stateDir 'supervisor-status.json'
          $runtimeStatusPath = Join-Path $stateDir 'runtime-status.json'
          $runtimeStatePath = Join-Path $stateDir 'runtime-state.json'
          $repairTaskName = 'XinZhaoWrt-Arthur-Repair-Controller'
          $supervisorTaskName = 'XinZhaoWrt-Arthur-Persistent-Supervisor'
          $mode = [string]$env:ARTHUR_WINDOWS_REPAIR_MODE
          if ($mode -notin @('DiagnosticOnly','WhitelistRepair','FullRecovery')) {
            throw "WINDOWS_REPAIR_CONTROLLER_MODE_INVALID: $mode"
          }

          function Read-JsonSafe([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return $null }
            try { return (Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json) }
            catch { return $null }
          }
          function Get-Value($Object,[string]$Name,$Default=$null) {
            if ($null -eq $Object) { return $Default }
            $property = $Object.PSObject.Properties[$Name]
            if ($null -eq $property) { return $Default }
            return $property.Value
          }

          "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=0" >> $env:GITHUB_ENV
          "ARTHUR_WINDOWS_REPAIR_STATE=NOT_REQUIRED" >> $env:GITHUB_ENV

          $repair = Read-JsonSafe $repairStatusPath
          if ($repair) {
            $repairStatus = [string](Get-Value $repair 'status' '')
            $repairResult = [string](Get-Value $repair 'final_result' '')
            $repairMode = [string](Get-Value $repair 'mode' '')
            if ($repairStatus -eq 'CODEX_RUNTIME_RECOVERED' -or $repairResult -eq 'CODEX_RUNTIME_RECOVERED') {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=RECOVERED status=$repairStatus mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_STATE=RECOVERED" >> $env:GITHUB_ENV
              exit 0
            }
            if ($repairStatus -like 'REPAIR_BLOCKED_*' -or $repairStatus -eq 'REPAIR_EXHAUSTED' -or $repairResult -like 'REPAIR_BLOCKED_*' -or $repairResult -eq 'REPAIR_EXHAUSTED') {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=BLOCKED status=$repairStatus result=$repairResult mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_STATE=BLOCKED" >> $env:GITHUB_ENV
              throw "WINDOWS_REPAIR_CONTROLLER_BLOCKED: evidence=$repairStatusPath status=$repairStatus result=$repairResult"
            }
            if ($repairStatus -in @('DIAGNOSING','REPAIRING','PROBING','RESTARTING','VERIFYING') -and $repairMode -eq $mode) {
              Write-Host "WINDOWS_REPAIR_CONTROLLER=ACTIVE status=$repairStatus mode=$repairMode evidence=$repairStatusPath"
              "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=1" >> $env:GITHUB_ENV
              "ARTHUR_WINDOWS_REPAIR_STATE=ACTIVE" >> $env:GITHUB_ENV
              exit 0
            }
          }

          $runtimeState = Read-JsonSafe $runtimeStatePath
          $supervisorStatus = Read-JsonSafe $supervisorStatusPath
          $runtimeStatus = Read-JsonSafe $runtimeStatusPath

          $phase = [string](Get-Value $runtimeState 'phase' '')
          if ([string]::IsNullOrWhiteSpace($phase)) { $phase = [string](Get-Value $runtimeState 'current_stage' '') }
          $protectedPhases = @(
            'ARTIFACT','PRE_FLASH','AUTO_FLASH_SAFETY_GATE','FLASH','WAIT_DEVICE','IDENTIFY',
            'LAN_RUNTIME','DHCP','WAN','DNS','SSH','LUCI','PLUGIN_RUNTIME_22','ARGON_KUCAT_RUNTIME',
            'SYSTEM_HEALTH','RELEASE_GATE','RELEASE','PRODUCTION_RELEASED'
          )
          $humanGate = ''
          foreach ($gateName in @('human_gate','humanGate','pending_human_gate','pendingHumanGate')) {
            $candidateGate = [string](Get-Value $runtimeState $gateName '')
            if (-not [string]::IsNullOrWhiteSpace($candidateGate)) { $humanGate = $candidateGate; break }
          }
          $protected = (-not [string]::IsNullOrWhiteSpace($humanGate)) -or ($protectedPhases -contains $phase.ToUpperInvariant())

          $supervisorAlive = $false
          $codexAlive = $false
          if (Get-Command Get-CimInstance -ErrorAction SilentlyContinue) {
            foreach ($process in @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)) {
              $command = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($command) -or $command.IndexOf($stateDir,[System.StringComparison]::OrdinalIgnoreCase) -lt 0) { continue }
              if ($command -match 'run-supervisor\.py') { $supervisorAlive = $true }
              if ($command -match 'ai_orchestrator' -and $command -match '\bresume\b') { $codexAlive = $true }
            }
          }

          $heartbeatFresh = $false
          $heartbeatAt = [string](Get-Value $runtimeStatus 'heartbeat_at' '')
          if (-not [string]::IsNullOrWhiteSpace($heartbeatAt)) {
            $parsedHeartbeat = [DateTimeOffset]::MinValue
            if ([DateTimeOffset]::TryParse($heartbeatAt,[ref]$parsedHeartbeat)) {
              $heartbeatAge = ([DateTimeOffset]::UtcNow - $parsedHeartbeat.ToUniversalTime()).TotalSeconds
              $heartbeatFresh = ($heartbeatAge -ge 0 -and $heartbeatAge -le 120)
            }
          }
          $supervisorState = [string](Get-Value $supervisorStatus 'status' '')
          $crashLoop = ($supervisorState -eq 'CRASH_LOOP_BLOCKED')
          if ($supervisorAlive -and $codexAlive -and $heartbeatFresh -and -not $crashLoop) {
            Write-Host "WINDOWS_REPAIR_CONTROLLER=NOT_REQUIRED supervisor_alive=$supervisorAlive codex_alive=$codexAlive heartbeat_fresh=$heartbeatFresh"
            "ARTHUR_WINDOWS_REPAIR_STATE=NOT_REQUIRED" >> $env:GITHUB_ENV
            exit 0
          }

          if ($protected) {
            Write-Host "WINDOWS_REPAIR_CONTROLLER=BLOCKED reason=protected_runtime phase=$phase human_gate=$humanGate evidence=$runtimeStatePath"
            "ARTHUR_WINDOWS_REPAIR_STATE=BLOCKED" >> $env:GITHUB_ENV
            throw "WINDOWS_REPAIR_CONTROLLER_BLOCKED: runtime repair is prohibited in phase=$phase human_gate=$humanGate"
          }

          if (-not (Get-Command Get-ScheduledTask -ErrorAction SilentlyContinue)) {
            throw 'WINDOWS_REPAIR_CONTROLLER_BLOCKED: ScheduledTasks cmdlets unavailable on self-hosted Windows runner.'
          }
          $supervisorTask = Get-ScheduledTask -TaskName $supervisorTaskName -ErrorAction SilentlyContinue
          if (-not $supervisorTask) {
            Write-Host 'WINDOWS_REPAIR_CONTROLLER=NOT_REQUIRED reason=supervisor_task_bootstrap_required'
            "ARTHUR_WINDOWS_REPAIR_STATE=NOT_READY" >> $env:GITHUB_ENV
            exit 0
          }

          $helper = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\ensure-arthur-windows-repair-controller.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "WINDOWS_REPAIR_CONTROLLER_HELPER_MISSING: $helper"
          }
          & $helper `
            -StateDir $stateDir `
            -ControlRoot $env:ARTHUR_CONTROL_PLANE_CODE_ROOT `
            -HeadlessPythonExe $env:HEADLESS_PYTHON_EXE `
            -Mode $mode `
            -SupervisorTaskName $supervisorTaskName `
            -RepairTaskName $repairTaskName `
            -Start
          if ($LASTEXITCODE -ne 0) {
            throw "WINDOWS_REPAIR_CONTROLLER_TRIGGER_FAILED: exit=$LASTEXITCODE"
          }
          Write-Host "WINDOWS_REPAIR_CONTROLLER=TRIGGERED task=$repairTaskName mode=$mode supervisor_status=$supervisorState supervisor_alive=$supervisorAlive codex_alive=$codexAlive heartbeat_fresh=$heartbeatFresh"
          "ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL=1" >> $env:GITHUB_ENV
          "ARTHUR_WINDOWS_REPAIR_STATE=TRIGGERED" >> $env:GITHUB_ENV

      - name: Reconcile and resume Arthur Control Plane
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL -eq '1') {
            Write-Host "CONTROL_PLANE_RESUME_SKIPPED_FOR_WINDOWS_REPAIR=PASS state=$env:ARTHUR_WINDOWS_REPAIR_STATE"
            exit 0
          }
          $script = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\arthur-control-plane-gate.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "CONTROL_PLANE_WAKEUP_FAILED: missing $script"
          }
          if ([string]::IsNullOrWhiteSpace($env:HEADLESS_PYTHON_EXE) -or -not (Test-Path -LiteralPath $env:HEADLESS_PYTHON_EXE -PathType Leaf)) {
            throw "CONTROL_PLANE_PYTHON_BINDING_FAILED: HEADLESS_PYTHON_EXE is missing or invalid: $env:HEADLESS_PYTHON_EXE"
          }
          $pythonDir = Split-Path -Parent $env:HEADLESS_PYTHON_EXE
          $env:PATH = "$pythonDir;$env:PATH"
          $pythonCommand = Get-Command python -ErrorAction SilentlyContinue
          if (-not $pythonCommand) {
            throw "CONTROL_PLANE_PYTHON_BINDING_FAILED: python command unavailable after binding $pythonDir"
          }
          Write-Host "CONTROL_PLANE_PYTHON_BINDING=PASS interpreter=$($pythonCommand.Source)"

          $workspaceLedger = Join-Path $env:ARTHUR_CONTROL_PLANE_WORKSPACE 'production\firmware-events.jsonl'
          $workspaceResume = Join-Path $env:ARTHUR_CONTROL_PLANE_WORKSPACE 'production\resume-state.json'
          $controlLedger = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'production\firmware-events.jsonl'
          $controlResume = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'production\resume-state.json'
          Write-Host "CONTROL_PLANE_RUNTIME_INPUT=PASS workspace_ledger=$([bool](Test-Path -LiteralPath $workspaceLedger -PathType Leaf)) workspace_resume=$([bool](Test-Path -LiteralPath $workspaceResume -PathType Leaf)) control_ledger=$([bool](Test-Path -LiteralPath $controlLedger -PathType Leaf)) control_resume=$([bool](Test-Path -LiteralPath $controlResume -PathType Leaf))"

          $actionsWorkspace = $env:GITHUB_WORKSPACE
          $taskWorkspace = $env:ARTHUR_CONTROL_PLANE_WORKSPACE
          $env:GITHUB_WORKSPACE = $env:ARTHUR_CONTROL_PLANE_CODE_ROOT
          Push-Location $env:ARTHUR_CONTROL_PLANE_CODE_ROOT
          try {
            Write-Host "CONTROL_PLANE_GOVERNANCE_WORKSPACE_BOUND=PASS path=$env:GITHUB_WORKSPACE sha=$env:CONTROL_PLANE_CODE_SHA"
            Write-Host "CONTROL_PLANE_TASK_WORKSPACE_PRESERVED=PASS path=$taskWorkspace source_sha=$env:CONTROL_PLANE_SOURCE_SHA"
            & $script -Repository $env:GITHUB_REPOSITORY -WorkflowRunId $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
            $env:GITHUB_WORKSPACE = $actionsWorkspace
          }

      - name: Ensure Windows-owned persistent Arthur supervisor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ARTHUR_WINDOWS_REPAIR_SKIP_NORMAL -eq '1') {
            Write-Host "PERSISTENT_SUPERVISOR_START_SKIPPED_FOR_WINDOWS_REPAIR=PASS state=$env:ARTHUR_WINDOWS_REPAIR_STATE"
            exit 0
          }
          $helper = Join-Path $env:ARTHUR_CONTROL_PLANE_CODE_ROOT 'scripts\ensure-arthur-persistent-supervisor.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw "PERSISTENT_SUPERVISOR_HELPER_MISSING: $helper"
          }
          $stateDir = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane\state'
          & $helper `
            -StateDir $stateDir `
            -ControlRoot $env:ARTHUR_CONTROL_PLANE_CODE_ROOT `
            -HeadlessPythonExe $env:HEADLESS_PYTHON_EXE
          if ($LASTEXITCODE -ne 0) {
            throw "PERSISTENT_SUPERVISOR_TASK_FAILED: exit=$LASTEXITCODE"
          }
          Write-Host 'PERSISTENT_SUPERVISOR_TASK=PASS'

      - name: Publish wakeup summary
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          "## Arthur Runner Control Plane Wakeup" >> $env:GITHUB_STEP_SUMMARY
          "- Runner identity: ``$(whoami)``" >> $env:GITHUB_STEP_SUMMARY
          "- Canonical root: ``$root``" >> $env:GITHUB_STEP_SUMMARY
          "- Clean control code: ``$env:ARTHUR_CONTROL_PLANE_CODE_ROOT`` @ ``$env:CONTROL_PLANE_CODE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Persistent task workspace: ``$env:ARTHUR_CONTROL_PLANE_WORKSPACE``" >> $env:GITHUB_STEP_SUMMARY
          "- Task source branch: ``$env:CONTROL_PLANE_SOURCE_BRANCH``" >> $env:GITHUB_STEP_SUMMARY
          "- Task source SHA: ``$env:CONTROL_PLANE_SOURCE_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- Windows repair routing: ``$env:ARTHUR_WINDOWS_REPAIR_STATE`` (mode ``$env:ARTHUR_WINDOWS_REPAIR_MODE``)" >> $env:GITHUB_STEP_SUMMARY
          $heartbeat = Join-Path $root 'heartbeat.json'
          if (Test-Path -LiteralPath $heartbeat) {
            $h = Get-Content -Raw -LiteralPath $heartbeat | ConvertFrom-Json
            "- Heartbeat sequence: ``$($h.sequence)``" >> $env:GITHUB_STEP_SUMMARY
          }
          $runtimeState = Join-Path $root 'state\runtime-state.json'
          if (Test-Path -LiteralPath $runtimeState) {
            $runtime = Get-Content -Raw -LiteralPath $runtimeState | ConvertFrom-Json
            "- Release task: ``$($runtime.release_task_id)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime phase: ``$($runtime.phase)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime turn count: ``$($runtime.turn_count)``" >> $env:GITHUB_STEP_SUMMARY
            "- Terminal state: ``$($runtime.terminal_state)``" >> $env:GITHUB_STEP_SUMMARY
          }
          $repairStatus = Join-Path $root 'state\repair-status.json'
          if (Test-Path -LiteralPath $repairStatus) {
            try {
              $repair = Get-Content -Raw -LiteralPath $repairStatus | ConvertFrom-Json
              "- Repair status: ``$($repair.status)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair failure class: ``$($repair.failure_class)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair action: ``$($repair.selected_repair_action)``" >> $env:GITHUB_STEP_SUMMARY
              "- Repair final result: ``$($repair.final_result)``" >> $env:GITHUB_STEP_SUMMARY
            }
            catch {
              "- Repair status: ``UNREADABLE``" >> $env:GITHUB_STEP_SUMMARY
            }
          }
