name: Arthur Production Agent Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'production/production-agent.json'
      - 'production/arthur-flash-profile.json'
      - 'scripts/production-agent.ps1'
      - 'scripts/fetch-production-artifact.ps1'
      - 'scripts/auto-flash-safety-gate.ps1'
      - 'scripts/install-production-agent.ps1'
      - 'scripts/uninstall-production-agent.ps1'
      - 'scripts/start-production-agent.ps1'
      - 'scripts/production-agent-status.ps1'
      - 'tests/production-agent.tests.ps1'
      - '.github/workflows/production-agent-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arthur-production-agent-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 20

    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate deployment source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/production-agent.tests.ps1

      - name: Sync stable Production Agent runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          $workspace = $env:GITHUB_WORKSPACE
          $repo = 'https://github.com/mxonline/xinzhaowrt.git'
          $sourceSha = (git -C $workspace rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
            throw 'Unable to resolve the already checked-out deployment source SHA.'
          }

          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          if (-not (Test-Path (Join-Path $runtime '.git'))) {
            git -C $runtime init
            if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize stable Production Agent runtime.' }
            git -C $runtime remote add origin $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to configure Production Agent origin.' }
          } else {
            git -C $runtime remote set-url origin $repo
            if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize Production Agent origin.' }
          }

          # Reuse the worktree that actions/checkout has already downloaded.
          # This removes the redundant second GitHub clone/fetch boundary that
          # previously failed on a transient Windows schannel close_notify error.
          git -C $runtime fetch --force $workspace 'refs/heads/main:refs/remotes/deploy/main'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to import main from the local checked-out workspace.' }
          git -C $runtime checkout -B main refs/remotes/deploy/main
          if ($LASTEXITCODE -ne 0) { throw 'Failed to checkout locally imported main in Production Agent runtime.' }
          git -C $runtime reset --hard $sourceSha
          if ($LASTEXITCODE -ne 0) { throw 'Failed to synchronize Production Agent runtime to the checked-out source SHA.' }

          $runtimeSha = (git -C $runtime rev-parse HEAD).Trim()
          if ($runtimeSha -ne $sourceSha) {
            throw "Production Agent runtime SHA mismatch: source=$sourceSha runtime=$runtimeSha"
          }
          Write-Host "PRODUCTION_AGENT_RUNTIME=$runtime"
          Write-Host "PRODUCTION_AGENT_RUNTIME_SHA=$runtimeSha"
          Write-Host 'PRODUCTION_AGENT_LOCAL_SYNC=PASS'

      - name: Verify persistent GitHub authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) {
            throw 'NEW_CREDENTIAL_PROVISIONING: persistent gh credential store is unavailable to the Windows runner account.'
          }
          Write-Host 'PERSISTENT_GITHUB_AUTH=PASS'

      - name: Install and start persistent Production Agent
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $runtime = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ProductionAgent'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $runtime 'scripts\install-production-agent.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Production Agent install failed: $LASTEXITCODE" }
          Start-Sleep -Seconds 5
          $task = Get-ScheduledTask -TaskName 'XinZhaoWrt-Arthur-Production-Agent' -ErrorAction Stop
          Write-Host "PRODUCTION_AGENT_TASK=$($task.State)"
          if (Test-Path (Join-Path $runtime 'output\production-agent\state.json')) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $runtime 'scripts\production-agent-status.ps1')
          } else {
            Write-Host 'PRODUCTION_AGENT_STATE=STARTING'
          }
          Write-Host 'PRODUCTION_AGENT_DEPLOY=PASS'
