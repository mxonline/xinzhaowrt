name: Arthur Resume Hash Canonicalizer

'on':
  push:
    branches:
      - main
    paths:
      - production/resume-state.json
      - scripts/arthur-resume-state.ps1
      - .github/workflows/arthur-resume-hash.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arthur-resume-hash-main
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recompute canonical semantic SHA256
        id: hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/arthur-resume-state.ps1
          $path = 'production/resume-state.json'
          $state = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json -Depth 30
          $oldHash = [string]$state.semantic_sha256
          $timestampProperty = $state.PSObject.Properties['evidence_timestamp']
          $timestamp = if ($null -eq $timestampProperty) { $null } else { $timestampProperty.Value }
          $state.PSObject.Properties.Remove('semantic_sha256')
          $state.PSObject.Properties.Remove('evidence_timestamp')
          $newHash = Get-ArthurResumeSemanticHash $state
          $state | Add-Member -NotePropertyName semantic_sha256 -NotePropertyValue $newHash
          if ($null -ne $timestamp) {
            $state | Add-Member -NotePropertyName evidence_timestamp -NotePropertyValue $timestamp
          }
          if ($oldHash -eq $newHash) {
            Write-Host "RESUME_SEMANTIC_HASH=PASS hash=$newHash"
            'changed=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $json = $state | ConvertTo-Json -Depth 30
          [IO.File]::WriteAllText((Resolve-Path '.').Path + '/production/resume-state.json',$json + [Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Write-Host "RESUME_SEMANTIC_HASH=REPAIRED old=$oldHash new=$newHash"
          'changed=true' >> $env:GITHUB_OUTPUT

      - name: Persist state-only hash repair
        if: steps.hash.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'XinZhaoWrt State Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
          git add production/resume-state.json
          git commit -m 'state: canonicalize Arthur resume semantic hash'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'BLOCKED: unable to persist canonical resume hash' >&2
          exit 1
