name: Apply Rebuild Dispatch Ack Fix

on:
  push:
    branches:
      - fix/rebuild-dispatch-ack
    paths:
      - '.github/workflows/apply-rebuild-dispatch-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rebuild-dispatch-ack
          fetch-depth: 0

      - name: Patch authenticated rebuild dispatch
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/production-agent-deploy.yml')
          text = path.read_text(encoding='utf-8')

          old_permissions = "permissions:\n  contents: write\n  actions: read"
          new_permissions = "permissions:\n  contents: write\n  actions: write"
          assert text.count(old_permissions) == 1, 'expected actions: read permission block exactly once'
          text = text.replace(old_permissions, new_permissions, 1)

          old_run_select = """          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $runId = [long]$config.bootstrap.run_id
          if ($runId -le 0) { throw 'Current Arthur production run_id is not configured.' }
"""
          new_run_select = """          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $runId = [long]$config.bootstrap.run_id
          if (Test-Path $statePath) {
            try {
              $persistedState = Get-Content -Raw $statePath | ConvertFrom-Json
              if ($persistedState.PSObject.Properties.Name -contains 'replacement_run_id' -and [long]$persistedState.replacement_run_id -gt 0) {
                $runId = [long]$persistedState.replacement_run_id
                Write-Host "PRODUCTION_AGENT_RESUME_REPLACEMENT_RUN=$runId"
              }
              elseif ([long]$persistedState.run_id -gt 0 -and [long]$persistedState.run_id -ne [long]$config.bootstrap.run_id -and [string]$persistedState.status -ne 'PRODUCTION_RELEASED') {
                $runId = [long]$persistedState.run_id
                Write-Host "PRODUCTION_AGENT_RESUME_PERSISTED_RUN=$runId"
              }
            }
            catch {
              Write-Warning "PERSISTED_RUN_STATE_READ_RETRY: $($_.Exception.Message)"
            }
          }
          if ($runId -le 0) { throw 'Current Arthur production run_id is not configured.' }
"""
          assert text.count(old_run_select) == 1, 'expected bootstrap run selection block exactly once'
          text = text.replace(old_run_select, new_run_select, 1)

          anchor = """            if ($state -and [string]$state.stage -eq 'PRODUCTION_RELEASED') {
"""
          dispatch_logic = """            if ($state -and [string]$state.status -eq 'REBUILD_REQUESTED') {
              $sourceSha = (git -C $runtime rev-parse HEAD).Trim()
              if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') {
                Write-Warning 'CURRENT_SOURCE_REBUILD_DISPATCH_RETRY reason=source-sha-unavailable'
                Start-Sleep -Seconds 30
                continue
              }

              Write-Host "REBUILD_DISPATCHING source=$sourceSha old_run=$runId"
              $replacementRun = $null
              $listArgs = @('run','list','--repo',[string]$config.repository,'--workflow','arthur-update-v3.yml','--branch','main','--event','workflow_dispatch','--limit','20','--json','databaseId,createdAt,status,conclusion,headSha')
              $previousPreference = $ErrorActionPreference
              try {
                $ErrorActionPreference = 'Continue'
                $listText = (& gh @listArgs 2>&1 | Out-String).Trim()
                $listExit = $LASTEXITCODE
              }
              finally {
                $ErrorActionPreference = $previousPreference
              }
              if ($listExit -eq 0 -and $listText) {
                try {
                  $runs = @($listText | ConvertFrom-Json)
                  $replacementRun = $runs |
                    Where-Object {
                      [string]$_.headSha -eq $sourceSha -and
                      ([string]$_.status -in @('queued','in_progress','waiting','requested','pending') -or [string]$_.conclusion -eq 'success')
                    } |
                    Sort-Object { [DateTime]$_.createdAt } -Descending |
                    Select-Object -First 1
                }
                catch {
                  Write-Warning "CURRENT_SOURCE_REBUILD_DISPATCH_RETRY reason=run-list-parse detail=$($_.Exception.Message)"
                }
              }

              if (-not $replacementRun) {
                $started = [DateTime]::UtcNow
                $dispatchArgs = @('workflow','run','arthur-update-v3.yml','--repo',[string]$config.repository,'--ref','main','-f','mode=rebuild_known_good')
                $previousPreference = $ErrorActionPreference
                try {
                  $ErrorActionPreference = 'Continue'
                  $dispatchText = (& gh @dispatchArgs 2>&1 | Out-String).Trim()
                  $dispatchExit = $LASTEXITCODE
                }
                finally {
                  $ErrorActionPreference = $previousPreference
                }
                if ($dispatchExit -ne 0) {
                  Write-Warning "CURRENT_SOURCE_REBUILD_DISPATCH_RETRY reason=workflow-dispatch exit=$dispatchExit detail=$dispatchText"
                  Start-Sleep -Seconds 30
                  continue
                }

                $confirmDeadline = (Get-Date).AddSeconds(60)
                while ((Get-Date) -lt $confirmDeadline -and -not $replacementRun) {
                  Start-Sleep -Seconds 5
                  $previousPreference = $ErrorActionPreference
                  try {
                    $ErrorActionPreference = 'Continue'
                    $confirmText = (& gh @listArgs 2>&1 | Out-String).Trim()
                    $confirmExit = $LASTEXITCODE
                  }
                  finally {
                    $ErrorActionPreference = $previousPreference
                  }
                  if ($confirmExit -ne 0 -or -not $confirmText) { continue }
                  try {
                    $runs = @($confirmText | ConvertFrom-Json)
                    $replacementRun = $runs |
                      Where-Object {
                        [string]$_.headSha -eq $sourceSha -and
                        ([DateTime]$_.createdAt).ToUniversalTime() -ge $started.AddSeconds(-3)
                      } |
                      Sort-Object { [DateTime]$_.createdAt } -Descending |
                      Select-Object -First 1
                  }
                  catch {}
                }
              }

              if (-not $replacementRun -or [long]$replacementRun.databaseId -le 0) {
                Write-Warning 'CURRENT_SOURCE_REBUILD_DISPATCH_RETRY reason=run-id-not-confirmed'
                Start-Sleep -Seconds 30
                continue
              }

              $replacementRunId = [long]$replacementRun.databaseId
              if (-not ($state.PSObject.Properties.Name -contains 'replacement_run_id')) {
                $state | Add-Member -NotePropertyName replacement_run_id -NotePropertyValue $replacementRunId
              } else { $state.replacement_run_id = $replacementRunId }
              if (-not ($state.PSObject.Properties.Name -contains 'replacement_source_sha')) {
                $state | Add-Member -NotePropertyName replacement_source_sha -NotePropertyValue $sourceSha
              } else { $state.replacement_source_sha = $sourceSha }
              if (-not ($state.PSObject.Properties.Name -contains 'replacement_build_requested')) {
                $state | Add-Member -NotePropertyName replacement_build_requested -NotePropertyValue $true
              } else { $state.replacement_build_requested = $true }
              $state.status = 'REBUILD_DISPATCHED'
              $state.last_error = ''
              $state.updated_at = (Get-Date).ToString('o')
              $state | ConvertTo-Json -Depth 10 | Set-Content -Path $statePath -Encoding UTF8
              Write-Host "REBUILD_DISPATCHED run=$replacementRunId source=$sourceSha"
              Write-Host "CURRENT_SOURCE_REBUILD_DISPATCHED=YES run=$replacementRunId source=$sourceSha"
              $runId = $replacementRunId
              continue
            }

"""
          assert text.count(anchor) == 1, 'expected production released anchor exactly once'
          text = text.replace(anchor, dispatch_logic + anchor, 1)

          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Verify patch markers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/rebuild-dispatch-ack.tests.ps1
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/production-agent-deploy.yml
          git commit -m 'fix: confirm current-source rebuild dispatch'
          git push origin HEAD:fix/rebuild-dispatch-ack
