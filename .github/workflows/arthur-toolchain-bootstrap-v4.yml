name: Arthur Toolchain Bootstrap v4

'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Explicitly confirm the one-time heavy Known-Good toolchain bootstrap'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'BOOTSTRAP'
  workflow_run:
    workflows:
      - 'Arthur Known-Good Fast Lane v1'
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: arthur-v4-toolchain-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'BOOTSTRAP') || (github.event_name == 'workflow_run' && github.event.workflow_run.id == 33182381566) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout v4 project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Guard legacy build occupancy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          legacy_run_id='33182381566'
          if [[ "${{ github.event_name }}" == 'workflow_run' ]]; then
            test "${{ github.event.workflow_run.id }}" = "$legacy_run_id"
            test "${{ github.event.workflow_run.status }}" = 'completed'
          else
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${legacy_run_id}" --jq '.status')"
            if [[ "$status" != 'completed' ]]; then
              echo "ERROR: legacy Full Build ${legacy_run_id} is still ${status}; refusing parallel heavy bootstrap." >&2
              exit 1
            fi
          fi

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: ./scripts/codex-setup.sh

      - name: Validate v4 bootstrap gates
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh tests/*.sh
          ./tests/test-classify-build-scope.sh
          ./tests/test-v4-toolchain-bootstrap.sh
          ./tests/test-v4-toolchain-acceptance.sh
          ./scripts/verify-project.sh
          ./scripts/v4-toolchain-bootstrap.sh --plan

      - name: Restore Known-Good downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            work/immortalwrt/dl
            work/immortalwrt/.ccache
          key: arthur-v4-toolchain-${{ runner.os }}-${{ hashFiles('config/arthur-known-good.lock', 'config/arthur.config', 'config/required-plugins.txt', 'scripts/build.sh', 'scripts/v4-toolchain-bootstrap.sh', 'scripts/v4-verify-toolchain.sh') }}
          restore-keys: |
            arthur-known-good-${{ runner.os }}-
            arthur-${{ runner.os }}-

      - name: Build Known-Good SDK and ImageBuilder
        env:
          JOBS: '2'
          QUIET_BUILD: '1'
          REUSE_SOURCE: '0'
        run: |
          set -Eeuo pipefail
          ./scripts/v4-toolchain-bootstrap.sh --execute

      - name: Verify generated toolchain bundle
        run: |
          set -Eeuo pipefail
          ./scripts/v4-verify-toolchain.sh

      - name: Analyze bootstrap failure
        if: failure()
        continue-on-error: true
        run: |
          if [ -s output/logs/build.log ]; then
            ./scripts/analyze-error.sh output/logs/build.log
          elif [ -s output/logs/build-diagnostic.log ]; then
            ./scripts/analyze-error.sh output/logs/build-diagnostic.log
          else
            ./scripts/analyze-error.sh
          fi

      - name: Bootstrap summary
        if: always()
        run: |
          {
            echo '## Arthur Toolchain Bootstrap v4'
            echo
            echo '- Stable Known-Good is read-only during this workflow.'
            echo '- Source and feeds are pinned by config/arthur-known-good.lock.'
            echo '- Outputs required: SDK, standalone ImageBuilder, package repositories, provenance and SHA256.'
            echo '- Acceptance must pass before artifact upload or Release publication.'
            echo '- One-time auto handoff source: legacy run 33182381566.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s output/toolchain/toolchain-provenance.json ]; then
            {
              echo
              echo '### Provenance'
              echo '```json'
              cat output/toolchain/toolchain-provenance.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s output/toolchain/toolchain-acceptance.json ]; then
            {
              echo
              echo '### Acceptance'
              echo '```json'
              cat output/toolchain/toolchain-acceptance.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s output/logs/error-summary.txt ]; then
            {
              echo
              echo '### Failure diagnosis'
              cat output/logs/error-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-v4-toolchain-diagnostics-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/build-diagnostic.log
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/full.config
            config/arthur-known-good.lock
            production/known-good.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified toolchain bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Arthur-v4-toolchain-${{ github.run_id }}
          path: output/toolchain/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish toolchain candidate release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -s output/toolchain/toolchain-acceptance.json
          grep -q '"status": "verified"' output/toolchain/toolchain-acceptance.json
          stable_tag="$(python3 -c "import json; print(json.load(open('production/known-good.json'))['stable_tag'])")"
          tag="arthur-toolchain-${stable_tag}-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            output/toolchain/* \
            --title "Arthur v4 Toolchain ${stable_tag} / ${GITHUB_RUN_ID}" \
            --notes "Known-Good-matched SDK, standalone ImageBuilder and package repository bundle. Toolchain acceptance verified. This is a toolchain Candidate only and does not mutate Stable firmware." \
            --prerelease
