name: Arthur v0.1.3 Codex Live Validation Turn

on:
  push:
    branches:
      - feature/arthur-v013-next
    paths:
      - 'production/v013-codex-turn.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: arthur-v013-codex-turn
  cancel-in-progress: false

jobs:
  codex-turn:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/arthur-v013-next
          fetch-depth: 1

      - name: Execute one Codex real-device validation turn
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestPath = Join-Path $env:GITHUB_WORKSPACE 'production\v013-codex-turn.json'
          $promptPath = Join-Path $env:GITHUB_WORKSPACE 'production\v013-codex-prompt.txt'
          $requestText = Get-Content -Raw $requestPath
          $prompt = (Get-Content -Raw $promptPath) + "`n`nREQUEST PAYLOAD:`n" + $requestText

          $codexCmd = Get-Command codex.cmd -ErrorAction SilentlyContinue
          if (-not $codexCmd) { $codexCmd = Get-Command codex -ErrorAction Stop }
          $codexExe = $codexCmd.Source
          Write-Host "CODEX_EXECUTABLE=$codexExe"
          & $codexExe --version
          if ($LASTEXITCODE -ne 0) { throw 'Codex version probe failed.' }

          $resultPath = Join-Path $env:RUNNER_TEMP 'v013-codex-result.json'
          $previousPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $output = ($prompt | & $codexExe exec --sandbox danger-full-access -c 'approval_policy="never"' -o $resultPath - 2>&1 | Out-String)
            $exitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousPreference
          }
          $output | Write-Host
          if ($exitCode -ne 0) { throw "Codex exited with code $exitCode" }
          if (-not (Test-Path $resultPath)) { throw 'Codex produced no result file.' }

          $resultText = Get-Content -Raw $resultPath
          Write-Host 'CODEX_RESULT_BEGIN'
          Write-Host $resultText
          Write-Host 'CODEX_RESULT_END'

          $changed = @(git status --porcelain | ForEach-Object { if ($_.Length -ge 4) { $_.Substring(3).Trim() } } | Where-Object { $_ })
          $allowed = @('scripts/live-validate-v013-features.ps1','tests/v013-live-feature-deploy.tests.ps1')
          $forbidden = @($changed | Where-Object { $_ -notin $allowed })
          if ($forbidden.Count -gt 0) { throw "Codex changed forbidden paths: $($forbidden -join ', ')" }

          if ($changed.Count -gt 0) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\v013-live-feature-deploy.tests.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Focused live-deploy contract failed after Codex edit.' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after Codex edit.' }
            git config user.name 'XinZhaoWrt Codex Executor'
            git config user.email 'codex-executor@users.noreply.github.com'
            git add -- scripts/live-validate-v013-features.ps1 tests/v013-live-feature-deploy.tests.ps1
            git commit -m 'fix: repair Arthur prebuild live validation runtime'
            if ($LASTEXITCODE -ne 0) { throw 'Codex repair commit failed.' }
            git push origin HEAD:feature/arthur-v013-next
            if ($LASTEXITCODE -ne 0) { throw 'Codex repair push failed.' }
            Write-Host "CODEX_REPAIR_PUSHED=$(git rev-parse HEAD)"
          } else {
            Write-Host 'CODEX_REPAIR_PUSHED=NO_CHANGES'
          }
