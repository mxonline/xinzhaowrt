name: Build XinZhaoWrt Arthur

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: VIKINGYFY/immortalwrt branch or tag
        required: true
        default: main
        type: string
      publish_candidate:
        description: Publish successful build as Candidate GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout build project
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: ./scripts/codex-setup.sh

      - name: Preflight project validation
        run: |
          mkdir -p output/logs
          set -o pipefail
          ./scripts/verify-project.sh 2>&1 | tee -a output/logs/build.log

      - name: Restore OpenWrt download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            work/immortalwrt/dl
            work/immortalwrt/.ccache
          key: arthur-${{ runner.os }}-${{ github.event.inputs.source_ref || 'main' }}-${{ hashFiles('config/**', 'scripts/**', 'build.env') }}
          restore-keys: |
            arthur-${{ runner.os }}-${{ github.event.inputs.source_ref || 'main' }}-
            arthur-${{ runner.os }}-

      - name: Feed Check
        env:
          IMMORTAL_SOURCE_REPO: https://github.com/VIKINGYFY/immortalwrt.git
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          set -Eeuo pipefail
          mkdir -p output/logs work/feed-check
          FEED_LOG="$GITHUB_WORKSPACE/output/logs/feed-check.log"
          FEED_ERROR="$GITHUB_WORKSPACE/output/logs/feed-error.txt"
          : > "$FEED_LOG"
          rm -f "$FEED_ERROR"
          exec > >(tee -a "$FEED_LOG") 2>&1

          feed_failed_command='未捕获到失败命令'
          feed_on_exit() {
            local rc=$?
            if (( rc != 0 )); then
              local first_error
              first_error="$(awk 'BEGIN { IGNORECASE=1 } $0 !~ /WARNING:/ && /ERROR:|fatal:|MISSING_PACKAGE|MISSING_SOURCE|package source.*no Makefile|dependency.*does not exist|conflict|syntax error/ { print NR ":" $0; exit }' "$FEED_LOG" 2>/dev/null || true)"
              if [[ -z "$first_error" ]]; then
                first_error="$(awk 'BEGIN { IGNORECASE=1 } $0 !~ /WARNING:/ && /failed|error:/ { print NR ":" $0; exit }' "$FEED_LOG" 2>/dev/null || true)"
              fi
              {
                echo "Failure stage: Feed Check"
                echo "GitHub Actions Run ID: ${GITHUB_RUN_ID:-unknown}"
                echo "Commit SHA: ${GITHUB_SHA:-unknown}"
                echo "ImmortalWrt source repo: $IMMORTAL_SOURCE_REPO"
                echo "Source ref: $IMMORTAL_SOURCE_REF"
                echo "Failed command: $feed_failed_command"
                echo "Exit code: $rc"
                echo "First real error: ${first_error:-未在 Feed Check 日志中匹配到 ERROR；请查看完整日志。}"
                echo
                echo "Last relevant log lines:"
                tail -n 200 "$FEED_LOG" || true
              } > "$FEED_ERROR"
            fi
            return "$rc"
          }
          trap 'feed_failed_command="$BASH_COMMAND"' ERR
          trap feed_on_exit EXIT

          REF="$IMMORTAL_SOURCE_REF"
          SRC="$GITHUB_WORKSPACE/work/feed-check/immortalwrt"
          rm -rf "$SRC"
          git clone --depth=1 --branch "$REF" "$IMMORTAL_SOURCE_REPO" "$SRC"
          cd "$SRC"

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          "$GITHUB_WORKSPACE/scripts/add-custom-packages.sh" "$SRC"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp "$GITHUB_WORKSPACE/config/arthur.config" .config
          make defconfig

      - name: Build firmware
        env:
          JOBS: '2'
          QUIET_BUILD: '1'
          REUSE_SOURCE: '0'
        run: |
          REF='${{ github.event.inputs.source_ref }}'
          if [ -z "$REF" ]; then REF=main; fi
          mkdir -p output/logs
          export IMMORTAL_SOURCE_REPO='https://github.com/VIKINGYFY/immortalwrt.git'
          export IMMORTAL_SOURCE_REF="$REF"
          ./scripts/build.sh "$REF"

      - name: Analyze build failure
        if: failure()
        continue-on-error: true
        env:
          IMMORTAL_SOURCE_REPO: https://github.com/VIKINGYFY/immortalwrt.git
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          if [ -s output/logs/feed-error.txt ]; then
            echo "Failure source: Feed Check"
            ./scripts/analyze-error.sh output/logs/feed-check.log output/logs/feed-error.txt
          elif [ -s output/logs/build.log ]; then
            echo "Failure source: Build firmware"
            ./scripts/analyze-error.sh output/logs/build.log
          else
            echo "Failure source: unknown (no non-empty Feed Check or build log)"
            ./scripts/analyze-error.sh
          fi

      - name: Add failure summary to job
        if: always()
        run: |
          if [ -f output/logs/error-summary.txt ]; then
            {
              echo '## 自动失败诊断摘要'
              cat output/logs/error-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## 自动失败诊断摘要'
              echo 'Failure stage: Unknown'
              echo 'First real error: error-summary.txt 未生成，请下载诊断 Artifact。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinZhaoWrt-diagnostics-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/feed-check.log
            output/logs/feed-error.txt
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/logs/failure-report.txt
            output/full.config
            config/required-plugins.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinZhaoWrt-Arthur
          path: |
            output/firmware/*
            output/full.config
            output/build-info.txt
            output/required-plugins.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Candidate GitHub Release
        if: success() && inputs.publish_candidate == true
        id: candidate_release
        env:
          GH_TOKEN: ${{ github.token }}
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          chmod +x scripts/release-candidate.sh
          ./scripts/release-candidate.sh

      - name: Persist Candidate release status
        if: success() && inputs.publish_candidate == true
        env:
          CANDIDATE_TAG: ${{ steps.candidate_release.outputs.tag }}
          FIRMWARE_NAME: ${{ steps.candidate_release.outputs.firmware_name }}
          FIRMWARE_SHA256: ${{ steps.candidate_release.outputs.firmware_sha256 }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/update-release-status.sh
          ./scripts/update-release-status.sh "$CANDIDATE_TAG" "$FIRMWARE_NAME" "$FIRMWARE_SHA256"
          git config user.name 'XinZhaoWrt Release Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
          git add production/status.json
          git commit -m "release: record ${CANDIDATE_TAG} candidate publication"
          git pull --rebase origin main
          git push origin HEAD:main
