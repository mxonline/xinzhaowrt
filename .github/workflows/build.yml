name: Build XinZhaoWrt Arthur

'on':
  workflow_dispatch:
    inputs:
      validation_build:
        description: Build the frozen Arthur candidate for validation only; never publish
        required: true
        default: true
        type: boolean
      arthur_candidate_sha:
        description: Exact frozen Arthur firmware candidate SHA
        required: true
        default: f664a1cf83e73b23caedf9d09a70e93df49f9e24
        type: string
      source_ref:
        description: Verified immortalwrt commit, branch or tag
        required: true
        default: 27e26e324bee0b0c2a4eb58e2e9121fea5d43194
        type: string
      publish_candidate:
        description: Publish successful build as Candidate GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout exact Arthur candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.arthur_candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout validation build controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build-controller
          fetch-depth: 0
          persist-credentials: false

      - name: Validate validation-build-only dispatch
        env:
          GITHUB_ACTIONS: 'true'
          VALIDATION_BUILD: ${{ inputs.validation_build }}
          PUBLISH_CANDIDATE: ${{ github.event.inputs.publish_candidate || 'true' }}
          ARTHUR_CANDIDATE_SHA: ${{ inputs.arthur_candidate_sha }}
          EXPECTED_ARTHUR_CANDIDATE_SHA: f664a1cf83e73b23caedf9d09a70e93df49f9e24
          PROJECT_ROOT: ${{ github.workspace }}
        run: bash build-controller/scripts/check-arthur-validation-build.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: ./scripts/codex-setup.sh

      - name: Restore OpenWrt download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            work/immortalwrt/dl
            work/immortalwrt/.ccache
          key: arthur-${{ runner.os }}-${{ github.event.inputs.source_ref || 'main' }}-${{ hashFiles('config/**', 'scripts/**', 'build.env') }}
          restore-keys: |
            arthur-${{ runner.os }}-${{ github.event.inputs.source_ref || 'main' }}-
            arthur-${{ runner.os }}-

      - name: Replacement build hard gate
        env:
          PUBLISH_CANDIDATE: ${{ github.event.inputs.publish_candidate || 'true' }}
        run: |
          set -Eeuo pipefail
          [[ "$PUBLISH_CANDIDATE" == 'false' ]] || {
            echo 'REPLACEMENT_BUILD_HARD_GATE: FAIL -- publish_candidate must be false' >&2
            exit 1
          }
          ./scripts/check-replacement-build-hard-gate.sh config/replacement-build-gate.env

      - name: Feed Check
        env:
          IMMORTAL_SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          set -Eeuo pipefail
          mkdir -p output/logs work/feed-check
          FEED_LOG="$GITHUB_WORKSPACE/output/logs/feed-check.log"
          FEED_ERROR="$GITHUB_WORKSPACE/output/logs/feed-error.txt"
          : > "$FEED_LOG"
          rm -f "$FEED_ERROR"
          exec > >(tee -a "$FEED_LOG") 2>&1

          feed_failed_command='未捕获到失败命令'
          feed_on_exit() {
            local rc=$?
            if (( rc != 0 )); then
              local first_error
              first_error="$(awk 'BEGIN { IGNORECASE=1 } $0 !~ /WARNING:/ && /ERROR:|fatal:|MISSING_PACKAGE|MISSING_SOURCE|MISSING: CONFIG_PACKAGE|MISSING CONFIG_PACKAGE|package source.*no Makefile|dependency.*does not exist|conflict|syntax error/ { print NR ":" $0; exit }' "$FEED_LOG" 2>/dev/null || true)"
              if [[ -z "$first_error" ]]; then
                first_error="$(awk 'BEGIN { IGNORECASE=1 } $0 !~ /WARNING:/ && /failed|error:/ { print NR ":" $0; exit }' "$FEED_LOG" 2>/dev/null || true)"
              fi
              {
                echo "Failure stage: Feed Check"
                echo "GitHub Actions Run ID: ${GITHUB_RUN_ID:-unknown}"
                echo "Commit SHA: ${GITHUB_SHA:-unknown}"
                echo "ImmortalWrt source repo: $IMMORTAL_SOURCE_REPO"
                echo "Source ref: $IMMORTAL_SOURCE_REF"
                echo "Failed command: $feed_failed_command"
                echo "Exit code: $rc"
                echo "First real error: ${first_error:-未在 Feed Check 日志中匹配到 ERROR；请查看完整日志。}"
                echo
                echo "Last relevant log lines:"
                tail -n 200 "$FEED_LOG" || true
              } > "$FEED_ERROR"
            fi
            return "$rc"
          }
          trap 'feed_failed_command="$BASH_COMMAND"' ERR
          trap feed_on_exit EXIT

          REF="$IMMORTAL_SOURCE_REF"
          SRC="$GITHUB_WORKSPACE/work/feed-check/immortalwrt"
          rm -rf "$SRC"
          bash "$GITHUB_WORKSPACE/scripts/fetch-immortalwrt-source.sh" "$SRC" "$IMMORTAL_SOURCE_REPO" "$REF" "$GITHUB_WORKSPACE/output"
          cd "$SRC"

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          "$GITHUB_WORKSPACE/scripts/add-custom-packages.sh" "$SRC"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Hard gate: use the same Arthur compatibility seed as the real build,
          # then require all 22 protected LuCI packages to survive make defconfig.
          bash "$GITHUB_WORKSPACE/scripts/apply-arthur-config.sh" "$SRC"

      - name: Preflight project validation
        env:
          ADGUARD_MANAGER_PACKAGE_ROOT: ${{ github.workspace }}/work/feed-check/immortalwrt/package/feeds/xinzhao/luci-app-adguardhome
          FEED_CHECK_ROOT: ${{ github.workspace }}/work/feed-check/immortalwrt
        run: |
          mkdir -p output/logs
          set -o pipefail
          ./scripts/verify-project.sh 2>&1 | tee -a output/logs/build.log

      - name: Build firmware
        env:
          JOBS: '2'
          QUIET_BUILD: '1'
          REUSE_SOURCE: '0'
          PROJECT_ROOT: ${{ github.workspace }}
          CONTROL_ROOT: ${{ github.workspace }}/build-controller
          VALIDATION_BUILD: ${{ inputs.validation_build }}
          PUBLISH_CANDIDATE: ${{ github.event.inputs.publish_candidate || 'true' }}
          ARTHUR_CANDIDATE_SHA: ${{ inputs.arthur_candidate_sha }}
          EXPECTED_ARTHUR_CANDIDATE_SHA: f664a1cf83e73b23caedf9d09a70e93df49f9e24
        run: |
          REF='${{ github.event.inputs.source_ref }}'
          if [ -z "$REF" ]; then REF=main; fi
          mkdir -p output/logs
          export IMMORTAL_SOURCE_REPO='https://github.com/immortalwrt/immortalwrt.git'
          export IMMORTAL_SOURCE_REF="$REF"
          bash ./build-controller/scripts/build.sh "$REF"
          echo 'FIRMWARE_BUILD_COUNT_NEW=1' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify validation build artifact
        if: success() && inputs.validation_build == true
        run: |
          set -Eeuo pipefail
          markers=output/openclash-core-verification.txt
          for marker in \
            'META_CORE_INCLUDED=PASS' \
            'SMART_CORE_INCLUDED=PASS' \
            'SMART_CORE_ARCH=PASS' \
            'SMART_CORE_SHA256=PASS' \
            'SMART_CORE_EXECUTABLE=PASS' \
            'SMART_CORE_SELECTOR_INCLUDED=PASS'; do
            grep -Fqx "$marker" "$markers" || { echo "ARTIFACT_VERIFY=FAIL missing $marker" >&2; exit 1; }
          done
          grep -Fqx 'SMART_CORE_ARCH_VALUE=aarch64/linux-arm64' "$markers"
          grep -Fqx 'Target: qualcommax/ipq60xx' output/build-info.txt
          grep -Fqx 'Profile: jdcloud_re-ss-01' output/build-info.txt
          compgen -G 'output/firmware/*sysupgrade.bin' >/dev/null
          (cd output/firmware && sha256sum -c SHA256SUMS.local)
          echo 'SMART_CORE_ARTIFACT_VERIFICATION=PASS' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Analyze build failure
        if: failure()
        continue-on-error: true
        env:
          IMMORTAL_SOURCE_REPO: https://github.com/immortalwrt/immortalwrt.git
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          if [ -s output/logs/feed-error.txt ]; then
            echo "Failure source: Feed Check"
            ./scripts/analyze-error.sh output/logs/feed-check.log output/logs/feed-error.txt
          elif [ -s output/logs/build.log ]; then
            echo "Failure source: Build firmware"
            ./scripts/analyze-error.sh output/logs/build.log
          else
            echo "Failure source: unknown (no non-empty Feed Check or build log)"
            ./scripts/analyze-error.sh
          fi

      - name: Verify automatic repair regression
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hard gate states:
          # BASELINE_FAILURE              = no previous automatic repair to compare
          # FAILED_SAME_ERROR             = previous repair did not remove old root cause
          # OLD_ERROR_CLEARED_NEW_ERROR   = old root cause is gone; current failure is new
          # BLOCKED_PREVIOUS_DIAGNOSTICS_UNAVAILABLE = cannot prove regression result
          bash ./scripts/repair-regression-gate.sh output/logs

      - name: Add failure summary to job
        if: always()
        run: |
          if [ -f output/logs/error-summary.txt ]; then
            {
              echo '## 自动失败诊断摘要'
              cat output/logs/error-summary.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## 自动失败诊断摘要'
              echo 'Failure stage: Unknown'
              echo 'First real error: error-summary.txt 未生成，请下载诊断 Artifact。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f output/logs/repair-regression.json ]; then
            {
              echo
              echo '## 自动修复回归门禁'
              echo '```json'
              cat output/logs/repair-regression.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f output/plugin-verification.txt ]; then
            {
              echo
              echo '## 22 个必选插件最终校验'
              echo '```text'
              cat output/plugin-verification.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinZhaoWrt-diagnostics-${{ github.run_id }}
          path: |
            output/logs/build.log
            output/logs/feed-check.log
            output/logs/feed-error.txt
            output/logs/error-context.txt
            output/logs/error-summary.txt
            output/logs/failure-report.txt
            output/logs/failure-fingerprint.json
            output/logs/repair-regression.json
            output/plugin-verification.txt
            output/openclash-core-verification.txt
            output/full.config
            config/required-plugins.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XinZhaoWrt-Arthur
          path: |
            output/firmware/*
            output/full.config
            output/build-info.txt
            output/required-plugins.txt
            output/plugin-verification.txt
            output/openclash-core-verification.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Candidate GitHub Release
        if: success() && inputs.publish_candidate == true && inputs.validation_build != true
        id: candidate_release
        env:
          GH_TOKEN: ${{ github.token }}
          IMMORTAL_SOURCE_REF: ${{ github.event.inputs.source_ref || 'main' }}
        run: |
          chmod +x scripts/release-candidate.sh
          ./scripts/release-candidate.sh

      - name: Persist Candidate release status
        if: success() && inputs.publish_candidate == true && inputs.validation_build != true
        env:
          CANDIDATE_TAG: ${{ steps.candidate_release.outputs.tag }}
          FIRMWARE_NAME: ${{ steps.candidate_release.outputs.firmware_name }}
          FIRMWARE_SHA256: ${{ steps.candidate_release.outputs.firmware_sha256 }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/update-release-status.sh
          ./scripts/update-release-status.sh "$CANDIDATE_TAG" "$FIRMWARE_NAME" "$FIRMWARE_SHA256"
          git config user.name 'XinZhaoWrt Release Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
          git add production/status.json
          git commit -m "release: record ${CANDIDATE_TAG} candidate publication"
          git pull --rebase origin main
          git push origin HEAD:main
