name: Arthur Recoverable Credential Gate

'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  clear-stale-credential-gate:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prove GitHub credential path and clear only stale credential gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          $stateDir = Join-Path $root 'state'
          $controlRoot = Join-Path $root 'control-runtime'
          $statePath = Join-Path $stateDir 'runtime-state.json'
          $runtimeStatusPath = Join-Path $stateDir 'runtime-status.json'
          $supervisorStatePath = Join-Path $stateDir 'supervisor-state.json'
          $supervisorStatusPath = Join-Path $stateDir 'supervisor-status.json'
          $supervisorTaskName = 'XinZhaoWrt-Arthur-Persistent-Supervisor'
          $headlessPython = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $statePath -PathType Leaf)) {
            throw "RUNTIME_STATE_MISSING=$statePath"
          }
          if (-not (Test-Path -LiteralPath $controlRoot -PathType Container)) {
            throw "CONTROL_RUNTIME_MISSING=$controlRoot"
          }

          $probe = (& gh api "repos/$env:GITHUB_REPOSITORY" --jq '.full_name' 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $probe -ne $env:GITHUB_REPOSITORY) {
            throw "GITHUB_CREDENTIAL_PROBE_FAILED=$probe"
          }
          Write-Host "GITHUB_CREDENTIAL_PROBE=PASS repository=$probe"

          function Invoke-ControlPlaneWakeup {
            $delays = @(2,5,10)
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              $oldPreference = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              try {
                $dispatch = (& gh workflow run production-agent-deploy.yml --repo $env:GITHUB_REPOSITORY --ref main 2>&1 | Out-String).Trim()
                $dispatchCode = $LASTEXITCODE
              }
              finally {
                $ErrorActionPreference = $oldPreference
              }
              if ($dispatchCode -eq 0) {
                Write-Host "CONTROL_PLANE_WAKEUP_DISPATCHED=PASS workflow=production-agent-deploy.yml ref=main attempt=$attempt"
                return
              }
              if ($attempt -lt 4) {
                $delay = $delays[[Math]::Min($attempt - 1,$delays.Count - 1)]
                Write-Warning "CONTROL_PLANE_WAKEUP_DISPATCH_RETRY attempt=$attempt exit=$dispatchCode delay_seconds=$delay detail=$dispatch"
                Start-Sleep -Seconds $delay
              }
            }
            throw "CONTROL_PLANE_WAKEUP_DISPATCH_FAILED attempts=4 detail=$dispatch"
          }

          function Read-JsonSafe([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return $null }
            try { return Get-Content -Raw -LiteralPath $Path | ConvertFrom-Json } catch { return $null }
          }

          function Stop-StaleCredentialRuntime {
            $pids = New-Object System.Collections.Generic.HashSet[int]
            foreach ($payload in @(
              (Read-JsonSafe $supervisorStatusPath),
              (Read-JsonSafe $supervisorStatePath),
              (Read-JsonSafe $runtimeStatusPath)
            )) {
              if ($null -eq $payload) { continue }
              foreach ($name in @('supervisor_pid','child_pid','daemon_pid','pid')) {
                $property = $payload.PSObject.Properties[$name]
                if ($null -eq $property) { continue }
                $candidate = 0
                if ([int]::TryParse([string]$property.Value,[ref]$candidate) -and $candidate -gt 0 -and $candidate -ne $PID) {
                  [void]$pids.Add($candidate)
                }
              }
            }
            if ($state.PSObject.Properties['observability'] -and $state.observability -and $state.observability.PSObject.Properties['pid']) {
              $candidate = 0
              if ([int]::TryParse([string]$state.observability.pid,[ref]$candidate) -and $candidate -gt 0 -and $candidate -ne $PID) {
                [void]$pids.Add($candidate)
              }
            }

            if (Get-Command Stop-ScheduledTask -ErrorAction SilentlyContinue) {
              try { Stop-ScheduledTask -TaskName $supervisorTaskName -ErrorAction SilentlyContinue } catch {}
            }
            if (Get-Command Get-CimInstance -ErrorAction SilentlyContinue) {
              foreach ($process in @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue)) {
                $command = [string]$process.CommandLine
                if ([string]::IsNullOrWhiteSpace($command)) { continue }
                if (
                  $command.IndexOf($stateDir,[System.StringComparison]::OrdinalIgnoreCase) -ge 0 -and
                  ($command -match 'run-supervisor\.py|ai_orchestrator')
                ) {
                  $candidate = [int]$process.ProcessId
                  if ($candidate -gt 0 -and $candidate -ne $PID) { [void]$pids.Add($candidate) }
                }
              }
            }

            foreach ($processId in @($pids)) {
              Stop-Process -Id $processId -Force -ErrorAction SilentlyContinue
            }
            $deadline = (Get-Date).AddSeconds(12)
            do {
              $alive = @($pids | Where-Object { Get-Process -Id $_ -ErrorAction SilentlyContinue })
              if ($alive.Count -eq 0) { break }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            if ($alive.Count -gt 0) {
              throw "STALE_CREDENTIAL_RUNTIME_STOP_TIMEOUT pids=$($alive -join ',')"
            }
            Write-Host "RECOVERABLE_CREDENTIAL_STALE_RUNTIME_STOPPED=PASS pids=$(@($pids) -join ',')"
          }

          function Start-PersistentSupervisor {
            $helper = Join-Path $controlRoot 'scripts\ensure-arthur-persistent-supervisor.ps1'
            if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
              throw "PERSISTENT_SUPERVISOR_HELPER_MISSING=$helper"
            }
            if (-not (Test-Path -LiteralPath $headlessPython -PathType Leaf)) {
              throw "HEADLESS_PYTHON_MISSING=$headlessPython"
            }
            $oldPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $startOutput = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $helper -StateDir $stateDir -ControlRoot $controlRoot -HeadlessPythonExe $headlessPython 2>&1 | Out-String).Trim()
              $startCode = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $oldPreference
            }
            if ($startOutput) { Write-Host $startOutput }
            if ($startCode -ne 0) {
              throw "PERSISTENT_SUPERVISOR_RESTART_FAILED exit=$startCode"
            }
            Write-Host 'PERSISTENT_SUPERVISOR_RESTART_AFTER_CREDENTIAL_GATE=PASS'
          }

          $state = Get-Content -Raw -LiteralPath $statePath | ConvertFrom-Json
          $releaseModePath = Join-Path $controlRoot 'production\release-mode.json'
          $operatorIntentPath = Join-Path $controlRoot 'production\operator-intent.json'
          $releaseModeState = Read-JsonSafe $releaseModePath
          $operatorIntent = Read-JsonSafe $operatorIntentPath
          if ($null -eq $releaseModeState -or [string]$releaseModeState.mode -ne 'RELEASE_ONLY' -or [bool]$releaseModeState.automatic_flash) {
            throw 'RECOVERABLE_CREDENTIAL_GATE_REQUIRES_RELEASE_ONLY'
          }
          if (
            $null -eq $operatorIntent -or
            [string]$operatorIntent.intent_type -ne 'EXECUTE_FIRMWARE' -or
            [string]$operatorIntent.authorization_scope -ne 'FIRMWARE_RELEASE' -or
            $operatorIntent.firmware_execution_authorized -ne $true
          ) {
            throw 'RECOVERABLE_CREDENTIAL_GATE_FIRMWARE_AUTHORIZATION_MISSING'
          }
          $protectedPhases = @('FLASH','WAIT_DEVICE','AUTO_FLASH_SAFETY_GATE','RELEASE_GATE','RELEASE')
          if ($protectedPhases -contains ([string]$state.phase).ToUpperInvariant()) {
            throw "RECOVERABLE_CREDENTIAL_GATE_PROTECTED_PHASE=$($state.phase)"
          }
          $observedGates = @()
          foreach ($name in @('human_gate','humanGate','pending_human_gate','pendingHumanGate')) {
            $property = $state.PSObject.Properties[$name]
            if ($null -eq $property) { continue }
            $value = [string]$property.Value
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              $observedGates += "$name=$value"
            }
          }
          Write-Host "RECOVERABLE_CREDENTIAL_GATE_OBSERVED phase=$($state.phase) gates=$(if ($observedGates.Count) { $observedGates -join ',' } else { 'NONE' })"
          $cleared = @()
          foreach ($name in @('human_gate','humanGate','pending_human_gate','pendingHumanGate')) {
            $property = $state.PSObject.Properties[$name]
            if ($null -eq $property) { continue }
            $value = [string]$property.Value
            if ([string]::IsNullOrWhiteSpace($value)) { continue }
            if ($value -ne 'NEW_CREDENTIAL_PROVISIONING') {
              throw "NON_RECOVERABLE_HUMAN_GATE_PRESERVED name=$name value=$value"
            }
            $property.Value = $null
            $cleared += $name
          }

          if ($cleared.Count -eq 0) {
            Write-Host "RECOVERABLE_CREDENTIAL_GATE=ALREADY_CLEAR phase=$($state.phase)"
            Invoke-ControlPlaneWakeup
            exit 0
          }

          # Stop the old in-memory runtime before persisting the cleared gate.
          # Otherwise its watchdog can write NEW_CREDENTIAL_PROVISIONING back
          # after this workflow has safely removed it.
          Stop-StaleCredentialRuntime

          if ($state.PSObject.Properties['terminal_state'] -and [string]$state.terminal_state -eq 'SAFETY_BLOCKED') {
            # Only the credential-provisioning block is being cleared. Do not clear
            # any unrelated terminal state or any flash safety gate.
            $state.terminal_state = ''
            $cleared += 'terminal_state:SAFETY_BLOCKED'
          }
          if ($state.PSObject.Properties['next_action'] -and [string]::IsNullOrWhiteSpace([string]$state.next_action)) {
            $state.next_action = [string]$state.phase
          }

          $stamp = [ordered]@{
            type = 'RECOVERABLE_GITHUB_CREDENTIAL_GATE_CLEARED'
            observed_at = [DateTimeOffset]::UtcNow.ToString('o')
            repository = $env:GITHUB_REPOSITORY
            phase_preserved = [string]$state.phase
            fields = @($cleared)
            proof = 'gh api repository probe PASS on the production runner identity'
          }
          if ($state.PSObject.Properties['observability'] -and $state.observability) {
            $state.observability | Add-Member -NotePropertyName credential_gate_recovery -NotePropertyValue ([pscustomobject]$stamp) -Force
          }
          else {
            $state | Add-Member -NotePropertyName observability -NotePropertyValue ([pscustomobject]@{ credential_gate_recovery = [pscustomobject]$stamp }) -Force
          }

          $tmp = "$statePath.$PID.tmp"
          $json = $state | ConvertTo-Json -Depth 30
          [IO.File]::WriteAllText($tmp,$json + [Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          Move-Item -LiteralPath $tmp -Destination $statePath -Force
          Write-Host "RECOVERABLE_CREDENTIAL_GATE=CLEARED phase_preserved=$($state.phase) fields=$($cleared -join ',')"
          Write-Host 'FLASH_SAFETY_GATES_BYPASSED=false'
          Start-PersistentSupervisor
          Invoke-ControlPlaneWakeup
