name: Arthur Control Plane

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional Arthur source branch for a manual recovery run; leave empty to use the current branch'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: arthur-control-plane
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  control-plane:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout current control-plane source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}

      - name: Reconcile and resume Arthur checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\arthur-control-plane.ps1'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "CONTROL_PLANE_INSTALL_FAILED: missing $script"
          }
          & $script -Repository $env:GITHUB_REPOSITORY -WorkflowRunId $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish control-plane summary
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane'
          "## Arthur Control Plane" >> $env:GITHUB_STEP_SUMMARY
          "- Runner: $(whoami)" >> $env:GITHUB_STEP_SUMMARY
          "- Canonical root: ``$root``" >> $env:GITHUB_STEP_SUMMARY
          $heartbeat = Join-Path $root 'heartbeat.json'
          if (Test-Path -LiteralPath $heartbeat) {
            $h = Get-Content -Raw -LiteralPath $heartbeat
            "- Heartbeat: ``$h``" >> $env:GITHUB_STEP_SUMMARY
          }
          $runtimeState = Join-Path $root 'state\runtime-state.json'
          if (Test-Path -LiteralPath $runtimeState) {
            $runtime = Get-Content -Raw -LiteralPath $runtimeState | ConvertFrom-Json
            "- Runtime phase: ``$($runtime.phase)``" >> $env:GITHUB_STEP_SUMMARY
            "- Runtime turn count: ``$($runtime.turn_count)``" >> $env:GITHUB_STEP_SUMMARY
          }
