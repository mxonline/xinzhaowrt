name: Arthur Known-Good Update v3 Auto Trigger

'on':
  push:
    branches:
      - main
    paths:
      - 'production/v3-request.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-v3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout request
        uses: actions/checkout@v4

      - name: Validate request and dispatch v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          REQUEST='production/v3-request.json'
          [[ -s "$REQUEST" ]] || {
            echo 'BLOCKED: production/v3-request.json is missing or empty.'
            exit 1
          }

          mapfile -t REQUEST_VALUES < <(python3 - <<'PY'
          import json
          with open('production/v3-request.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          mode = data.get('mode')
          allowed = {
              'rebuild_known_good',
              'update_immortalwrt',
              'update_feeds',
              'update_plugins',
              'update_all',
          }
          if mode not in allowed:
              raise SystemExit(f'BLOCKED: unsupported v3 mode: {mode!r}')
          request_id = data.get('request_id') or ''
          if not request_id:
              raise SystemExit('BLOCKED: request_id is required')
          evidence_run_id = str(data.get('prebuild_evidence_run_id') or '')
          if not evidence_run_id.isdigit():
              raise SystemExit('BLOCKED: prebuild_evidence_run_id must be a numeric completed live-validation run ID')
          evidence_artifact = data.get('prebuild_evidence_artifact_name') or ''
          if not isinstance(evidence_artifact, str) or not evidence_artifact:
              raise SystemExit('BLOCKED: prebuild_evidence_artifact_name is required')
          print(mode)
          print(evidence_run_id)
          print(evidence_artifact)
          PY
          )
          [[ "${#REQUEST_VALUES[@]}" -eq 3 ]] || { echo 'BLOCKED: malformed v3 request'; exit 1; }
          MODE="${REQUEST_VALUES[0]}"
          PREBUILD_EVIDENCE_RUN_ID="${REQUEST_VALUES[1]}"
          PREBUILD_EVIDENCE_ARTIFACT="${REQUEST_VALUES[2]}"

          echo "Dispatching Arthur Known-Good Update v3 with mode=$MODE and exact-source evidence run=$PREBUILD_EVIDENCE_RUN_ID"
          gh workflow run arthur-update-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f mode="$MODE" \
            -f prebuild_evidence_run_id="$PREBUILD_EVIDENCE_RUN_ID" \
            -f prebuild_evidence_artifact_name="$PREBUILD_EVIDENCE_ARTIFACT"

          {
            echo '## Arthur v3 auto trigger'
            echo
            echo "- Request commit: \`${GITHUB_SHA}\`"
            echo "- Mode: \`${MODE}\`"
            echo "- Exact-source evidence run: \`${PREBUILD_EVIDENCE_RUN_ID}\`"
            echo "- Evidence artifact: \`${PREBUILD_EVIDENCE_ARTIFACT}\`"
            echo '- Dispatched workflow: `Arthur Known-Good Update v3`'
          } >> "$GITHUB_STEP_SUMMARY"
