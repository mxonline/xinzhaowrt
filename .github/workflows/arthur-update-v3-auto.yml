name: Arthur Known-Good Update v3 Auto Trigger

'on':
  push:
    branches:
      - main
    paths:
      - 'production/v3-request.json'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-v3:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout request and source-impact gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate request, deduplicate and dispatch v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x scripts/*.sh
          REQUEST='production/v3-request.json'
          [[ -s "$REQUEST" ]] || { echo 'BLOCKED: production/v3-request.json is missing or empty.'; exit 1; }

          mapfile -t REQUEST_VALUES < <(python3 - <<'PY'
          import json, re
          with open('production/v3-request.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          mode = data.get('mode')
          allowed = {'rebuild_known_good','update_immortalwrt','update_feeds','update_plugins','update_all'}
          if mode not in allowed:
              raise SystemExit(f'BLOCKED: unsupported v3 mode: {mode!r}')
          request_id = str(data.get('request_id') or '')
          if not re.fullmatch(r'[A-Za-z0-9._-]{8,160}', request_id):
              raise SystemExit('BLOCKED: request_id is missing or unsafe')
          source_ref = str(data.get('source_ref') or 'main')
          if not re.fullmatch(r'[A-Za-z0-9._/-]{1,180}', source_ref) or '..' in source_ref:
              raise SystemExit('BLOCKED: source_ref is unsafe')
          source_sha = str(data.get('source_sha') or '')
          if source_sha and not re.fullmatch(r'[0-9a-f]{40}', source_sha):
              raise SystemExit('BLOCKED: source_sha must be a full lowercase SHA-1')
          print(mode); print(request_id); print(source_ref); print(source_sha)
          PY
          )

          MODE="${REQUEST_VALUES[0]}"
          REQUEST_ID="${REQUEST_VALUES[1]}"
          SOURCE_REF="${REQUEST_VALUES[2]}"
          SOURCE_SHA="${REQUEST_VALUES[3]}"
          RESOLVED_SHA="$(git rev-parse HEAD)"

          if [[ "$SOURCE_REF" != 'main' ]]; then
            RESOLVED_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_REF" --jq '.object.sha')"
            [[ "$RESOLVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: source_ref did not resolve to commit: $SOURCE_REF"; exit 1; }
            if [[ -n "$SOURCE_SHA" && "$RESOLVED_SHA" != "$SOURCE_SHA" ]]; then
              echo "BLOCKED: source_ref SHA mismatch expected=$SOURCE_SHA actual=$RESOLVED_SHA"; exit 1
            fi
            git fetch --quiet origin "$RESOLVED_SHA" || true
          elif [[ -n "$SOURCE_SHA" ]]; then
            [[ "$RESOLVED_SHA" == "$SOURCE_SHA" ]] || { echo "BLOCKED: main source SHA mismatch expected=$SOURCE_SHA actual=$RESOLVED_SHA"; exit 1; }
          fi

          DEDUP_OUTPUT="$(./scripts/resolve-candidate-dedup.sh "$GITHUB_REPOSITORY" arthur-update-v3.yml "$RESOLVED_SHA")"
          echo "$DEDUP_OUTPUT"
          ACTION="$(printf '%s\n' "$DEDUP_OUTPUT" | sed -n 's/^ACTION=//p' | head -n1)"
          EXISTING_RUN="$(printf '%s\n' "$DEDUP_OUTPUT" | sed -n 's/^RUN_ID=//p' | head -n1)"
          FINGERPRINT="$(printf '%s\n' "$DEDUP_OUTPUT" | sed -n 's/^BUILD_FINGERPRINT=//p' | head -n1)"

          case "$ACTION" in
            WATCH_EXISTING_RUN)
              echo "V3_AUTO_TRIGGER=WATCH_EXISTING_RUN run_id=$EXISTING_RUN request_id=$REQUEST_ID fingerprint=$FINGERPRINT"
              echo "V3_AUTO_TRIGGER_ALREADY_DISPATCHED=YES run_id=$EXISTING_RUN request_id=$REQUEST_ID source_ref=$SOURCE_REF"
              exit 0
              ;;
            REUSE_ARTIFACT)
              echo "V3_AUTO_TRIGGER=REUSE_ARTIFACT run_id=$EXISTING_RUN request_id=$REQUEST_ID fingerprint=$FINGERPRINT"
              echo "V3_AUTO_TRIGGER_ALREADY_DISPATCHED=YES run_id=$EXISTING_RUN request_id=$REQUEST_ID source_ref=$SOURCE_REF"
              exit 0
              ;;
            NO_NEW_CANDIDATE)
              echo "V3_AUTO_TRIGGER=NO_NEW_CANDIDATE request_id=$REQUEST_ID fingerprint=$FINGERPRINT"
              exit 0
              ;;
            NEW_CANDIDATE) ;;
            *) echo "BLOCKED: unsupported dedup action: $ACTION"; exit 1 ;;
          esac

          echo "Dispatching Arthur Known-Good Update v3 mode=$MODE request_id=$REQUEST_ID source_ref=$SOURCE_REF fingerprint=$FINGERPRINT"
          gh workflow run arthur-update-v3.yml --repo "$GITHUB_REPOSITORY" --ref "$SOURCE_REF" -f mode="$MODE"

          CONFIRMED_RUN=''
          for _ in $(seq 1 24); do
            RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow arthur-update-v3.yml --event workflow_dispatch --limit 100 --json databaseId,headBranch,headSha,status,conclusion)"
            CONFIRMED_RUN="$(RUNS_JSON="$RUNS_JSON" SOURCE_REF="$SOURCE_REF" SOURCE_SHA="$RESOLVED_SHA" python3 - <<'PY'
          import json, os
          runs=json.loads(os.environ.get('RUNS_JSON') or '[]')
          ref=os.environ['SOURCE_REF']; sha=os.environ['SOURCE_SHA']
          matches=[r for r in runs if str(r.get('headSha') or '') == sha and (ref == 'main' or str(r.get('headBranch') or '') == ref)]
          matches.sort(key=lambda r: int(r.get('databaseId') or 0), reverse=True)
          print(matches[0].get('databaseId') if matches else '')
          PY
            )"
            [[ -n "$CONFIRMED_RUN" ]] && break
            sleep 5
          done
          [[ -n "$CONFIRMED_RUN" ]] || { echo 'V3_AUTO_TRIGGER_DISPATCH_ACK_TIMEOUT'; exit 1; }
          echo "V3_AUTO_TRIGGER_DISPATCHED=YES run_id=$CONFIRMED_RUN request_id=$REQUEST_ID source_ref=$SOURCE_REF fingerprint=$FINGERPRINT"

          {
            echo '## Arthur v3 auto trigger'; echo
            echo "- Request commit: \`${GITHUB_SHA}\`"
            echo "- Request ID: \`${REQUEST_ID}\`"
            echo "- Mode: \`${MODE}\`"
            echo "- Source ref: \`${SOURCE_REF}\`"
            echo "- Build fingerprint: \`${FINGERPRINT}\`"
            echo '- Candidate policy: same fingerprint watches/reuses existing run; new Candidate requires firmware-impact input change.'
          } >> "$GITHUB_STEP_SUMMARY"
