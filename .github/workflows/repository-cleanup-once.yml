name: Arthur Repository Cleanup Once

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repository-cleanup-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Prune obsolete merged branches and duplicate draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          echo "VERIFY_CURRENT_RELEASES"
          gh release view 'arthur-production-36764137044' --repo "$REPO" >/dev/null
          gh release view 'arthur-update-36764137044' --repo "$REPO" >/dev/null
          gh release view 'arthur-production-36348777394' --repo "$REPO" >/dev/null

          draft_id=400853939
          if gh api "repos/$REPO/releases/$draft_id" >/tmp/draft.json 2>/dev/null; then
            is_draft="$(jq -r '.draft' /tmp/draft.json)"
            tag="$(jq -r '.tag_name' /tmp/draft.json)"
            if [[ "$is_draft" != "true" || "$tag" != "arthur-update-36764137044" ]]; then
              echo "BLOCKED: release $draft_id no longer matches the approved duplicate draft"
              exit 1
            fi
            gh api -X DELETE "repos/$REPO/releases/$draft_id"
            echo "DUPLICATE_DRAFT_RELEASE_DELETED=PASS id=$draft_id"
          else
            echo "DUPLICATE_DRAFT_RELEASE_ALREADY_ABSENT=PASS id=$draft_id"
          fi

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          preserve_regex='^(main|codex/arthur-v015-software-source-repair|codex/arthur-smart-build-20260928)$'
          explicit_obsolete_regex='^(codex/arthur-repair-candidate-20260920|ops/cancel-stale-arthur-builds|ops/reuse-candidate-33622163574|ops/stop-reuse-candidate|tmp-noop|tmp-noop-should-not-use|tmp-verify-artifact-lock-20260907)$'

          deleted=0
          skipped_unique=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == "HEAD" ]] && continue
            if [[ "$branch" =~ $preserve_regex ]]; then
              echo "PRESERVE_BRANCH $branch"
              continue
            fi

            delete_reason=""
            if [[ "$branch" =~ $explicit_obsolete_regex ]]; then
              delete_reason="explicit-obsolete"
            elif git merge-base --is-ancestor "$ref" origin/main; then
              delete_reason="fully-merged"
            fi

            if [[ -n "$delete_reason" ]]; then
              echo "DELETE_BRANCH $branch reason=$delete_reason"
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
              deleted=$((deleted+1))
            else
              echo "KEEP_UNMERGED_BRANCH $branch"
              skipped_unique=$((skipped_unique+1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          gh release view 'arthur-production-36764137044' --repo "$REPO" >/dev/null
          gh release view 'arthur-update-36764137044' --repo "$REPO" >/dev/null
          gh release view 'arthur-production-36348777394' --repo "$REPO" >/dev/null

          echo "BRANCH_CLEANUP_DELETED=$deleted"
          echo "UNMERGED_BRANCHES_PRESERVED=$skipped_unique"
          echo "CURRENT_STABLE_PRESERVED=PASS"
          echo "CURRENT_CANDIDATE_PRESERVED=PASS"
          echo "ROLLBACK_STABLE_PRESERVED=PASS"
          echo "REPOSITORY_CLEANUP_ONCE=PASS"
