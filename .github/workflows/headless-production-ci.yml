name: Headless Production Persistence CI

'on':
  pull_request:
    branches:
      - codex/arthur-fast-candidate
    paths:
      - 'ai_orchestrator/**'
      - 'scripts/*headless-production*.ps1'
      - 'tests/headless-production-deploy.tests.ps1'
      - '.github/workflows/headless-production-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify unattended production contract
        shell: powershell
        run: ./tests/headless-production-deploy.tests.ps1

      - name: Run headless runtime unit tests
        shell: powershell
        run: py -3 -m unittest tests.test_headless_state tests.test_headless_policy tests.test_headless_runtime tests.test_headless_cli -v
