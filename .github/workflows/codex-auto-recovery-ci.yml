name: Arthur Codex Auto-Recovery CI

on:
  push:
    branches:
      - codex/arthur-codex-auto-recovery
    paths:
      - 'ai_orchestrator/**'
      - 'tests/test_codex_auto_recovery.py'
      - '.github/workflows/codex-auto-recovery-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ai_orchestrator/**'
      - 'tests/test_codex_auto_recovery.py'
      - '.github/workflows/codex-auto-recovery-ci.yml'

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run controlled session-loss and recovery tests
        run: python3 -m unittest -v tests.test_codex_auto_recovery
