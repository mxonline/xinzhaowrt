name: Arthur Windows Task Visibility Diagnostic

on:
  push:
    branches:
      - diag/arthur-windows-task-visibility-20260906
    paths:
      - .github/workflows/arthur-windows-task-visibility-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5

    steps:
      - name: Read-only principal and Codex evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-StrictMode -Version Latest
          Write-Host ("DIAG_IDENTITY={0}" -f (whoami))
          Write-Host ("DIAG_MACHINE={0}" -f $env:COMPUTERNAME)

          Write-Host '=== VISIBLE XINZHAOWRT TASK PRINCIPALS ==='
          try {
            $tasks = @(Get-ScheduledTask -ErrorAction Stop | Where-Object { $_.TaskName -like 'XinZhaoWrt*' })
            foreach ($task in $tasks) {
              Write-Host ("TASK={0}:STATE={1}:USER={2}:LOGON={3}:RUNLEVEL={4}" -f `
                $task.TaskName,[string]$task.State,[string]$task.Principal.UserId,[string]$task.Principal.LogonType,[string]$task.Principal.RunLevel)
            }
          }
          catch {
            Write-Host ("VISIBLE_TASK_ENUM_ERROR={0}" -f $_.Exception.Message)
          }

          Write-Host '=== RESTRICTED SUPERVISOR CONFIRMATION ==='
          $supervisorTask = 'XinZhaoWrt-Arthur-Persistent-Supervisor'
          try {
            $task = Get-ScheduledTask -TaskName $supervisorTask -ErrorAction Stop
            Write-Host ("SUPERVISOR_TASK_VISIBLE=YES:USER={0}:LOGON={1}" -f [string]$task.Principal.UserId,[string]$task.Principal.LogonType)
          }
          catch {
            Write-Host ("SUPERVISOR_TASK_VISIBLE=NO:{0}" -f $_.Exception.Message)
          }
          $xml = & schtasks.exe /Query /TN $supervisorTask /XML 2>&1
          $schCode = $LASTEXITCODE
          Write-Host ("SUPERVISOR_SCHTASKS_EXIT={0}" -f $schCode)
          $xml | ForEach-Object { Write-Host ([string]$_) }

          Write-Host '=== RUNNER-SERVICE CODEX PROBE ==='
          $controlRoot = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane\control-runtime'
          $pythonExe = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe'
          $probe = Join-Path $controlRoot 'scripts\arthur-codex-runtime-probe.py'
          Write-Host ("CODEX_PROBE_CONTROL_ROOT_EXISTS={0}" -f (Test-Path -LiteralPath $controlRoot -PathType Container))
          Write-Host ("CODEX_PROBE_PYTHON_EXISTS={0}" -f (Test-Path -LiteralPath $pythonExe -PathType Leaf))
          Write-Host ("CODEX_PROBE_SCRIPT_EXISTS={0}" -f (Test-Path -LiteralPath $probe -PathType Leaf))
          if ((Test-Path -LiteralPath $pythonExe -PathType Leaf) -and (Test-Path -LiteralPath $probe -PathType Leaf)) {
            $oldRoot = $env:ARTHUR_CONTROL_PLANE_CODE_ROOT
            $oldModel = $env:HEADLESS_CODEX_MODEL
            $oldBytecode = $env:PYTHONDONTWRITEBYTECODE
            try {
              $env:ARTHUR_CONTROL_PLANE_CODE_ROOT = $controlRoot
              $env:HEADLESS_CODEX_MODEL = 'gpt-5.6-terra'
              $env:PYTHONDONTWRITEBYTECODE = '1'
              $raw = (& $pythonExe $probe 2>&1 | Out-String).Trim()
              $probeExit = $LASTEXITCODE
              Write-Host ("CODEX_PROBE_EXIT={0}" -f $probeExit)
              try {
                $payload = $raw | ConvertFrom-Json
                Write-Host ("CODEX_PROBE_EXIT_CLASS={0}" -f [string]$payload.exit_class)
                Write-Host ("CODEX_PROBE_ACCOUNT_PREFLIGHT_OK={0}" -f [string]$payload.account_preflight_ok)
                Write-Host ("CODEX_PROBE_MODEL_CATALOG_SKIPPED={0}" -f [string]$payload.model_catalog_skipped)
                Write-Host ("CODEX_PROBE_EFFECTIVE_MODEL={0}" -f [string]$payload.effective_model)
                Write-Host ("CODEX_PROBE_MODULE={0}" -f [string]$payload.ai_orchestrator_file)
              }
              catch {
                Write-Host ("CODEX_PROBE_JSON_ERROR={0}" -f $_.Exception.Message)
                Write-Host 'CODEX_PROBE_RAW_BEGIN'
                Write-Host $raw
                Write-Host 'CODEX_PROBE_RAW_END'
              }
            }
            finally {
              $env:ARTHUR_CONTROL_PLANE_CODE_ROOT = $oldRoot
              $env:HEADLESS_CODEX_MODEL = $oldModel
              $env:PYTHONDONTWRITEBYTECODE = $oldBytecode
            }
          }

          Write-Host '=== CURRENT RUNTIME PROCESS VISIBILITY ==='
          $stateDir = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\ControlPlane\state'
          try {
            foreach ($process in @(Get-CimInstance Win32_Process -ErrorAction Stop)) {
              $command = [string]$process.CommandLine
              if ([string]::IsNullOrWhiteSpace($command)) { continue }
              if ($command.IndexOf($stateDir,[StringComparison]::OrdinalIgnoreCase) -lt 0) { continue }
              if ($command -notmatch 'run-supervisor\.py|ai_orchestrator') { continue }
              $ownerText = 'UNAVAILABLE'
              try {
                $owner = Invoke-CimMethod -InputObject $process -MethodName GetOwner -ErrorAction Stop
                $ownerText = ("RETURN={0};DOMAIN={1};USER={2}" -f $owner.ReturnValue,[string]$owner.Domain,[string]$owner.User)
              }
              catch { $ownerText = ("ERROR={0}" -f $_.Exception.Message) }
              Write-Host ("RUNTIME_PROCESS_PID={0}:SESSION={1}:OWNER={2}:COMMAND={3}" -f $process.ProcessId,$process.SessionId,$ownerText,$command)
            }
          }
          catch {
            Write-Host ("RUNTIME_PROCESS_ENUM_ERROR={0}" -f $_.Exception.Message)
          }

          Write-Host 'RUNNER_CODEX_PRINCIPAL_DIAGNOSTIC=PASS'
          exit 0
