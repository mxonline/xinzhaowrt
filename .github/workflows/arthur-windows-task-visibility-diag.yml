name: Arthur Windows Task Visibility Diagnostic

on:
  push:
    branches:
      - diag/arthur-windows-task-visibility-20260906
    paths:
      - .github/workflows/arthur-windows-task-visibility-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5

    steps:
      - name: Read Task Scheduler failure evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Set-StrictMode -Version Latest
          $taskName = 'XinZhaoWrt-Arthur-S4U-Probe-Test'
          Write-Host ("DIAG_IDENTITY={0}" -f (whoami))
          Write-Host ("DIAG_MACHINE={0}" -f $env:COMPUTERNAME)
          Write-Host '=== ACCOUNT SID / GROUPS / TOKEN PRIVILEGES ==='
          & whoami.exe /user | ForEach-Object { Write-Host ([string]$_) }
          & whoami.exe /groups | ForEach-Object { Write-Host ([string]$_) }
          & whoami.exe /priv | ForEach-Object { Write-Host ([string]$_) }

          Write-Host '=== LOCAL USER RIGHTS ==='
          $cfg = Join-Path $env:RUNNER_TEMP 'arthur-user-rights.cfg'
          Remove-Item -LiteralPath $cfg -Force -ErrorAction SilentlyContinue
          & secedit.exe /export /cfg $cfg /areas USER_RIGHTS 2>&1 | ForEach-Object { Write-Host ([string]$_) }
          Write-Host ("SECEDIT_EXIT={0}" -f $LASTEXITCODE)
          if (Test-Path -LiteralPath $cfg -PathType Leaf) {
            foreach ($line in Get-Content -LiteralPath $cfg -ErrorAction SilentlyContinue) {
              if ($line -match '^SeBatchLogonRight\s*=|^SeDenyBatchLogonRight\s*=|^SeServiceLogonRight\s*=|^SeDenyServiceLogonRight\s*=') {
                Write-Host ("USER_RIGHT={0}" -f $line)
              }
            }
          }

          Write-Host '=== TASK SCHEDULER OPERATIONAL CHANNEL ==='
          & wevtutil.exe gl 'Microsoft-Windows-TaskScheduler/Operational' 2>&1 | ForEach-Object { Write-Host ([string]$_) }
          Write-Host ("WEVTUTIL_GL_EXIT={0}" -f $LASTEXITCODE)

          Write-Host '=== TASK-SPECIFIC EVENTS LAST 6 HOURS ==='
          try {
            $events = @(Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-TaskScheduler/Operational'; StartTime=(Get-Date).AddHours(-6)} -ErrorAction Stop |
              Where-Object { ([string]$_.Message).IndexOf($taskName,[StringComparison]::OrdinalIgnoreCase) -ge 0 } |
              Select-Object -First 80)
            Write-Host ("TASK_EVENT_COUNT={0}" -f $events.Count)
            foreach ($event in $events) {
              $msg = ([string]$event.Message).Replace("`r",' ').Replace("`n",' ')
              Write-Host ("TASK_EVENT_TIME={0:o}:ID={1}:LEVEL={2}:PROVIDER={3}:MESSAGE={4}" -f $event.TimeCreated,$event.Id,$event.LevelDisplayName,$event.ProviderName,$msg)
            }
          }
          catch {
            Write-Host ("TASK_EVENT_QUERY_ERROR={0}" -f $_.Exception.Message)
          }

          Write-Host '=== TASK SCHEDULER ADMIN EVENTS LAST 6 HOURS ==='
          foreach ($logName in @('Microsoft-Windows-TaskScheduler/Maintenance','System')) {
            try {
              $events = @(Get-WinEvent -FilterHashtable @{LogName=$logName; StartTime=(Get-Date).AddHours(-6)} -ErrorAction Stop |
                Where-Object { ([string]$_.Message).IndexOf($taskName,[StringComparison]::OrdinalIgnoreCase) -ge 0 -or ([string]$_.ProviderName).IndexOf('TaskScheduler',[StringComparison]::OrdinalIgnoreCase) -ge 0 } |
                Select-Object -First 40)
              Write-Host ("LOG={0}:EVENT_COUNT={1}" -f $logName,$events.Count)
              foreach ($event in $events) {
                $msg = ([string]$event.Message).Replace("`r",' ').Replace("`n",' ')
                Write-Host ("EVENT_TIME={0:o}:ID={1}:LEVEL={2}:PROVIDER={3}:MESSAGE={4}" -f $event.TimeCreated,$event.Id,$event.LevelDisplayName,$event.ProviderName,$msg)
              }
            }
            catch {
              Write-Host ("LOG_QUERY_ERROR={0}:{1}" -f $logName,$_.Exception.Message)
            }
          }

          Write-Host 'TASK_SCHEDULER_CAUSE_DIAGNOSTIC=PASS'
          exit 0
