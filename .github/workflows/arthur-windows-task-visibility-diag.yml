name: Arthur Windows Task Visibility Diagnostic

on:
  push:
    branches:
      - diag/arthur-windows-task-visibility-20260906
    paths:
      - .github/workflows/arthur-windows-task-visibility-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5

    steps:
      - name: Read LSA status codes for runner rights
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Write-Host ("DIAG_IDENTITY={0}" -f (whoami))
          $source = @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          public static class ArthurLsaProbe {
              [StructLayout(LayoutKind.Sequential)] struct LSA_OBJECT_ATTRIBUTES { public int Length; public IntPtr RootDirectory; public IntPtr ObjectName; public uint Attributes; public IntPtr SecurityDescriptor; public IntPtr SecurityQualityOfService; }
              [StructLayout(LayoutKind.Sequential)] struct LSA_UNICODE_STRING { public ushort Length; public ushort MaximumLength; public IntPtr Buffer; }
              const uint POLICY_LOOKUP_NAMES = 0x00000800;
              [DllImport("advapi32.dll")] static extern uint LsaOpenPolicy(IntPtr SystemName, ref LSA_OBJECT_ATTRIBUTES ObjectAttributes, uint DesiredAccess, out IntPtr PolicyHandle);
              [DllImport("advapi32.dll")] static extern uint LsaEnumerateAccountRights(IntPtr PolicyHandle, IntPtr AccountSid, out IntPtr UserRights, out uint CountOfRights);
              [DllImport("advapi32.dll")] static extern uint LsaNtStatusToWinError(uint Status);
              [DllImport("advapi32.dll")] static extern uint LsaClose(IntPtr ObjectHandle);
              [DllImport("advapi32.dll")] static extern uint LsaFreeMemory(IntPtr Buffer);
              public static string Probe(string sidText) {
                  var attrs = new LSA_OBJECT_ATTRIBUTES(); attrs.Length = Marshal.SizeOf(typeof(LSA_OBJECT_ATTRIBUTES));
                  IntPtr policy; uint openStatus = LsaOpenPolicy(IntPtr.Zero, ref attrs, POLICY_LOOKUP_NAMES, out policy);
                  if (openStatus != 0) return "OPEN_NT="+openStatus+";OPEN_WIN="+LsaNtStatusToWinError(openStatus);
                  try {
                      var sid = new SecurityIdentifier(sidText); byte[] bytes = new byte[sid.BinaryLength]; sid.GetBinaryForm(bytes,0);
                      IntPtr sidPtr = Marshal.AllocHGlobal(bytes.Length);
                      try {
                          Marshal.Copy(bytes,0,sidPtr,bytes.Length);
                          IntPtr rightsPtr = IntPtr.Zero; uint count = 0; uint st = LsaEnumerateAccountRights(policy,sidPtr,out rightsPtr,out count); uint win = LsaNtStatusToWinError(st);
                          var names = new List<string>();
                          if (st == 0 && rightsPtr != IntPtr.Zero) {
                              try {
                                  int size = Marshal.SizeOf(typeof(LSA_UNICODE_STRING));
                                  for (int i=0;i<count;i++) {
                                      var item=(LSA_UNICODE_STRING)Marshal.PtrToStructure(IntPtr.Add(rightsPtr,i*size),typeof(LSA_UNICODE_STRING));
                                      if (item.Buffer!=IntPtr.Zero && item.Length>0) names.Add(Marshal.PtrToStringUni(item.Buffer,item.Length/2));
                                  }
                              } finally { LsaFreeMemory(rightsPtr); }
                          }
                          return "ENUM_NT="+st+";ENUM_WIN="+win+";COUNT="+count+";RIGHTS="+String.Join(",",names.ToArray());
                      } finally { Marshal.FreeHGlobal(sidPtr); }
                  } finally { LsaClose(policy); }
              }
          }
          '@
          Add-Type -TypeDefinition $source -ErrorAction Stop
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $targets = New-Object System.Collections.Generic.List[object]
          $targets.Add([pscustomobject]@{Kind='USER';Sid=$identity.User.Value;Name=$identity.Name})
          foreach ($sid in $identity.Groups) {
            $name=$sid.Value
            try {$name=$sid.Translate([Security.Principal.NTAccount]).Value} catch {}
            $targets.Add([pscustomobject]@{Kind='GROUP';Sid=$sid.Value;Name=$name})
          }
          foreach ($target in $targets) {
            $probe=[ArthurLsaProbe]::Probe([string]$target.Sid)
            Write-Host ("LSA_PROBE_KIND={0}:NAME={1}:SID={2}:{3}" -f $target.Kind,$target.Name,$target.Sid,$probe)
          }
          Write-Host 'LSA_STATUS_DIAGNOSTIC=PASS'
