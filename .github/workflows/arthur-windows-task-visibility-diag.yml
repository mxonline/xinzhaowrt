name: Arthur Windows Detached Runtime Diagnostic

on:
  push:
    branches:
      - diag/arthur-windows-task-visibility-20260906
    paths:
      - .github/workflows/arthur-windows-task-visibility-diag.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spawn:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5
    steps:
      - name: Spawn cleanup-exempt heartbeat sentinel
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\DetachedProbe'
          $script = Join-Path $root 'sentinel.py'
          $state = Join-Path $root 'sentinel.json'
          $pidFile = Join-Path $root 'pid.txt'
          $python = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\HeadlessPython\.venv\Scripts\python.exe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Remove-Item -LiteralPath $state,$pidFile -Force -ErrorAction SilentlyContinue
          @'
          import json, os, pathlib, time
          root = pathlib.Path(os.environ['ARTHUR_DETACHED_PROBE_ROOT'])
          state = root / 'sentinel.json'
          started = time.time()
          while time.time() - started < 180:
              tmp = root / 'sentinel.tmp'
              tmp.write_text(json.dumps({'pid': os.getpid(), 'started_at': started, 'heartbeat': time.time()}), encoding='utf-8')
              os.replace(tmp, state)
              time.sleep(1)
          '@ | Set-Content -LiteralPath $script -Encoding UTF8

          $oldTracking = $env:RUNNER_TRACKING_ID
          $oldProbeRoot = $env:ARTHUR_DETACHED_PROBE_ROOT
          try {
            $env:RUNNER_TRACKING_ID = ''
            $env:ARTHUR_DETACHED_PROBE_ROOT = $root
            $p = Start-Process -FilePath $python -ArgumentList @($script) -WindowStyle Hidden -PassThru
            [IO.File]::WriteAllText($pidFile,[string]$p.Id,[Text.UTF8Encoding]::new($false))
            Write-Host ("DETACHED_SENTINEL_PID={0}" -f $p.Id)
            Write-Host ("DETACHED_TRACKING_ID_CHILD_VALUE='{0}'" -f $env:RUNNER_TRACKING_ID)
          }
          finally {
            $env:RUNNER_TRACKING_ID = $oldTracking
            $env:ARTHUR_DETACHED_PROBE_ROOT = $oldProbeRoot
          }
          $deadline=(Get-Date).AddSeconds(10)
          while((Get-Date)-lt $deadline -and -not (Test-Path -LiteralPath $state -PathType Leaf)){Start-Sleep -Milliseconds 250}
          if(-not (Test-Path -LiteralPath $state -PathType Leaf)){throw 'DETACHED_SENTINEL_DID_NOT_START'}
          $payload=Get-Content -Raw -LiteralPath $state | ConvertFrom-Json
          Write-Host ("SPAWN_HEARTBEAT={0}" -f $payload.heartbeat)
          Write-Host 'DETACHED_SENTINEL_STARTED=PASS'

  verify:
    needs: spawn
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 5
    steps:
      - name: Verify sentinel survived prior job cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = Join-Path $env:LOCALAPPDATA 'XinZhaoWrt\DetachedProbe'
          $state = Join-Path $root 'sentinel.json'
          $pidFile = Join-Path $root 'pid.txt'
          if(-not (Test-Path -LiteralPath $pidFile -PathType Leaf)){throw 'DETACHED_PID_FILE_MISSING'}
          if(-not (Test-Path -LiteralPath $state -PathType Leaf)){throw 'DETACHED_STATE_FILE_MISSING'}
          $pidValue=[int](Get-Content -Raw -LiteralPath $pidFile).Trim()
          $before=Get-Content -Raw -LiteralPath $state | ConvertFrom-Json
          $proc=Get-Process -Id $pidValue -ErrorAction SilentlyContinue
          Write-Host ("SURVIVOR_PID={0}:ALIVE={1}:HEARTBEAT_BEFORE={2}" -f $pidValue,[bool]$proc,$before.heartbeat)
          if(-not $proc){throw 'DETACHED_PROCESS_DIED_DURING_RUNNER_CLEANUP'}
          Start-Sleep -Seconds 5
          $after=Get-Content -Raw -LiteralPath $state | ConvertFrom-Json
          Write-Host ("HEARTBEAT_AFTER={0}" -f $after.heartbeat)
          if([double]$after.heartbeat -le [double]$before.heartbeat){throw 'DETACHED_HEARTBEAT_NOT_ADVANCING'}
          Write-Host 'DETACHED_PROCESS_SURVIVED_RUNNER_CLEANUP=PASS'
          Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 500
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'DETACHED_SENTINEL_CLEANUP=PASS'
