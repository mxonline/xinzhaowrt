name: Cancel Arthur reuse candidate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cancel-reuse-candidate.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-reuse:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel obsolete reuse run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=33649780590
          status="$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .status 2>/dev/null || true)"
          case "$status" in
            queued|in_progress|waiting|pending|requested)
              echo "CANCEL_REUSE_RUN run=${run_id} status=${status}"
              gh api --method POST "repos/${REPO}/actions/runs/${run_id}/cancel"
              ;;
            *)
              echo "CANCEL_REUSE_RUN_SKIP run=${run_id} status=${status:-unknown}"
              ;;
          esac
