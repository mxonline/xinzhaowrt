name: Arthur Durable State Gate

'on':
  push:
    branches:
      - main
    paths:
      - 'scripts/arthur-state-contract.ps1'
      - 'scripts/arthur-resume-state.ps1'
      - 'scripts/arthur-evidence-index.ps1'
      - 'scripts/arthur-state-consistency.ps1'
      - 'scripts/arthur-operator-intent.ps1'
      - 'scripts/arthur-control-plane.ps1'
      - 'production/resume-state.json'
      - 'production/operator-intent.json'
      - 'production/evidence/**'
      - 'runtime-contract.json'
      - 'tests/arthur-state-contract.tests.ps1'
      - 'tests/arthur-resume-state-v2.tests.ps1'
      - 'tests/arthur-control-plane-gates.tests.ps1'
      - 'tests/arthur-evidence-index.tests.ps1'
      - 'tests/arthur-inherited-evidence.tests.ps1'
      - 'tests/production-agent-evidence.tests.ps1'
      - 'tests/arthur-operator-intent.tests.ps1'
      - 'tests/arthur-global-runtime-contract.tests.ps1'
      - '.github/workflows/arthur-state-contract.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/arthur-state-contract.ps1'
      - 'scripts/arthur-resume-state.ps1'
      - 'scripts/arthur-evidence-index.ps1'
      - 'scripts/arthur-state-consistency.ps1'
      - 'scripts/arthur-operator-intent.ps1'
      - 'scripts/arthur-control-plane.ps1'
      - 'production/resume-state.json'
      - 'production/operator-intent.json'
      - 'production/evidence/**'
      - 'runtime-contract.json'
      - 'tests/arthur-state-contract.tests.ps1'
      - 'tests/arthur-resume-state-v2.tests.ps1'
      - 'tests/arthur-control-plane-gates.tests.ps1'
      - 'tests/arthur-evidence-index.tests.ps1'
      - 'tests/arthur-inherited-evidence.tests.ps1'
      - 'tests/production-agent-evidence.tests.ps1'
      - 'tests/arthur-operator-intent.tests.ps1'
      - 'tests/arthur-global-runtime-contract.tests.ps1'
      - '.github/workflows/arthur-state-contract.yml'

permissions:
  contents: read

concurrency:
  group: arthur-durable-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Test Arthur state contract
        shell: pwsh
        run: ./tests/arthur-state-contract.tests.ps1

      - name: Test Arthur resume schema v2
        shell: pwsh
        run: ./tests/arthur-resume-state-v2.tests.ps1

      - name: Test Arthur Control Plane Gate arbitration
        shell: pwsh
        run: ./tests/arthur-control-plane-gates.tests.ps1

      - name: Test Arthur evidence index
        shell: pwsh
        run: ./tests/arthur-evidence-index.tests.ps1

      - name: Test inherited evidence
        shell: pwsh
        run: ./tests/arthur-inherited-evidence.tests.ps1

      - name: Test Production Agent evidence wiring
        shell: pwsh
        run: ./tests/production-agent-evidence.tests.ps1

      - name: Test operator intent and active Candidate ownership
        shell: pwsh
        run: ./tests/arthur-operator-intent.tests.ps1

      - name: Test Global Runtime Contract integration
        shell: pwsh
        run: ./tests/arthur-global-runtime-contract.tests.ps1
