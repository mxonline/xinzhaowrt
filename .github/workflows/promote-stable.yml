name: Promote XinZhaoWrt Candidate to Stable

'on':
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Candidate release tag, e.g. arthur-known-good-32853100232
        required: true
        type: string
      stable_tag:
        description: Stable release tag, e.g. v0.1.0
        required: true
        type: string
      device_verified:
        description: Confirm JDCloud RE-SS-01 real-device verification passed
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: xinzhaowrt-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: inputs.device_verified == true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release request and resolve Candidate commit
        id: candidate
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          PROJECT_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "BLOCKED: invalid VERSION: $PROJECT_VERSION"
            exit 1
          }

          [[ "$STABLE_TAG" == "v${PROJECT_VERSION}" ]] || {
            echo "BLOCKED: stable tag $STABLE_TAG must match repository VERSION v${PROJECT_VERSION}"
            exit 1
          }

          if [[ "$CANDIDATE_TAG" =~ ^arthur-known-good-[0-9]+$ ]]; then
            echo "Fast Lane Candidate accepted: $CANDIDATE_TAG"
          elif [[ "$CANDIDATE_TAG" =~ ^v${PROJECT_VERSION//./\.}-rc\.[0-9]+$ ]]; then
            echo "Legacy RC Candidate accepted: $CANDIDATE_TAG"
          else
            echo "BLOCKED: unsupported candidate tag: $CANDIDATE_TAG"
            exit 1
          fi

          gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          git fetch --tags --force origin
          CANDIDATE_SHA="$(git rev-list -n 1 "$CANDIDATE_TAG")"
          [[ -n "$CANDIDATE_SHA" ]] || {
            echo "BLOCKED: unable to resolve candidate commit for $CANDIDATE_TAG"
            exit 1
          }

          STABLE_EXISTS=false
          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            STABLE_SHA="$(git rev-list -n 1 "$STABLE_TAG" 2>/dev/null || true)"
            [[ "$STABLE_SHA" == "$CANDIDATE_SHA" ]] || {
              echo "BLOCKED: existing stable tag $STABLE_TAG points to $STABLE_SHA, expected $CANDIDATE_SHA"
              exit 1
            }
            STABLE_EXISTS=true
            echo "Stable release already exists on the verified Candidate commit; continuing idempotent known-good recovery."
          fi

          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "stable_exists=$STABLE_EXISTS" >> "$GITHUB_OUTPUT"
          echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $CANDIDATE_SHA"

      - name: Verify archived real-device evidence
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          REPORT='output/real-device/real-device-verification.json'
          [[ -s "$REPORT" ]] || {
            echo "BLOCKED: missing real-device verification report: $REPORT"
            exit 1
          }

          python3 - <<'PY'
          import json, os, sys

          path = 'output/real-device/real-device-verification.json'
          with open(path, 'r', encoding='utf-8-sig') as f:
              data = json.load(f)

          errors = []
          candidate = os.environ['CANDIDATE_TAG']
          candidate_sha = os.environ['CANDIDATE_SHA']

          def require(cond, message):
              if not cond:
                  errors.append(message)

          require(data.get('candidate') == candidate,
                  f"candidate mismatch: report={data.get('candidate')!r}, expected={candidate!r}")
          require(data.get('commit') == candidate_sha,
                  f"commit mismatch: report={data.get('commit')!r}, expected={candidate_sha!r}")
          require(str(data.get('result', '')).upper() == 'PASS',
                  f"result is not PASS: {data.get('result')!r}")
          require(data.get('required_plugins_total') == 22,
                  f"required_plugins_total is not 22: {data.get('required_plugins_total')!r}")
          require(data.get('required_plugins_passed') == 22,
                  f"required_plugins_passed is not 22: {data.get('required_plugins_passed')!r}")

          device = data.get('device') or {}
          require(device.get('target') == 'jdcloud_re-ss-01',
                  f"device target mismatch: {device.get('target')!r}")

          features = data.get('prebuild_features') or {}
          require(features.get('ADGUARD_LIVE') == 'PASS', 'ADGUARD_LIVE is not PASS')
          require(features.get('QUICKSTART_LIVE') == 'PASS', 'QUICKSTART_LIVE is not PASS')
          require(features.get('WIFI_LIVE') == 'PASS', 'WIFI_LIVE is not PASS')
          require(features.get('FIRMWARE_BUILD_ALLOWED') == 'true', 'FIRMWARE_BUILD_ALLOWED is not true')
          require(features.get('wifi_configuration_mutated') is False, 'Wi-Fi configuration mutation marker is not false')

          for name in ('ssh', 'storage', 'lan', 'wan', 'internet', 'dns', 'wifi_2g', 'wifi_5g', 'luci', 'reboot', 'persistence'):
              item = data.get(name) or {}
              require(item.get('passed') is True, f"{name} did not pass")

          require(len(data.get('critical_log_errors') or []) == 0,
                  'critical_log_errors is not empty')
          require(len(data.get('failures') or []) == 0,
                  'failures is not empty')

          if errors:
              print('BLOCKED: archived real-device verification did not satisfy Stable gate:')
              for error in errors:
                  print(f'- {error}')
              sys.exit(1)

          print('PASS: archived real-device verification matches Candidate and all hard gates.')
          PY

      - name: Download Candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -Eeuo pipefail
          rm -rf promote
          mkdir -p promote/assets
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir promote/assets
          find promote/assets -maxdepth 1 -type f -print | sort

      - name: Verify Candidate assets
        id: verify
        run: |
          set -Eeuo pipefail

          SYSUPGRADE="$(find promote/assets -maxdepth 1 -type f -name '*sysupgrade*.bin' -size +0c | sort | head -n1 || true)"
          FACTORY="$(find promote/assets -maxdepth 1 -type f -name '*factory*.bin' -size +0c | sort | head -n1 || true)"

          [[ -n "$SYSUPGRADE" || -n "$FACTORY" ]] || {
            echo 'BLOCKED: Candidate release contains no non-empty Arthur firmware .bin.'
            exit 1
          }

          if [[ -n "$SYSUPGRADE" ]]; then
            FIRMWARE="$SYSUPGRADE"
          else
            FIRMWARE="$FACTORY"
          fi

          CHECKSUM_FILE=''
          if [[ -s promote/assets/SHA256SUMS.local ]]; then
            CHECKSUM_FILE='SHA256SUMS.local'
          elif [[ -s promote/assets/sha256sums ]]; then
            CHECKSUM_FILE='sha256sums'
          elif [[ -s promote/assets/sha256sums.txt ]]; then
            CHECKSUM_FILE='sha256sums.txt'
          else
            echo 'BLOCKED: Candidate release contains no supported checksum file.'
            exit 1
          fi

          echo "Using checksum file: $CHECKSUM_FILE"
          (
            cd promote/assets
            sha256sum -c "$CHECKSUM_FILE"
          )

          [[ -s promote/assets/plugin-verification.txt ]] || {
            echo 'BLOCKED: Candidate release has no plugin-verification.txt.'
            exit 1
          }
          grep -Fq 'PASS: all required LuCI plugins were compiled and are present in the final firmware manifest' \
            promote/assets/plugin-verification.txt || {
              echo 'BLOCKED: Candidate plugin verification PASS marker missing.'
              exit 1
            }

          printf '%s\n' "firmware_name=$(basename "$FIRMWARE")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "firmware_sha256=$(sha256sum "$FIRMWARE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf '%s\n' "checksum_file=$CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          printf '%s\n' "sysupgrade_name=$(basename "$SYSUPGRADE")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "factory_name=$(basename "$FACTORY")" >> "$GITHUB_OUTPUT"

      - name: Create Stable GitHub Release
        if: steps.candidate.outputs.stable_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -Eeuo pipefail
          cat > promote/stable-notes.md <<EOF
          # XinZhaoWrt Arthur ${STABLE_TAG}

          Stable release promoted from ${CANDIDATE_TAG} after archived JDCloud RE-SS-01 real-device verification passed all hard gates.

          - Device: JDCloud RE-SS-01 (Arthur)
          - Target: qualcommax / ipq60xx
          - Candidate source: ${CANDIDATE_TAG}
          - Candidate commit: ${CANDIDATE_SHA}
          - Required LuCI plugins: 22/22 real-device PASS
          - Reboot and overlay persistence: PASS
          - Network / DNS / Wi-Fi / LuCI: PASS
          - Critical log errors: 0
          - Status: Stable / known-good
          EOF

          gh release create "$STABLE_TAG" \
            promote/assets/* \
            output/real-device/real-device-verification.json \
            output/real-device/real-device-verification.md \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "XinZhaoWrt Arthur ${STABLE_TAG}" \
            --notes-file promote/stable-notes.md \
            --latest

      - name: Update known-good and production status
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          FIRMWARE_NAME: ${{ steps.verify.outputs.firmware_name }}
          FIRMWARE_SHA256: ${{ steps.verify.outputs.firmware_sha256 }}
          VERIFICATION_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name 'XinZhaoWrt Release Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
          git pull --rebase origin main

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone

          path = 'production/known-good.json'
          try:
              with open(path, 'r', encoding='utf-8') as f:
                  data = json.load(f)
          except Exception:
              data = {}

          data.update({
              'status': 'verified',
              'verified': True,
              'device': 'jdcloud_re-ss-01',
              'target': 'qualcommax',
              'subtarget': 'ipq60xx',
              'stable_tag': os.environ['STABLE_TAG'],
              'candidate_tag': os.environ['CANDIDATE_TAG'],
              'source_commit': os.environ['CANDIDATE_SHA'],
              'verification_commit': os.environ['VERIFICATION_COMMIT'],
              'verification_report': 'output/real-device/real-device-verification.json',
              'firmware': os.environ['FIRMWARE_NAME'],
              'sha256': os.environ['FIRMWARE_SHA256'],
              'verified_at': datetime.now(timezone.utc).isoformat(),
              'verification': 'real-device-confirmed'
          })

          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          chmod +x scripts/update-stable-status.sh
          ./scripts/update-stable-status.sh \
            "$STABLE_TAG" \
            "$CANDIDATE_TAG" \
            "$FIRMWARE_NAME" \
            "$FIRMWARE_SHA256" \
            "$CANDIDATE_SHA"

          git add production/known-good.json production/status.json
          if git diff --cached --quiet; then
            echo 'known-good and production status already match this Stable release.'
          else
            git commit -m "release: mark ${STABLE_TAG} as known-good"
            git push origin HEAD:main
          fi

      - name: Stable promotion summary
        run: |
          {
            echo '## XinZhaoWrt Stable 发布完成'
            echo
            echo '- Candidate: `${{ inputs.candidate_tag }}`'
            echo '- Stable: `${{ inputs.stable_tag }}`'
            echo '- Candidate commit: `${{ steps.candidate.outputs.candidate_sha }}`'
            echo '- Firmware: `${{ steps.verify.outputs.firmware_name }}`'
            echo '- SHA256: `${{ steps.verify.outputs.firmware_sha256 }}`'
            echo '- Required plugins: `22/22`'
            echo '- Real-device verification: `PASS`'
            echo '- production/status: `verified`'
            echo '- known-good: 已更新或已确认一致'
          } >> "$GITHUB_STEP_SUMMARY"
