name: Run Real Device Baseline Integration

on:
  push:
    branches:
      - feat/real-device-baseline-v2
    paths:
      - '.github/workflows/real-device-baseline-integration-run.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-device-baseline-v2
          fetch-depth: 0
      - name: Apply and test integration
        shell: pwsh
        run: ./scripts/apply-real-device-baseline-integration.ps1
      - name: Commit runtime integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) { throw 'Integration patch produced no changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/production-agent.ps1 scripts/ci-controller-v3.ps1
          git commit -m 'chore: integrate real-device baseline runtime gates'
          git push origin HEAD:feat/real-device-baseline-v2
