name: Arthur Production State Sync

'on':
  workflow_run:
    workflows:
      - Arthur Known-Good Update v3
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing Arthur Known-Good Update v3 run to reconcile into durable production state
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: arthur-production-state-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current production state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source run and durable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          run_id="$EVENT_RUN_ID"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then run_id="$INPUT_RUN_ID"; fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'BLOCKED: invalid source run id'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/arthur-run.json
          test "$(jq -r '.name' /tmp/arthur-run.json)" = 'Arthur Known-Good Update v3' || { echo 'BLOCKED: wrong source workflow'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/arthur-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/arthur-artifacts.json
          echo "SOURCE_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Reconcile Gate and Evidence state
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          run = json.load(open('/tmp/arthur-run.json', encoding='utf-8'))
          jobs = json.load(open('/tmp/arthur-jobs.json', encoding='utf-8'))
          artifacts = json.load(open('/tmp/arthur-artifacts.json', encoding='utf-8'))
          run_id = int(run['id'])
          source_sha = str(run['head_sha']).lower()
          resume_path = Path('production/resume-state.json')
          intent_path = Path('production/operator-intent.json')
          resume = json.load(open(resume_path, encoding='utf-8'))
          intent = json.load(open(intent_path, encoding='utf-8'))
          if int(resume.get('schema_version', 0)) != 2:
              raise SystemExit('BLOCKED: production resume state is not schema v2')

          # A manual dispatch can recover a terminal release after a prior
          # state-sync committed PRE_FLASH for a different execution.  Terminal
          # evidence is authoritative for the released identity, so it must be
          # evaluated before the old resume run can take the legacy SKIP path.
          status = json.load(open('production/status.json', encoding='utf-8'))
          known_good = json.load(open('production/known-good.json', encoding='utf-8'))
          identity_keys = ('run_id', 'stable_tag', 'project_commit', 'source_commit', 'firmware', 'sha256')
          known_good_identity_keys = {
              'run_id': 'toolchain_run',
              'stable_tag': 'stable_tag',
              'project_commit': 'project_commit',
              'source_commit': 'source_commit',
              'firmware': 'firmware',
              'sha256': 'sha256',
          }
          terminal_eligible = (
              status.get('status') == 'PRODUCTION_RELEASED' and
              status.get('known_good') is True and
              known_good.get('verified') is True and
              known_good.get('verification') == 'real-device-confirmed' and
              int(status.get('run_id', 0)) == run_id
          )
          if terminal_eligible:
              for key, known_good_key in known_good_identity_keys.items():
                  if str(status.get(key, '')) != str(known_good.get(known_good_key, '')):
                      raise SystemExit(f'BLOCKED: terminal status and known-good identity differ: {key}')
              stable_tag = str(status['stable_tag'])
              release = json.loads(subprocess.run(
                  ['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{stable_tag}"],
                  check=True, capture_output=True, text=True).stdout)
              if (release.get('tag_name') != stable_tag or release.get('draft') or release.get('prerelease') or
                      str(release.get('target_commitish', '')).lower() != str(status['project_commit']).lower()):
                  raise SystemExit('BLOCKED: Stable Release identity is not eligible for terminal reconciliation')
              asset_names = {str(asset.get('name', '')) for asset in release.get('assets', [])}
              if status['firmware'] not in asset_names or 'real-device-verification.json' not in asset_names:
                  raise SystemExit('BLOCKED: Stable Release lacks firmware or durable real-device verification evidence')
              report_dir = Path('/tmp/arthur-terminal-release-assets')
              report_dir.mkdir(parents=True, exist_ok=True)
              report_path = report_dir / 'real-device-verification.json'
              if not report_path.exists():
                  subprocess.run([
                      'gh', 'release', 'download', stable_tag, '--repo', os.environ['GITHUB_REPOSITORY'],
                      '--pattern', 'real-device-verification.json', '--dir', str(report_dir)
                  ], check=True)
              try:
                  report_bytes = report_path.read_bytes()
                  report = json.loads(report_bytes.decode('utf-8-sig'))
              except Exception as exc:
                  raise SystemExit(f'BLOCKED: durable real-device verification report is invalid: {exc}')
              if report.get('result') != 'PASS':
                  raise SystemExit('BLOCKED: durable real-device verification report is not PASS')

              execution_id = str(resume.get('execution_id', ''))
              if not execution_id:
                  raise SystemExit('BLOCKED: durable terminal execution id is missing')
              evidence_dir = Path('production/evidence') / execution_id
              evidence_dir.mkdir(parents=True, exist_ok=True)
              identity = {key: status[key] for key in identity_keys}
              identity['run_id'] = int(identity['run_id'])
              now = datetime.now(timezone.utc).isoformat()
              release_evidence = dict(identity, verified_by='GITHUB_ACTIONS_GITHUB_TOKEN', release_exists=True,
                                      draft=False, prerelease=False, release_id=str(release['id']),
                                      release_url=str(release['html_url']), observed_at=now)
              device_evidence = dict(identity, known_good=True, verified=True,
                                     verification='real-device-confirmed',
                                     evidence_sha256=hashlib.sha256(report_bytes).hexdigest(),
                                     ref=f'release:{stable_tag}/real-device-verification.json', observed_at=now)

              def evidence_matches(path, expected):
                  try:
                      actual = json.load(open(path, encoding='utf-8'))
                  except (OSError, ValueError):
                      return False
                  return all(str(actual.get(key, '')) == str(expected[key]) for key in identity_keys)

              release_path = evidence_dir / 'github-release-evidence.json'
              device_path = evidence_dir / 'real-device-evidence.json'
              if not evidence_matches(release_path, release_evidence):
                  release_path.write_text(json.dumps(release_evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              if not evidence_matches(device_path, device_evidence):
                  device_path.write_text(json.dumps(device_evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              runtime_path = Path('/tmp/arthur-terminal-runtime.json')
              runtime_path.write_text(json.dumps({
                  'execution_id': execution_id, 'phase': 'RELEASE_GATE', 'current_stage': 'RELEASE_GATE',
                  'next_action': 'RELEASE', 'terminal_state': None, 'pending_human_gate': None
              }) + '\n', encoding='utf-8')
              # The frozen manifest uses toolchain_run and intentionally has no
              # mutable known_good flag. Normalize only a temporary copy for
              # the shared reconciler; production/known-good.json is never
              # modified by State Sync.
              known_good_for_reconciler = dict(known_good)
              known_good_for_reconciler['run_id'] = int(known_good['toolchain_run'])
              known_good_for_reconciler['known_good'] = True
              Path('/tmp/arthur-terminal-known-good.json').write_text(
                  json.dumps(known_good_for_reconciler, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('mode=terminal\n')
              print(f'TERMINAL_RELEASE_EVIDENCE=PASS run={run_id} stable_tag={stable_tag}')
              raise SystemExit(0)

          if int(resume.get('production', {}).get('github_run_id', 0)) != run_id:
              print(f'SKIP: durable execution is bound to another run: {resume.get("production", {}).get("github_run_id")}')
              raise SystemExit(0)
          if resume.get('source', {}).get('accepted_source_sha', '').lower() != source_sha:
              raise SystemExit('BLOCKED: source SHA differs from durable execution')
          execution_id = resume['execution_id']
          evidence_path = Path('production/evidence') / execution_id / 'index.json'
          evidence = json.load(open(evidence_path, encoding='utf-8'))

          build_job = next((j for j in jobs.get('jobs', []) if j.get('name') == 'build-candidate'), None)
          if not build_job:
              raise SystemExit('BLOCKED: build-candidate job missing')
          steps = {s.get('name'): s.get('conclusion') for s in build_job.get('steps', [])}
          build_result = steps.get('Build Candidate from locked sources')
          acceptance = steps.get('Enforce Candidate acceptance gates')
          upload = steps.get('Upload verified Candidate')
          release = steps.get('Publish Candidate release')
          now = run.get('updated_at') or datetime.now(timezone.utc).isoformat()

          def ev(eid):
              return next((x for x in evidence['evidence'] if x.get('evidence_id') == eid), None)
          build_ev = ev(f'build-run-{run_id}')
          if not build_ev:
              raise SystemExit('BLOCKED: BUILD evidence record missing')
          build_ev['observed_at'] = now
          build_ev['result'] = 'PASS' if build_result == 'success' else 'FAIL'

          build_gate = resume['gates']['BUILD']
          artifact_gate = resume['gates']['ARTIFACT']
          if build_result != 'success':
              build_gate['status'] = 'FAIL'
              build_gate['verified_at'] = now
              resume['current_gate'] = 'BUILD'
              resume['next_action'] = 'BUILD'
              resume['checkpoint']['current'] = 'BUILD'
              resume['checkpoint']['next_action'] = 'BUILD'
              resume['pending'] = ['BUILD']
              intent['firmware_state']['current_stage'] = 'BUILD'
              intent['firmware_state']['next_stage'] = 'BUILD'
          else:
              build_gate['status'] = 'PASS'
              build_gate['verified_at'] = now
              artifact_name = f'Arthur-v3-Candidate-{run_id}'
              artifact = next((a for a in artifacts.get('artifacts', []) if a.get('name') == artifact_name and not a.get('expired')), None)
              if acceptance == 'success' and upload == 'success' and artifact:
                  artifact_id = int(artifact['id'])
                  digest = str(artifact.get('digest') or '')
                  archive_sha = digest.split(':',1)[1] if digest.startswith('sha256:') else ''
                  artifact_eid = f'artifact-run-{run_id}'
                  if not ev(artifact_eid):
                      evidence['evidence'].append({
                          'evidence_id': artifact_eid,
                          'gate_id': 'ARTIFACT',
                          'type': 'GITHUB_ACTIONS_ARTIFACT',
                          'producer': 'ARTHUR_KNOWN_GOOD_UPDATE_V3',
                          'source_sha': source_sha,
                          'github_run_id': run_id,
                          'artifact_id': artifact_id,
                          'candidate_sha256': '',
                          'device_build_id': '',
                          'ref': f'github-actions:{os.environ["GITHUB_REPOSITORY"]}/artifacts/{artifact_id}',
                          'sha256': archive_sha,
                          'observed_at': now,
                          'result': 'PASS'
                      })
                  artifact_gate['status'] = 'PASS'
                  artifact_gate['evidence_refs'] = [f'evidence:{artifact_eid}']
                  artifact_gate['verified_at'] = now
                  resume['production']['artifact_id'] = artifact_id
                  resume['current_gate'] = 'PRE_FLASH'
                  resume['next_action'] = 'PRE_FLASH'
                  resume['checkpoint']['current'] = 'PRE_FLASH'
                  resume['checkpoint']['next_action'] = 'PRE_FLASH'
                  resume['pending'] = ['PRE_FLASH']
                  intent['firmware_state']['current_stage'] = 'ARTIFACT'
                  intent['firmware_state']['next_stage'] = 'PRE_FLASH'
                  intent['firmware_state']['active_artifact_id'] = artifact_id
              else:
                  artifact_gate['status'] = 'FAIL'
                  resume['current_gate'] = 'ARTIFACT'
                  resume['next_action'] = 'ARTIFACT'
                  resume['checkpoint']['current'] = 'ARTIFACT'
                  resume['checkpoint']['next_action'] = 'ARTIFACT'
                  resume['pending'] = ['ARTIFACT']
                  intent['firmware_state']['current_stage'] = 'ARTIFACT'
                  intent['firmware_state']['next_stage'] = 'ARTIFACT'

          resume['checkpoint']['turn_count'] = int(resume['checkpoint'].get('turn_count', 0)) + 1
          resume['status'] = 'RESUME_SAFE'
          resume['instruction_allowed'] = True
          resume['conflicts'] = []
          resume.pop('semantic_sha256', None)
          compact = json.dumps(resume, separators=(',', ':'), ensure_ascii=False)
          resume['semantic_sha256'] = hashlib.sha256(compact.encode()).hexdigest()

          intent['firmware_state']['active_run_id'] = run_id
          intent['firmware_state']['active_source_sha'] = source_sha
          intent['firmware_state']['candidate_release_conclusion'] = release or 'missing'
          intent['guardrails']['do_not_dispatch_duplicate_build'] = True
          intent['guardrails']['do_not_interrupt_active_run'] = True

          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          resume_path.write_text(json.dumps(resume, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          intent_path.write_text(json.dumps(intent, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('mode=legacy\n')
          print(f'PASS: durable state reconciled run={run_id} build={build_result} acceptance={acceptance} upload={upload} release={release} next={resume["next_action"]}')
          PY

      - name: Reconcile terminal production state
        if: ${{ steps.reconcile.outputs.mode == 'terminal' }}
        run: |
          set -Eeuo pipefail
          pwsh -NoProfile -Command '
            . ./scripts/arthur-terminal-release-reconciler.ps1
            $resume = Get-Content -Raw ./production/resume-state.json | ConvertFrom-Json
            $executionId = [string]$resume.execution_id
            if ([string]::IsNullOrWhiteSpace($executionId)) { throw "TERMINAL_RELEASE_EXECUTION_ID_MISSING" }
            $evidenceRoot = Join-Path ./production/evidence $executionId
            $result = Invoke-ArthurTerminalReleaseReconcile -StatusPath ./production/status.json -KnownGoodPath /tmp/arthur-terminal-known-good.json -ReleaseEvidencePath (Join-Path $evidenceRoot github-release-evidence.json) -DeviceEvidencePath (Join-Path $evidenceRoot real-device-evidence.json) -ResumeStatePath ./production/resume-state.json -OperatorIntentPath ./production/operator-intent.json -RuntimeStatePath /tmp/arthur-terminal-runtime.json -EventLogPath ./production/firmware-events.jsonl -ExecutionId $executionId
            if ([string]$result.reason -eq "EXECUTION_ID_MISMATCH") { throw "TERMINAL_RELEASE_EXECUTION_ID_MISMATCH" }
            if ([string]$result.reason -eq "ALREADY_RECONCILED") {
              Write-Host "ALREADY_RECONCILED=PASS NO_OP=PASS execution=$executionId"
            } else {
              Write-Host "TERMINAL_RELEASE_RECONCILED=PASS execution=$executionId result=$($result.reason)"
            }
          '

      - name: Commit state-only reconciliation
        env:
          TERMINAL_MODE: ${{ steps.reconcile.outputs.mode }}
        run: |
          set -Eeuo pipefail
          git config user.name 'XinZhaoWrt State Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
            git add production/resume-state.json production/operator-intent.json production/firmware-events.jsonl production/evidence/
          if git diff --cached --quiet; then
            if [ "$TERMINAL_MODE" = terminal ]; then
              echo 'ALREADY_RECONCILED=PASS NO_OP=PASS'
              exit 0
            fi
            echo 'PASS: durable production state already reconciled.'
            exit 0
          fi
          git commit -m "state: reconcile Arthur production execution from run ${SOURCE_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'BLOCKED: unable to persist state reconciliation after retries' >&2
          exit 1
