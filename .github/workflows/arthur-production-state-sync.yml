name: Arthur Production State Sync

'on':
  workflow_run:
    workflows:
      - Arthur Known-Good Update v3
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Existing Arthur Known-Good Update v3 run to reconcile into durable production state
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: arthur-production-state-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current production state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve source run and durable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          run_id="$EVENT_RUN_ID"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then run_id="$INPUT_RUN_ID"; fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'BLOCKED: invalid source run id'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > /tmp/arthur-run.json
          test "$(jq -r '.name' /tmp/arthur-run.json)" = 'Arthur Known-Good Update v3' || { echo 'BLOCKED: wrong source workflow'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > /tmp/arthur-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > /tmp/arthur-artifacts.json
          echo "SOURCE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$(jq -r '.head_sha' /tmp/arthur-run.json)" >> "$GITHUB_ENV"

      - name: Reconcile Gate and Evidence state
        id: reconcile
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          run = json.load(open('/tmp/arthur-run.json', encoding='utf-8'))
          jobs = json.load(open('/tmp/arthur-jobs.json', encoding='utf-8'))
          artifacts = json.load(open('/tmp/arthur-artifacts.json', encoding='utf-8'))
          policy = json.load(open('production/release-mode.json', encoding='utf-8'))
          release_mode = str(policy.get('mode') or '')
          if release_mode not in {'RELEASE_ONLY', 'FLASH_AND_VERIFY'}:
              raise SystemExit(f'BLOCKED: unsupported release mode: {release_mode!r}')
          if release_mode == 'RELEASE_ONLY' and bool(policy.get('automatic_flash')):
              raise SystemExit('BLOCKED: RELEASE_ONLY cannot authorize automatic flash')

          run_id = int(run['id'])
          source_sha = str(run['head_sha']).lower()
          resume_path = Path('production/resume-state.json')
          intent_path = Path('production/operator-intent.json')
          resume = json.load(open(resume_path, encoding='utf-8'))
          intent = json.load(open(intent_path, encoding='utf-8'))
          if int(resume.get('schema_version', 0)) != 2:
              raise SystemExit('BLOCKED: production resume state is not schema v2')

          # Idempotent terminal replay: once this exact run is durably released,
          # a workflow retry must be a no-op and must never reopen PRE_FLASH.
          if (resume.get('status') == 'PRODUCTION_RELEASED' and
                  int(resume.get('production', {}).get('github_run_id', 0)) == run_id):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('mode=terminal_noop\n')
              print(f'ALREADY_RECONCILED=PASS run={run_id} release={resume.get("release", "")}')
              raise SystemExit(0)

          if int(resume.get('production', {}).get('github_run_id', 0)) != run_id:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write('mode=skip\n')
              print(f'SKIP: durable execution is bound to another run: {resume.get("production", {}).get("github_run_id")}')
              raise SystemExit(0)
          if resume.get('source', {}).get('accepted_source_sha', '').lower() != source_sha:
              raise SystemExit('BLOCKED: source SHA differs from durable execution')

          execution_id = str(resume.get('execution_id') or '')
          if not execution_id:
              raise SystemExit('BLOCKED: execution id missing')
          evidence_path = Path('production/evidence') / execution_id / 'index.json'
          evidence = json.load(open(evidence_path, encoding='utf-8'))

          build_job = next((j for j in jobs.get('jobs', []) if j.get('name') == 'build-candidate'), None)
          if not build_job:
              raise SystemExit('BLOCKED: build-candidate job missing')
          steps = {s.get('name'): s.get('conclusion') for s in build_job.get('steps', [])}
          build_result = steps.get('Build Candidate from locked sources')
          acceptance = steps.get('Enforce Candidate acceptance gates')
          upload = steps.get('Upload verified Candidate')
          candidate_release = steps.get('Publish Candidate release')
          now = run.get('updated_at') or datetime.now(timezone.utc).isoformat()

          def ev(eid):
              return next((x for x in evidence.get('evidence', []) if x.get('evidence_id') == eid), None)

          build_ev = ev(f'build-run-{run_id}')
          if not build_ev:
              raise SystemExit('BLOCKED: BUILD evidence record missing')
          build_ev['observed_at'] = now
          build_ev['result'] = 'PASS' if build_result == 'success' else 'FAIL'

          build_gate = resume['gates']['BUILD']
          artifact_gate = resume['gates']['ARTIFACT']
          sync_mode = 'state_only'

          if build_result != 'success':
              build_gate['status'] = 'FAIL'
              build_gate['verified_at'] = now
              resume['current_gate'] = 'BUILD'
              resume['next_action'] = 'BUILD'
              resume['checkpoint']['current'] = 'BUILD'
              resume['checkpoint']['next_action'] = 'BUILD'
              resume['pending'] = ['BUILD']
              intent['firmware_state']['current_stage'] = 'BUILD'
              intent['firmware_state']['next_stage'] = 'BUILD'
          else:
              build_gate['status'] = 'PASS'
              build_gate['verified_at'] = now
              artifact_name = f'Arthur-v3-Candidate-{run_id}'
              artifact = next((a for a in artifacts.get('artifacts', []) if a.get('name') == artifact_name and not a.get('expired')), None)
              if acceptance == 'success' and upload == 'success' and candidate_release == 'success' and artifact:
                  artifact_id = int(artifact['id'])
                  digest = str(artifact.get('digest') or '')
                  archive_sha = digest.split(':', 1)[1] if digest.startswith('sha256:') else ''
                  artifact_eid = f'artifact-run-{run_id}'
                  if not ev(artifact_eid):
                      evidence.setdefault('evidence', []).append({
                          'evidence_id': artifact_eid,
                          'gate_id': 'ARTIFACT',
                          'type': 'GITHUB_ACTIONS_ARTIFACT',
                          'producer': 'ARTHUR_KNOWN_GOOD_UPDATE_V3',
                          'source_sha': source_sha,
                          'github_run_id': run_id,
                          'artifact_id': artifact_id,
                          'candidate_sha256': '',
                          'device_build_id': '',
                          'ref': f'github-actions:{os.environ["GITHUB_REPOSITORY"]}/artifacts/{artifact_id}',
                          'sha256': archive_sha,
                          'observed_at': now,
                          'result': 'PASS'
                      })
                  artifact_gate['status'] = 'PASS'
                  artifact_gate['evidence_refs'] = [f'evidence:{artifact_eid}']
                  artifact_gate['verified_at'] = now
                  resume['production']['artifact_id'] = artifact_id
                  intent['firmware_state']['current_stage'] = 'ARTIFACT'
                  intent['firmware_state']['active_artifact_id'] = artifact_id

                  if release_mode == 'RELEASE_ONLY':
                      resume['current_gate'] = 'RELEASE_GATE'
                      resume['next_action'] = 'RELEASE_GATE'
                      resume['checkpoint']['current'] = 'RELEASE_GATE'
                      resume['checkpoint']['next_action'] = 'RELEASE_GATE'
                      resume['pending'] = ['RELEASE_GATE']
                      intent['firmware_state']['next_stage'] = 'RELEASE_GATE'
                      sync_mode = 'release_only'
                  else:  # explicit compatibility mode only
                      resume['current_gate'] = 'PRE_FLASH'
                      resume['next_action'] = 'PRE_FLASH'
                      resume['checkpoint']['current'] = 'PRE_FLASH'
                      resume['checkpoint']['next_action'] = 'PRE_FLASH'
                      resume['pending'] = ['PRE_FLASH']
                      intent['firmware_state']['next_stage'] = 'PRE_FLASH'
                      sync_mode = 'FLASH_AND_VERIFY'
              else:
                  artifact_gate['status'] = 'FAIL'
                  resume['current_gate'] = 'ARTIFACT'
                  resume['next_action'] = 'ARTIFACT'
                  resume['checkpoint']['current'] = 'ARTIFACT'
                  resume['checkpoint']['next_action'] = 'ARTIFACT'
                  resume['pending'] = ['ARTIFACT']
                  intent['firmware_state']['current_stage'] = 'ARTIFACT'
                  intent['firmware_state']['next_stage'] = 'ARTIFACT'

          resume['checkpoint']['turn_count'] = int(resume['checkpoint'].get('turn_count', 0)) + 1
          resume['status'] = 'RESUME_SAFE'
          resume['instruction_allowed'] = True
          resume['conflicts'] = []
          resume.pop('semantic_sha256', None)
          compact = json.dumps(resume, separators=(',', ':'), ensure_ascii=False)
          resume['semantic_sha256'] = hashlib.sha256(compact.encode()).hexdigest()

          intent['firmware_state']['active_run_id'] = run_id
          intent['firmware_state']['active_source_sha'] = source_sha
          intent['firmware_state']['candidate_release_conclusion'] = candidate_release or 'missing'
          intent['guardrails']['do_not_dispatch_duplicate_build'] = True
          intent['guardrails']['do_not_interrupt_active_run'] = True

          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          resume_path.write_text(json.dumps(resume, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          intent_path.write_text(json.dumps(intent, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'mode={sync_mode}\n')
              out.write(f'release_mode={release_mode}\n')
          print(f'PASS: durable state reconciled run={run_id} build={build_result} acceptance={acceptance} upload={upload} candidate_release={candidate_release} release_mode={release_mode} next={resume["next_action"]}')
          PY

      - name: Finalize RELEASE_ONLY GitHub Release
        if: ${{ steps.reconcile.outputs.mode == 'release_only' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $policy = Get-Content -Raw ./production/release-mode.json | ConvertFrom-Json
          if ([string]$policy.mode -ne 'RELEASE_ONLY') { throw 'ARTHUR_RELEASE_ONLY_MODE_REQUIRED' }
          if ([bool]$policy.automatic_flash) { throw 'ARTHUR_RELEASE_ONLY_AUTOMATIC_FLASH_FORBIDDEN' }

          $resume = Get-Content -Raw ./production/resume-state.json | ConvertFrom-Json
          $intent = Get-Content -Raw ./production/operator-intent.json | ConvertFrom-Json
          if ([string]$intent.intent_type -ne 'EXECUTE_FIRMWARE') { throw 'ARTHUR_RELEASE_ONLY_INTENT_TYPE_INVALID' }
          if ([string]$intent.authorization_scope -ne 'FIRMWARE_RELEASE') { throw 'ARTHUR_RELEASE_ONLY_SCOPE_INVALID' }
          if (-not [bool]$intent.firmware_execution_authorized) { throw 'ARTHUR_RELEASE_ONLY_EXECUTION_NOT_AUTHORIZED' }
          if ([string]$intent.execution_id -ne [string]$resume.execution_id) { throw 'ARTHUR_RELEASE_ONLY_EXECUTION_ID_MISMATCH' }
          if ([string]$resume.current_gate -ne 'RELEASE_GATE') { throw 'ARTHUR_RELEASE_ONLY_RELEASE_GATE_NOT_READY' }

          [long]$runId = [long]$env:SOURCE_RUN_ID
          [long]$artifactId = [long]$resume.production.artifact_id
          $sourceSha = ([string]$env:SOURCE_SHA).Trim().ToLowerInvariant()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'ARTHUR_RELEASE_ONLY_SOURCE_SHA_INVALID' }
          if ([long]$resume.production.github_run_id -ne $runId) { throw 'ARTHUR_RELEASE_ONLY_RUN_ID_MISMATCH' }
          if (([string]$resume.source.accepted_source_sha).ToLowerInvariant() -ne $sourceSha) { throw 'ARTHUR_RELEASE_ONLY_SOURCE_MISMATCH' }

          $releaseTag = ([string]$resume.release).Trim()
          if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'ARTHUR_RELEASE_ONLY_RELEASE_TAG_REQUIRED' }
          $candidateTag = "arthur-update-$runId"

          $candidateJson = & gh api "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$candidateTag"
          if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_CANDIDATE_RELEASE_MISSING' }
          $candidate = $candidateJson | ConvertFrom-Json
          if (([string]$candidate.target_commitish).ToLowerInvariant() -ne $sourceSha) { throw 'ARTHUR_RELEASE_ONLY_CANDIDATE_TARGET_MISMATCH' }

          $assetDir = Join-Path $env:RUNNER_TEMP "arthur-release-only-$runId"
          if (Test-Path $assetDir) { Remove-Item -Recurse -Force $assetDir }
          New-Item -ItemType Directory -Path $assetDir | Out-Null
          & gh release download $candidateTag --repo $env:GITHUB_REPOSITORY --dir $assetDir
          if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_CANDIDATE_DOWNLOAD_FAILED' }

          $sysupgrade = @(Get-ChildItem -LiteralPath $assetDir -File | Where-Object { $_.Name -like '*sysupgrade*.bin' })
          if ($sysupgrade.Count -ne 1 -or $sysupgrade[0].Length -le 0) { throw 'ARTHUR_RELEASE_ONLY_SYSUPGRADE_IDENTITY_INVALID' }
          $factory = @(Get-ChildItem -LiteralPath $assetDir -File | Where-Object { $_.Name -like '*factory*.bin' })
          if ($factory.Count -gt 1) { throw 'ARTHUR_RELEASE_ONLY_FACTORY_IDENTITY_AMBIGUOUS' }
          $checksum = Join-Path $assetDir 'SHA256SUMS.local'
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) { throw 'ARTHUR_RELEASE_ONLY_CHECKSUMS_MISSING' }
          Push-Location $assetDir
          try {
            & sha256sum -c SHA256SUMS.local
            if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_CHECKSUM_VERIFY_FAILED' }
          } finally { Pop-Location }

          $pluginVerification = Join-Path $assetDir 'plugin-verification.txt'
          if (-not (Test-Path -LiteralPath $pluginVerification -PathType Leaf)) { throw 'ARTHUR_RELEASE_ONLY_PLUGIN_EVIDENCE_MISSING' }
          $pluginText = Get-Content -Raw $pluginVerification
          if ($pluginText -notmatch 'PASS: all required LuCI plugins were compiled and are present in the final firmware manifest') { throw 'ARTHUR_RELEASE_ONLY_PLUGIN_GATE_FAILED' }
          if ($pluginText -notmatch 'Verified required plugins: 22') { throw 'ARTHUR_RELEASE_ONLY_PLUGIN_COUNT_FAILED' }

          $metadataPath = Join-Path $assetDir 'update-metadata.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) { throw 'ARTHUR_RELEASE_ONLY_METADATA_MISSING' }
          $metadata = Get-Content -Raw $metadataPath | ConvertFrom-Json
          if (([string]$metadata.project_commit).ToLowerInvariant() -ne $sourceSha) { throw 'ARTHUR_RELEASE_ONLY_METADATA_SOURCE_MISMATCH' }

          $firmware = $sysupgrade[0]
          $firmwareHash = (Get-FileHash -LiteralPath $firmware.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $factoryHash = ''
          if ($factory.Count -eq 1) { $factoryHash = (Get-FileHash -LiteralPath $factory[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }

          $releaseExists = $false
          & gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { $releaseExists = $true }
          if (-not $releaseExists) {
            $assets = @(Get-ChildItem -LiteralPath $assetDir -File | ForEach-Object { $_.FullName })
            $notes = @"
          XinZhaoWrt Arthur $releaseTag

          Published by unattended RELEASE_ONLY after Build, Artifact and Release Gate evidence passed.

          Candidate: $candidateTag
          Source: $sourceSha
          POST_RELEASE_DEVICE_TEST: PENDING_INDEPENDENT
          Known-Good: unchanged until the exact released hash passes the independent device test.
          "@
            & gh release create $releaseTag @assets --repo $env:GITHUB_REPOSITORY --target $sourceSha --title "XinZhaoWrt Arthur $releaseTag" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_CREATE_FAILED' }
          }

          $releaseJson = & gh api "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$releaseTag"
          if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_LOOKUP_FAILED' }
          $release = $releaseJson | ConvertFrom-Json
          if ([bool]$release.draft -or [bool]$release.prerelease) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_NOT_STABLE' }
          if (([string]$release.target_commitish).ToLowerInvariant() -ne $sourceSha) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_TARGET_MISMATCH' }
          $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
          if ($assetNames -notcontains $firmware.Name) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_FIRMWARE_MISSING' }

          $existingDir = Join-Path $env:RUNNER_TEMP "arthur-release-existing-$runId"
          if (Test-Path $existingDir) { Remove-Item -Recurse -Force $existingDir }
          New-Item -ItemType Directory -Path $existingDir | Out-Null
          & gh release download $releaseTag --repo $env:GITHUB_REPOSITORY --pattern $firmware.Name --dir $existingDir
          if ($LASTEXITCODE -ne 0) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_FIRMWARE_DOWNLOAD_FAILED' }
          $publishedFirmware = Join-Path $existingDir $firmware.Name
          $publishedHash = (Get-FileHash -LiteralPath $publishedFirmware -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedHash -ne $firmwareHash) { throw 'ARTHUR_RELEASE_ONLY_RELEASE_HASH_MISMATCH' }

          $evidenceId = "release-$runId"
          $observedAt = [DateTimeOffset]::UtcNow.ToString('o')
          $evidenceRoot = Join-Path ./production/evidence ([string]$resume.execution_id)
          New-Item -ItemType Directory -Path $evidenceRoot -Force | Out-Null
          $releaseEvidence = [ordered]@{
            schema_version = '1.0'
            evidence_id = $evidenceId
            execution_id = [string]$resume.execution_id
            gate_id = 'RELEASE'
            type = 'GITHUB_RELEASE'
            producer = 'ARTHUR_PRODUCTION_STATE_SYNC'
            source_sha = $sourceSha
            github_run_id = $runId
            artifact_id = $artifactId
            release_tag = $releaseTag
            release_id = [long]$release.id
            release_url = [string]$release.html_url
            firmware = $firmware.Name
            firmware_sha256 = $firmwareHash
            factory_sha256 = $factoryHash
            post_release_device_test = 'PENDING_INDEPENDENT'
            known_good_promoted = $false
            observed_at = $observedAt
            result = 'PASS'
          }
          $releaseEvidencePath = Join-Path $evidenceRoot 'github-release-evidence.json'
          [IO.File]::WriteAllText($releaseEvidencePath, ($releaseEvidence | ConvertTo-Json -Depth 20) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

          $indexPath = Join-Path $evidenceRoot 'index.json'
          $index = Get-Content -Raw $indexPath | ConvertFrom-Json
          if (-not ($index.PSObject.Properties.Name -contains 'evidence')) { throw 'ARTHUR_RELEASE_ONLY_EVIDENCE_INDEX_INVALID' }
          $existingEvidence = @($index.evidence | Where-Object { [string]$_.evidence_id -eq $evidenceId })
          if ($existingEvidence.Count -eq 0) {
            $entry = [pscustomobject][ordered]@{
              evidence_id = $evidenceId
              gate_id = 'RELEASE'
              type = 'GITHUB_RELEASE'
              producer = 'ARTHUR_PRODUCTION_STATE_SYNC'
              source_sha = $sourceSha
              github_run_id = $runId
              artifact_id = $artifactId
              candidate_sha256 = $firmwareHash
              device_build_id = ''
              ref = "release:$releaseTag"
              sha256 = $firmwareHash
              observed_at = $observedAt
              result = 'PASS'
            }
            $index.evidence = @($index.evidence) + @($entry)
            [IO.File]::WriteAllText($indexPath, ($index | ConvertTo-Json -Depth 30) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          }

          . ./scripts/arthur-release-only-state.ps1
          . ./scripts/arthur-resume-state.ps1
          $result = Complete-ArthurReleaseOnlyState -ResumeState $resume -OperatorIntent $intent -RunId $runId -ArtifactId $artifactId -ReleaseTag $releaseTag -SourceSha $sourceSha -Firmware $firmware.Name -FirmwareSha256 $firmwareHash -FactorySha256 $factoryHash -ReleaseId ([long]$release.id) -ReleaseUrl ([string]$release.html_url) -EvidenceId $evidenceId -VerifiedAt $observedAt
          $finalResume = $result.resume_state
          $finalIntent = $result.operator_intent
          if ($finalResume.PSObject.Properties.Name -contains 'semantic_sha256') { [void]$finalResume.PSObject.Properties.Remove('semantic_sha256') }
          $semanticHash = Get-ArthurResumeSemanticHash -State $finalResume
          $finalResume | Add-Member -NotePropertyName semantic_sha256 -NotePropertyValue $semanticHash
          [IO.File]::WriteAllText((Resolve-Path ./production/resume-state.json), ($finalResume | ConvertTo-Json -Depth 50) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText((Resolve-Path ./production/operator-intent.json), ($finalIntent | ConvertTo-Json -Depth 50) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))

          . ./scripts/arthur-firmware-event-ledger.ps1
          [void](Add-ArthurFirmwareEvent -Path ./production/firmware-events.jsonl -Event 'PRODUCTION_RELEASED' -Stage 'PRODUCTION_RELEASED' -Source 'ARTHUR_RELEASE_ONLY_STATE_SYNC' -Timestamp $observedAt -Data ([ordered]@{
            execution_id = [string]$finalResume.execution_id
            run_id = $runId
            artifact_id = $artifactId
            release_tag = $releaseTag
            firmware = $firmware.Name
            sha256 = $firmwareHash
            post_release_device_test = 'PENDING_INDEPENDENT'
          }))

          Write-Host "RELEASE_ONLY_FINALIZED=PASS release=$releaseTag run=$runId firmware=$($firmware.Name) sha256=$firmwareHash"
          Write-Host 'POST_RELEASE_DEVICE_TEST=PENDING_INDEPENDENT'

      - name: Preserve explicit FLASH_AND_VERIFY compatibility state
        if: ${{ steps.reconcile.outputs.mode == 'FLASH_AND_VERIFY' }}
        run: |
          echo 'FLASH_AND_VERIFY_COMPATIBILITY=PASS'
          echo 'State Sync preserved PRE_FLASH only because release-mode.json explicitly selected FLASH_AND_VERIFY.'

      - name: Commit state-only reconciliation
        env:
          SYNC_MODE: ${{ steps.reconcile.outputs.mode }}
        run: |
          set -Eeuo pipefail
          if [ "$SYNC_MODE" = skip ] || [ "$SYNC_MODE" = terminal_noop ]; then
            echo "PASS: no durable state mutation required mode=$SYNC_MODE"
            exit 0
          fi
          git config user.name 'XinZhaoWrt State Bot'
          git config user.email 'xinzhaowrt@users.noreply.github.com'
          git add production/resume-state.json production/operator-intent.json production/firmware-events.jsonl production/evidence/
          if git diff --cached --quiet; then
            echo 'PASS: durable production state already reconciled.'
            exit 0
          fi
          git commit -m "state: reconcile Arthur production execution from run ${SOURCE_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo 'BLOCKED: unable to persist state reconciliation after retries' >&2
          exit 1
