name: XinZhaoWrt Runner Preflight

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runner-preflight.yml'
      - 'scripts/ci-controller.ps1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner identity and tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "whoami: $(whoami)"
          Write-Host "USERPROFILE: $env:USERPROFILE"
          Write-Host "PATH: $env:PATH"

          foreach ($tool in @('git','gh','codex')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              throw "PREFLIGHT_FAILED: required tool not found: $tool"
            }
            Write-Host "$tool => $($cmd.Source)"
          }

          git --version
          gh --version | Select-Object -First 1
          codex --version

      - name: Verify GitHub token access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fullName = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.full_name'
          if ($LASTEXITCODE -ne 0 -or $fullName -ne $env:GITHUB_REPOSITORY) {
            throw "PREFLIGHT_FAILED: GH_TOKEN cannot access $env:GITHUB_REPOSITORY"
          }
          Write-Host "GitHub token OK: $fullName"

      - name: Verify controller script syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\ci-controller.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $text = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
            throw "PREFLIGHT_FAILED: ci-controller.ps1 syntax errors:`n$text"
          }
          if (-not (Select-String -Path $script -Pattern 'Get-CodexExecutable' -Quiet)) {
            throw 'PREFLIGHT_FAILED: controller does not contain Windows Codex executable resolver.'
          }
          Write-Host 'Controller PowerShell syntax OK.'

      - name: Verify Codex non-interactive authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lastMessage = Join-Path $env:RUNNER_TEMP 'codex-preflight-last-message.txt'
          $prompt = 'Reply exactly CODEX_PREFLIGHT_OK. Do not modify files.'

          $codexPs1 = (Get-Command codex -ErrorAction Stop).Source
          $codexCmd = Join-Path (Split-Path $codexPs1 -Parent) 'codex.cmd'
          if (-not (Test-Path $codexCmd)) {
            $codexCmd = $codexPs1
          }
          Write-Host "Codex exec shim: $codexCmd"

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $output = ($prompt | & $codexCmd exec --sandbox read-only -c 'approval_policy="never"' -C $env:GITHUB_WORKSPACE -o $lastMessage - 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference

          Write-Host $output
          if ($exitCode -ne 0) {
            throw "PREFLIGHT_FAILED: codex exec failed with exit code $exitCode"
          }
          if (-not (Test-Path $lastMessage)) {
            throw 'PREFLIGHT_FAILED: Codex did not produce a last-message file.'
          }
          $final = (Get-Content -Raw $lastMessage).Trim()
          Write-Host "Codex final: $final"
          if ($final -ne 'CODEX_PREFLIGHT_OK') {
            throw "PREFLIGHT_FAILED: unexpected Codex response: $final"
          }

      - name: Verify Codex workspace-write sandbox
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:GITHUB_WORKSPACE 'codex-write-probe.txt'
          $lastMessage = Join-Path $env:RUNNER_TEMP 'codex-write-probe-last-message.txt'
          Remove-Item $probe -Force -ErrorAction SilentlyContinue

          $prompt = 'Create a file named codex-write-probe.txt in the repository root containing exactly CODEX_WORKSPACE_WRITE_OK and one trailing newline. Do not modify any other file. Then reply exactly CODEX_WORKSPACE_WRITE_OK.'
          $codexPs1 = (Get-Command codex -ErrorAction Stop).Source
          $codexCmd = Join-Path (Split-Path $codexPs1 -Parent) 'codex.cmd'
          if (-not (Test-Path $codexCmd)) {
            $codexCmd = $codexPs1
          }

          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $output = ($prompt | & $codexCmd exec --sandbox workspace-write -c 'windows.sandbox="unelevated"' -c 'approval_policy="never"' -C $env:GITHUB_WORKSPACE -o $lastMessage - 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          Write-Host $output

          if ($exitCode -ne 0) {
            throw "PREFLIGHT_FAILED: Codex workspace-write exec failed with exit code $exitCode"
          }
          if (-not (Test-Path $probe)) {
            throw 'PREFLIGHT_FAILED: Codex workspace-write did not create the probe file.'
          }
          $probeText = (Get-Content -Raw $probe).Trim()
          if ($probeText -ne 'CODEX_WORKSPACE_WRITE_OK') {
            throw "PREFLIGHT_FAILED: unexpected probe content: $probeText"
          }
          $final = if (Test-Path $lastMessage) { (Get-Content -Raw $lastMessage).Trim() } else { '' }
          if ($final -ne 'CODEX_WORKSPACE_WRITE_OK') {
            throw "PREFLIGHT_FAILED: unexpected Codex workspace-write final response: $final"
          }

          Remove-Item $probe -Force
          Write-Host 'Codex workspace-write OK on Windows runner.'

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## XinZhaoWrt Runner Preflight" >> $env:GITHUB_STEP_SUMMARY
          "Runner: $(whoami)" >> $env:GITHUB_STEP_SUMMARY
          "Profile: $env:USERPROFILE" >> $env:GITHUB_STEP_SUMMARY
