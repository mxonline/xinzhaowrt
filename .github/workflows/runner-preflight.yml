name: XinZhaoWrt Runner Preflight

'on':
  push:
    branches:
      - main
    paths:
      - '.github/workflows/runner-preflight.yml'
      - 'scripts/ci-controller.ps1'
      - 'scripts/ci-controller-v2.ps1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  preflight:
    runs-on:
      - self-hosted
      - windows
      - x64
      - xinzhaowrt-controller
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner identity and tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "whoami: $(whoami)"
          Write-Host "USERPROFILE: $env:USERPROFILE"
          Write-Host "PATH: $env:PATH"
          foreach ($tool in @('git','gh','codex')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "PREFLIGHT_FAILED: required tool not found: $tool" }
            Write-Host "$tool => $($cmd.Source)"
          }
          git --version
          gh --version | Select-Object -First 1
          codex --version

      - name: Verify GitHub token access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fullName = gh api "repos/$env:GITHUB_REPOSITORY" --jq '.full_name'
          if ($LASTEXITCODE -ne 0 -or $fullName -ne $env:GITHUB_REPOSITORY) {
            throw "PREFLIGHT_FAILED: GH_TOKEN cannot access $env:GITHUB_REPOSITORY"
          }
          Write-Host "GitHub token OK: $fullName"

      - name: Verify controller v2 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('scripts\ci-controller.ps1','scripts\ci-controller-v2.ps1')) {
            $script = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path $script)) { throw "PREFLIGHT_FAILED: missing controller script: $relative" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $text = ($errors | ForEach-Object { $_.ToString() }) -join "`n"
              throw "PREFLIGHT_FAILED: $relative syntax errors:`n$text"
            }
          }
          if (-not (Select-String -Path (Join-Path $env:GITHUB_WORKSPACE 'scripts\ci-controller-v2.ps1') -Pattern 'Invoke-StructuredCodexRepair' -Quiet)) {
            throw 'PREFLIGHT_FAILED: controller v2 structured repair function missing.'
          }
          Write-Host 'Controller PowerShell syntax OK.'

      - name: Verify Codex non-interactive authentication
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lastMessage = Join-Path $env:RUNNER_TEMP 'codex-preflight-last-message.txt'
          $prompt = 'Reply exactly CODEX_PREFLIGHT_OK. Do not use tools. Do not modify files.'
          $codexPs1 = (Get-Command codex -ErrorAction Stop).Source
          $codexCmd = Join-Path (Split-Path $codexPs1 -Parent) 'codex.cmd'
          if (-not (Test-Path $codexCmd)) { $codexCmd = $codexPs1 }
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $output = ($prompt | & $codexCmd exec --sandbox read-only -c 'approval_policy="never"' -o $lastMessage - 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          Write-Host $output
          if ($exitCode -ne 0) { throw "PREFLIGHT_FAILED: codex exec failed with exit code $exitCode" }
          if (-not (Test-Path $lastMessage)) { throw 'PREFLIGHT_FAILED: Codex did not produce a last-message file.' }
          $final = (Get-Content -Raw $lastMessage).Trim()
          if ($final -ne 'CODEX_PREFLIGHT_OK') { throw "PREFLIGHT_FAILED: unexpected Codex response: $final" }

      - name: Verify structured no-tool repair response
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $lastMessage = Join-Path $env:RUNNER_TEMP 'codex-structured-probe.json'
          $prompt = @'
          Do not use shell, filesystem, network, or tools. Analyze only this text.
          Return ONLY this JSON object with no markdown:
          {"status":"repairable","root_cause":"synthetic test","error_signature":"SYNTHETIC","repair_strategy":"none","files_needed":["scripts/build.sh"]}
          '@
          $codexPs1 = (Get-Command codex -ErrorAction Stop).Source
          $codexCmd = Join-Path (Split-Path $codexPs1 -Parent) 'codex.cmd'
          if (-not (Test-Path $codexCmd)) { $codexCmd = $codexPs1 }
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $output = ($prompt | & $codexCmd exec --sandbox read-only -c 'approval_policy="never"' -o $lastMessage - 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousPreference
          Write-Host $output
          if ($exitCode -ne 0) { throw "PREFLIGHT_FAILED: structured Codex probe failed with exit code $exitCode" }
          $obj = Get-Content -Raw $lastMessage | ConvertFrom-Json
          if ($obj.status -ne 'repairable' -or $obj.error_signature -ne 'SYNTHETIC') {
            throw 'PREFLIGHT_FAILED: structured Codex response was not parseable/expected.'
          }
          Write-Host 'Structured no-tool Codex path OK; workspace-write is intentionally not required.'

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## XinZhaoWrt Runner Preflight" >> $env:GITHUB_STEP_SUMMARY
          "Runner: $(whoami)" >> $env:GITHUB_STEP_SUMMARY
          "Profile: $env:USERPROFILE" >> $env:GITHUB_STEP_SUMMARY
