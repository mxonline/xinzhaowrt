name: Arthur v0.1.3 Live Deploy Contract

on:
  push:
    branches:
      - feature/arthur-v013-next

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
      - name: Verify safe live deployment contract
        shell: pwsh
        run: ./tests/v013-live-feature-deploy.tests.ps1
